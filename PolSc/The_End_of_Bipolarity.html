<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The End of Bipolarity — Political Science XII</title>
<style>
:root{
  --font:'Calibri','Segoe UI','Segoe UI Variable',Candara,'Helvetica Neue',Helvetica,Arial,sans-serif;

  --bg:#0a0e1c;
  --bg-elev:#121830;
  --bg-elev2:#1a2140;
  --glass:rgba(255,255,255,0.055);
  --glass-border:rgba(255,255,255,0.09);
  --violet:#8b5cf6;
  --violet-dim:rgba(139,92,246,0.16);
  --violet-text:#d9c9ff;
  --cyan:#22d3ee;
  --cyan-dim:rgba(34,211,238,0.16);
  --crimson:#fb4570;
  --crimson-dim:rgba(251,69,112,0.16);
  --crimson-text:#ff8aa8;
  --amber:#f5b942;
  --amber-dim:rgba(245,185,66,0.16);
  --text:#e8ebf5;
  --text-dim:#9aa3c0;
  --text-faint:#6b7394;
  --glow1:rgba(139,92,246,0.14);
  --glow2:rgba(34,211,238,0.10);
  --scrollbar:rgba(255,255,255,0.12);
  --card-face:linear-gradient(160deg, var(--bg-elev2), var(--bg-elev));
  --kw-bg:rgba(255,255,255,0.07);
  --kw-text:#ffffff;
  --mastered-bg:rgba(34,197,94,0.16);
  --mastered-border:#22c55e;
  --mastered-text:#86efac;
}
[data-theme="light"]{
  --bg:#f4f5fb;
  --bg-elev:#ffffff;
  --bg-elev2:#eef0fb;
  --glass:rgba(20,20,45,0.045);
  --glass-border:rgba(20,20,45,0.11);
  --violet:#7c3aed;
  --violet-dim:rgba(124,58,237,0.12);
  --violet-text:#6d28d9;
  --cyan:#0e7490;
  --cyan-dim:rgba(14,116,144,0.12);
  --crimson:#e11d48;
  --crimson-dim:rgba(225,29,72,0.11);
  --crimson-text:#be123c;
  --amber:#b45309;
  --amber-dim:rgba(180,83,9,0.13);
  --text:#191d2e;
  --text-dim:#4b5170;
  --text-faint:#7b8098;
  --glow1:rgba(124,58,237,0.07);
  --glow2:rgba(14,116,144,0.06);
  --scrollbar:rgba(20,20,45,0.16);
  --card-face:linear-gradient(160deg, #ffffff, #f3f4fc);
  --kw-bg:rgba(20,20,45,0.07);
  --kw-text:#191d2e;
  --mastered-bg:rgba(22,163,74,0.13);
  --mastered-border:#16a34a;
  --mastered-text:#15803d;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, var(--glow1), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, var(--glow2), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  padding-bottom:104px;
  transition:background-color .25s ease, color .25s ease;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

.topbar{ padding:18px 16px 10px; max-width:640px; margin:0 auto; }
.top-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:2px; }
.book{ font-size:12px; color:var(--text-faint); letter-spacing:0.02em; }
.theme-btn{
  border:1px solid var(--glass-border); background:var(--glass); color:var(--text-dim);
  width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
}
.theme-btn svg{ width:16px; height:16px; }
.topbar h1{ font-family:var(--font); font-weight:700; font-size:22px; line-height:1.25; margin:0 0 10px; color:var(--text); }
.progress-row{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-dim); }
.progress-track{ flex:1; height:4px; background:var(--glass); border-radius:2px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--violet), var(--cyan)); border-radius:2px; transition:width .35s ease; }

.filter-toggle{ max-width:640px; margin:10px auto 0; padding:0 16px; display:flex; justify-content:flex-end; }
.filter-toggle button{
  background:var(--glass); border:1px solid var(--glass-border); color:var(--text-dim);
  font-family:var(--font); font-size:12.5px; padding:6px 12px; border-radius:20px;
  cursor:pointer; display:flex; align-items:center; gap:6px;
}
.filter-toggle button:hover{ color:var(--text); border-color:var(--glass-border); }
.filter-panel{ max-width:640px; margin:8px auto 0; padding:0 16px; max-height:0; overflow:hidden; transition:max-height .3s ease; }
.filter-panel.open{ max-height:260px; }
.filter-inner{ background:var(--glass); border:1px solid var(--glass-border); border-radius:14px; padding:12px 14px; }
.filter-group-label{ font-size:11px; color:var(--text-faint); margin:6px 0 6px; }
.chip-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px;}
.chip{
  font-family:var(--font); font-size:12px; padding:6px 11px; border-radius:16px;
  background:var(--glass); border:1px solid var(--glass-border); color:var(--text-dim);
  cursor:pointer; user-select:none; transition:background .15s, color .15s, border-color .15s;
}
.chip[data-active="true"]{ background:var(--violet-dim); border-color:var(--violet); color:var(--violet-text); }
.chip .count{ opacity:0.65; margin-left:3px; }

.stage{ max-width:640px; margin:18px auto 0; padding:0 16px; }
.card-scene{ perspective:1600px; height:420px; }
.card{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,.2,.2,1); cursor:pointer; }
.card.flipped{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:20px; border:1px solid var(--glass-border);
  background:var(--card-face);
  padding:26px 24px; overflow-y:auto;
  display:flex; flex-direction:column;
}
.face::-webkit-scrollbar{ width:5px; }
.face::-webkit-scrollbar-thumb{ background:var(--scrollbar); border-radius:3px; }
.face-front{ justify-content:center; }
.face-back{ transform:rotateY(180deg); justify-content:flex-start; }

.badge{ align-self:flex-start; font-size:11.5px; padding:5px 11px; border-radius:8px; margin-bottom:16px; font-weight:700; letter-spacing:0.01em; }
.badge.amber{ background:var(--amber-dim); color:var(--amber); }
.badge.cyan{ background:var(--cyan-dim); color:var(--cyan); }
.badge.crimson{ background:var(--crimson-dim); color:var(--crimson-text); }
.badge.violet{ background:var(--violet-dim); color:var(--violet-text); }

.front-prompt{ font-family:var(--font); font-size:21px; line-height:1.42; font-weight:700; color:var(--text); white-space:pre-line; }
.tap-hint{ margin-top:auto; padding-top:14px; font-size:12px; color:var(--text-faint); text-align:center; }

.back-title{ font-family:var(--font); font-size:16px; font-weight:700; color:var(--cyan); margin:0 0 10px; }
.back-title.rep{ margin-top:16px; }
.bullets{ margin:0 0 4px; padding-left:18px; color:var(--text); font-size:14.5px; line-height:1.55; }
.bullets li{ margin-bottom:6px; }
.bullets b{ color:var(--text); }
.kw-row{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 4px; }
.kw{ font-size:12px; padding:3px 9px; border-radius:7px; background:var(--kw-bg); color:var(--kw-text); font-weight:700; }
.seq-list{ counter-reset:seq; list-style:none; padding:0; margin:0 0 4px; }
.seq-list li{ counter-increment:seq; position:relative; padding-left:26px; margin-bottom:8px; font-size:14px; color:var(--text); line-height:1.5; }
.seq-list li::before{ content:counter(seq); position:absolute; left:0; top:0; width:18px; height:18px; border-radius:50%; background:var(--violet-dim); color:var(--violet-text); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.distinction-box{ background:var(--crimson-dim); border-left:3px solid var(--crimson); border-radius:6px; padding:10px 12px; font-size:13.5px; color:var(--crimson-text); margin-top:10px; line-height:1.5; }
.mastery-row{ margin-top:auto; padding-top:14px; display:flex; gap:8px; }
.mastery-btn{ flex:1; padding:9px 8px; border-radius:10px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text-dim); font-family:var(--font); font-size:12.5px; font-weight:700; cursor:pointer; }
.mastery-btn[data-state="mastered"]{ background:var(--mastered-bg); border-color:var(--mastered-border); color:var(--mastered-text); }
.mastery-btn[data-state="review"]{ background:var(--crimson-dim); border-color:var(--crimson); color:var(--crimson-text); }

.controls{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, var(--bg) 55%, transparent); pointer-events:none; }
.control-cluster{ pointer-events:auto; display:flex; align-items:center; gap:8px; background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(14px); border-radius:22px; padding:8px; }
.ctrl-btn{ border:none; background:var(--kw-bg); color:var(--text); width:44px; height:44px; border-radius:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.ctrl-btn:active{ filter:brightness(1.2); }
.ctrl-btn.primary{ background:linear-gradient(135deg, var(--violet), #6d28d9); width:56px; height:44px; }
.ctrl-btn.primary svg{ stroke:#fff; }
.ctrl-btn svg{ width:19px; height:19px; stroke:var(--text); }
.ctrl-btn:disabled{ opacity:0.3; }

.grid-toggle-row{ max-width:640px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; }
.mode-btn{ flex:1; padding:9px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text-dim); font-family:var(--font); font-size:13px; font-weight:700; cursor:pointer; }
.mode-btn[data-active="true"]{ background:var(--violet-dim); color:var(--violet-text); border-color:var(--violet); }

.grid-wrap{ max-width:960px; margin:16px auto 0; padding:0 16px 20px; display:none; }
.grid-wrap.active{ display:block; }
.grid-search{ width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text); font-family:var(--font); font-size:14px; margin-bottom:14px; }
.grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; }
.gcard{ background:var(--bg-elev); border:1px solid var(--glass-border); border-radius:14px; padding:16px; }
.gcard .front-prompt{ font-size:15px; margin-bottom:8px; }
.gcard .bullets{ font-size:13px; }

.stage.hidden, .grid-toggle-row.hidden{ display:none; }
.empty-state{ text-align:center; color:var(--text-faint); padding:40px 20px; font-size:14px; }

@media (max-width:400px){
  .card-scene{ height:460px; }
  .front-prompt{ font-size:19px; }
  .topbar h1{ font-size:19px; }
}
</style>
</head>

const CARDS = [{"id": "eob-01", "front": "What was the 'Second World'?", "badge": "CUET Fact/Date", "category": "CUET Shortcut", "definition": ["Term for the Soviet Union and its allied socialist bloc of Eastern Europe during the Cold War", "Contrasted with the capitalist 'First World' (US-led West) and the non-aligned 'Third World'", "Organised around centrally planned, state-controlled economies"], "keywords": ["Second World", "USSR", "Socialist bloc"], "sequence": [], "distinction": null}, {"id": "eob-02", "front": "Group the 15 Soviet republics by region — a quick memory aid.", "badge": "CUET Fact/Date", "category": "CUET Shortcut", "definition": ["Baltic: Estonia, Latvia, Lithuania", "Slavic core: Russia, Ukraine, Belarus", "Caucasus: Georgia, Armenia, Azerbaijan", "Central Asia: Kazakhstan, Kyrgyzstan, Tajikistan, Turkmenistan, Uzbekistan", "Other: Moldova"], "keywords": ["15 republics", "Baltic", "Caucasus", "Central Asia"], "sequence": [], "distinction": null}, {"id": "eob-03", "front": "Define Glasnost.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Russian for 'openness'", "Policy introduced by Gorbachev in 1985 allowing free flow of information and greater press and political freedom", "Exposed the failures and repression of the Soviet system to ordinary citizens for the first time"], "keywords": ["Glasnost", "Openness", "1985"], "sequence": [], "distinction": null}, {"id": "eob-04", "front": "Define Perestroika.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Russian for 'restructuring'", "Gorbachev's policy of economic and political reform meant to revive a stagnant Soviet economy", "Aimed to introduce limited market mechanisms and decentralise decision-making"], "keywords": ["Perestroika", "Restructuring"], "distinction": "Glasnost = political and informational opening. Perestroika = economic and structural reform. Together, they are seen as accelerating disintegration rather than saving the USSR.", "sequence": []}, {"id": "eob-05", "front": "List the economic causes behind the disintegration of the USSR.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Economy stagnated after the Brezhnev era, unable to keep pace with Western technology", "Heavy defence and military spending starved the consumer goods sector", "Chronic shortages of food and basic goods despite decades of central planning", "Long queues for everyday items bred widespread public discontent"], "keywords": ["Stagnation", "Consumer shortages", "Military spending"], "sequence": [], "distinction": null}, {"id": "eob-06", "front": "List the political causes behind the disintegration of the USSR.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Highly centralised, one-party (Communist Party) rule with no real accountability to citizens", "Bureaucratic authoritarianism disconnected rulers from popular aspirations", "Denial of basic freedoms bred resentment, especially among the educated middle class", "Nationalist and ethnic movements within the republics demanded sovereignty"], "keywords": ["One-party rule", "Bureaucratic authoritarianism", "Nationalism"], "sequence": [], "distinction": null}, {"id": "eob-07", "front": "What immediate event triggered the final collapse of the USSR in 1991?", "badge": "CUET Fact/Date", "category": "Treaties & Chronology", "definition": ["Hardline Communist leaders attempted a coup against Gorbachev in August 1991", "Boris Yeltsin, President of the Russian Republic, rallied public resistance and defeated the coup", "The coup's failure destroyed the Communist Party's authority and accelerated the republics' declarations of independence", "USSR formally dissolved on 25 December 1991"], "keywords": ["August 1991 coup", "Yeltsin", "25 Dec 1991"], "sequence": [], "distinction": null}, {"id": "eob-08", "front": "What is the Commonwealth of Independent States (CIS)?", "badge": "CUET Fact/Date", "category": "Treaties & Chronology", "definition": ["A loose association formed by most former Soviet republics after the USSR's disintegration in December 1991", "Created to manage shared economic, security, and residual Soviet-era concerns", "Headquartered in Minsk, Belarus", "The Baltic states (Estonia, Latvia, Lithuania) did not join"], "keywords": ["CIS", "Minsk", "Dec 1991"], "sequence": [], "distinction": null}, {"id": "eob-09", "front": "Did Russia inherit the USSR's permanent UN Security Council seat?", "badge": "CUET Fact/Date", "category": "Treaties & Chronology", "definition": ["Yes — Russia was recognised as the successor state to the USSR", "It retained the permanent seat and veto power in the UN Security Council", "It also inherited the bulk of the Soviet nuclear arsenal and diplomatic assets"], "keywords": ["UNSC seat", "Successor state", "Nuclear arsenal"], "sequence": [], "distinction": null}, {"id": "eob-10", "front": "Define Shock Therapy.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["The model of transition from a command economy to a capitalist market economy adopted by most former Second World countries after 1991", "Prescribed and promoted by Western advisers, the IMF, and the World Bank", "Aimed at the fastest possible route to a market economy, unlike China's gradual reform path"], "keywords": ["Shock Therapy", "IMF", "World Bank"], "sequence": [], "distinction": null}, {"id": "eob-11", "front": "List the core features of Shock Therapy.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Total shift from state ownership to private property ownership", "Immediate switch to free trade and currency convertibility", "Rapid privatisation of state-owned industry and agriculture", "Withdrawal of the state from welfare, price controls, and social-sector spending"], "keywords": ["Privatisation", "Free trade", "State withdrawal"], "sequence": [], "distinction": null}, {"id": "eob-12", "front": "List the economic consequences of Shock Therapy in Russia.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Collapse of existing structures of production and the social welfare system", "Hyperinflation and near-worthlessness of the rouble wiped out personal savings", "Dismantling of collective farms threatened food security", "State assets were sold off cheaply, creating a powerful oligarch class", "GDP contracted sharply, with the economy shrinking to roughly half its pre-1991 size by the mid-1990s"], "keywords": ["Rouble collapse", "Oligarchs", "GDP contraction"], "sequence": [], "distinction": null}, {"id": "eob-13", "front": "What social consequences followed Shock Therapy?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Sharp rise in poverty; large sections of the population pushed below subsistence level", "Resources were redistributed in favour of an already privileged few, worsening inequality", "Withdrawal of state subsidies hit the poor and pensioners hardest", "Organised crime and the 'Russian mafia' grew, linked to the privatisation process"], "keywords": ["Poverty rise", "Inequality", "Organised crime"], "sequence": [], "distinction": null}, {"id": "eob-14", "front": "What kind of political structure emerged in Russia after 1991?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["A powerful, directly-elected President with wide executive authority", "A comparatively weaker Parliament (Duma)", "Russia retained a federal structure but faced separatist conflict, notably in Chechnya"], "keywords": ["Presidential system", "Duma", "Chechnya"], "sequence": [], "distinction": null}, {"id": "eob-15", "front": "Why are the Central Asian republics strategically important?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Rich reserves of oil and natural gas, especially around the Caspian Sea basin", "Located at the crossroads of Asian and European trade and energy routes", "Ethnically diverse, Muslim-majority republics with historical and cultural depth", "Became an arena of competition among global and regional powers for energy and influence"], "keywords": ["Caspian Sea", "Oil and gas", "Strategic location"], "sequence": [], "distinction": null}, {"id": "eob-16", "front": "Name the five Central Asian republics formed after Soviet disintegration.", "badge": "CUET Fact/Date", "category": "Treaties & Chronology", "definition": ["Kazakhstan", "Kyrgyzstan", "Tajikistan", "Turkmenistan", "Uzbekistan"], "keywords": ["Kazakhstan", "Uzbekistan", "Central Asian republics"], "sequence": [], "distinction": null}, {"id": "eob-17", "front": "How did India–Russia relations evolve after 1991?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["India maintained continuity of the special/strategic relationship built with the USSR", "Cooperation continued in defence supplies, nuclear energy, and space technology", "Both countries hold converging positions on Kashmir, terrorism, and a multipolar world order", "India pursued a 'Connect Central Asia' policy for energy security and counter-terrorism cooperation with the Central Asian republics"], "keywords": ["India-Russia", "Strategic partnership", "Connect Central Asia"], "sequence": [], "distinction": null}, {"id": "eob-18", "front": "What was the immediate global political consequence of the USSR's disintegration?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["End of the Cold War and the decades-long ideological rivalry between capitalism and socialism", "Collapse of bipolarity — a world no longer organised around two rival superpower blocs", "Emergence of the United States as the world's sole (unipolar) superpower", "Redrawing of the political map of Europe and Central Asia with new independent states"], "keywords": ["Cold War ends", "Unipolarity", "New states"], "sequence": [], "distinction": null}, {"id": "eob-19", "front": "CUET-style: Match the term to its meaning — Glasnost, Perestroika, Shock Therapy, CIS.", "badge": "CUET Fact/Date", "category": "CUET Shortcut", "definition": ["Glasnost = political openness and free flow of information", "Perestroika = economic and structural restructuring", "Shock Therapy = rapid capitalist transition model", "CIS = post-Soviet cooperative association of former republics"], "keywords": ["Match the following"], "sequence": [], "distinction": null}, {"id": "eob-20", "front": "What are Second World countries following Shock Therapy commonly called?", "badge": "CUET Fact/Date", "category": "CUET Shortcut", "definition": ["'Transition economies' — countries moving from a command economy to a market economy", "Includes Russia, the Central Asian republics, and Eastern European states like Poland and Hungary"], "keywords": ["Transition economies"], "sequence": [], "distinction": null}, {"id": "eob-21", "front": "Which major country adopted a gradual, phased path instead of Shock Therapy?", "badge": "CUET Fact/Date", "category": "CUET Shortcut", "definition": ["China", "Chose incremental economic liberalisation while retaining Communist Party political control", "Its economy grew steadily, unlike the sharp contraction seen under Russia's shock-therapy model"], "keywords": ["China", "Gradual reform"], "distinction": "Shock Therapy (Russia) = fast, total, state-withdrawal model. Chinese model = gradual, state-guided market opening without political liberalisation.", "sequence": []}, {"id": "eob-22", "front": "Assertion: The disintegration of the USSR ended ideological confrontation in world politics.\nReason: It led to the dominance of liberal democracy and capitalism as the preferred model worldwide.", "badge": "Assertion-Reasoning", "category": "Assertion & Reason Prep", "definition": ["Both Assertion and Reason are true, and the Reason correctly ex come"], "sequence": [], "distinction": null}, {"id": "eob-26", "front": "Assertion: The Baltic states joined the CIS after 1991.\nReason: All former Soviet republics automatically became CIS members.", "badge": "Assertion-Reasoning", "category": "Assertion & Reason Prep", "definition": ["Both Assertion and Reason are false", "Estonia, Latvia, and Lithuania did NOT join the CIS", "CIS membership was voluntary, not automatic, for former Soviet republics"], "keywords": ["Both false", "Baltic states excluded"], "sequence": [], "distinction": null}, {"id": "eob-27", "front": "Assertion: Russia's transition to a market economy after 1991 increased economic inequality.\nReason: State assets were transferred largely to a small class of new owners.", "badge": "Assertion-Reasoning", "category": "Assertion & Reason Prep", "definition": ["Both Assertion and Reason are true, and the Reason correctly explains the Assertion", "Rapid, poorly regulated privatisation created the Russian oligarch class while ordinary citizens lost savings and safety nets"], "keywords": ["Both true", "Oligarchs"], "sequence": [], "distinction": null}, {"id": "eob-28", "front": "Who was General Secretary of the Communist Party of the Soviet Union from 1985, and initiated reform?", "badge": "Map/Cartoon Anchor", "category": "Key Political Leaders", "definition": ["Mikhail Gorbachev", "Became General Secretary in March 1985", "Introduced Glasnost and Perestroika to revive a stagnating Soviet system", "His reforms unintentionally opened the door to nationalist movements and the eventual collapse of the USSR"], "keywords": ["Gorbachev", "1985"], "sequence": [], "distinction": null}, {"id": "eob-29", "front": "Who led resistance to the August 1991 coup and became the first President of independent Russia?", "badge": "Map/Cartoon Anchor", "category": "Key Political Leaders", "definition": ["Boris Yeltsin", "President of the Russian Republic within the USSR at the time of the coup", "Rallied Muscovites and international opinion against the hardliners", "Became the first President of the newly independent Russian Federation after December 1991"], "keywords": ["Yeltsin", "First President of Russia"], "sequence": [], "distinction": null}, {"id": "eob-30", "front": "Which Soviet leadership era (before Gorbachev) is associated with economic 'stagnation'?", "badge": "Map/Cartoon Anchor", "category": "Key Political Leaders", "definition": ["The Brezhnev era (1964–1982)", "Marked by slowing growth, technological lag behind the West, and entrenched bureaucracy", "Set the stage for the crisis Gorbachev inherited in 1985"], "keywords": ["Brezhnev", "Stagnation era"], "sequence": [], "distinction": null}, {"id": "eob-31", "front": "Who succeeded Yeltsin as President of Russia?", "badge": "CUET Fact/Date", "category": "Key Political Leaders", "definition": ["Vladimir Putin", "Took over at the start of 2000", "Associated with consolidating central authority and reasserting Russia's role in world affairs"], "keywords": ["Putin", "2000"], "sequence": [], "distinction": null}, {"id": "eob-32", "front": "What was the Warsaw Pact?", "badge": "CUET Fact/Date", "category": "Treaties & Chronology", "definition": ["A military alliance of the USSR and its Eastern European socialist allies, formed in 1955", "The Second World/socialist bloc's counterpart to NATO", "Dissolved in 1991 alongside the broader collapse of the Soviet bloc"], "keywords": ["Warsaw Pact", "1955"], "distinction": "Warsaw Pact (Soviet-led military bloc) versus NATO (US-led military bloc) — their standoff was the military backbone of Cold War bipolarity.", "sequence": []}, {"id": "eob-33", "front": "Build the chronology: Glasnost/Perestroika → August coup fails → CIS formed → USSR dissolves.", "badge": "CUET Fact/Date", "category": "Treaties & Chronology", "definition": ["Use this sequence for date-based CUET and source questions"], "sequence": ["1985 — Gorbachev introduces Glasnost and Perestroika", "August 1991 — Hardline coup against Gorbachev fails; Yeltsin emerges as the key figure", "December 1991 — CIS formed by most former Soviet republics", "25 December 1991 — USSR formally ceases to exist"], "keywords": ["Chronology", "1985-1991"], "distinction": null}, {"id": "eob-34", "front": "What replaced the ideological bipolar contest after 1991?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["A unipolar structure, with the United States as the sole surviving superpower", "Expansion of NATO and Western economic institutions (IMF, World Bank, WTO) into the former Soviet space", "A shift in global politics from ideological rivalry to competition over markets, resources, and strategic influence"], "keywords": ["Unipolarity", "Post-Cold War order"], "sequence": [], "distinction": null}, {"id": "eob-35", "front": "Why is the USSR's collapse called a 'systemic' rather than merely political failure?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Failure spanned the economy (stagnant, shortage-driven), the polity (unaccountable one-party rule), and society (suppressed nationalism)", "No single reform could fix all three simultaneously — reforming one often destabilised another", "This is why Gorbachev's reforms, meant to save the system, instead hastened its unravelling"], "keywords": ["Systemic failure"], "sequence": [], "distinction": null}, {"id": "eob-36", "front": "How did the USSR's disintegration affect India and the non-aligned movement?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Loss of a socialist counterweight reduced the strategic space for non-alignment as a balancing strategy", "Many developing countries had to re-orient foreign and economic policy toward the West and market reforms", "India began economic liberalisation in 1991, the same year, driven partly by a balance-of-payments crisis and the shifting global landscape"], "keywords": ["Non-alignment", "India 1991 reforms"], "sequence": [], "distinction": null}, {"id": "eob-37", "front": "CUET Fact: In which year did India begin economic liberalisation, coinciding with the USSR's collapse?", "badge": "CUET Fact/Date", "category": "CUET Shortcut", "definition": ["1991", "India faced a severe balance-of-payments crisis and launched New Economic Policy reforms the same year the USSR disintegrated"], "keywords": ["1991", "India liberalisation"], "sequence": [], "distinction": null}, {"id": "eob-38", "front": "What does 'Near Abroad' mean in Russian foreign policy vocabulary?", "badge": "CUET Fact/Date", "category": "CUET Shortcut", "definition": ["Russia's term for the other former Soviet republics that became independent states after 1991", "Reflects Russia's continued strategic interest and influence in this region despite their independence"], "keywords": ["Near Abroad"], "sequence": [], "distinction": null}, {"id": "eob-39", "front": "Map/Cartoon Anchor: A cartoon shows the Soviet map splitting into pieces with new flags. What event does this represent?", "badge": "Map/Cartoon Anchor", "category": "CUET Shortcut", "definition": ["The disintegration of the USSR into 15 independent republics in December 1991", "Common cartoon motifs: a bear (symbol of Russia/USSR) breaking apart, or a hammer-and-sickle flag being lowered", "In source-based questions, look for labels like 'Dec 1991', 'CIS', or individual republic names as clues"], "keywords": ["Cartoon clue", "Source-based"], "sequence": [], "distinction": null}, {"id": "eob-40", "front": "6-Marker framing: 'Assess the consequences of Shock Therapy for Russia.' How should the answer be structured?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Open with a one-line definition of Shock Therapy and its IMF/World Bank origin", "Cover economic consequences: GDP contraction, rouble collapse, rise of oligarchs", "Cover social consequences: poverty, inequality, collapse of social safety nets", "Cover political consequences: powerful presidency, weak Parliament, regional/ethnic conflict (Chechnya)", "Close with a balancing line: some economic recovery occurred later, but at a high initial social cost"], "keywords": ["Answer structure"], "sequence": [], "distinction": null}, {"id": "eob-41", "front": "Distinguish: Unipolarity vs Multipolarity.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Unipolarity: one dominant power (the post-1991 US) shapes global rules and outcomes with limited counterbalance", "Multipolarity: several roughly comparable centres of power (e.g., US, EU, China, Russia, India) share influence and check one another"], "keywords": ["Unipolarity", "Multipolarity"], "distinction": "The chapter frames 1991 as the shift from Cold War bipolarity to a US-led unipolar moment; later chapters trace the world's drift toward multipolarity.", "sequence": []}, {"id": "eob-42", "front": "What welfare guarantees did the Soviet system provide, and why did their loss cause hardship?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Guaranteed employment for all citizens", "Subsidised food, healthcare, education, and housing", "High social security and near-universal literacy", "These guarantees vanished rapidly once Shock Therapy withdrew state support after 1991"], "keywords": ["Welfare guarantees", "Social security"], "sequence": [], "distinction": null}];
const BADGE_CLASS = {"Board 6-Marker Clue":"amber","CUET Fact/Date":"cyan","Map/Cartoon Anchor":"crimson","Assertion-Reasoning":"violet"};

// ---- Theme ----
const SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>';
const root = document.documentElement;
let theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
function applyTheme(){
  root.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').innerHTML = theme === 'dark' ? SUN_SVG : MOON_SVG;
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});
applyTheme();

// ---- State ----
window.__MASTERY_MEM__ = {};
let deck = CARDS.slice();
let idx = 0;
let flipped = false;
let activeTag = null;
let activeCat = null;
let activeStatus = "all";

function applyFilters(){
  deck = CARDS.filter(c=>{
    if(activeTag && c.badge!==activeTag) return false;
    if(activeCat && c.category!==activeCat) return false;
    if(activeStatus==="mastered" && window.__MASTERY_MEM__[c.id]!=="mastered") return false;
    if(activeStatus==="review" && window.__MASTERY_MEM__[c.id]!=="review") return false;
    return true;
  });
  idx = 0; flipped = false;
  render();
}

function renderBack(c){
  let h = "";
  h += `<div class="back-title">Core Points</div><ul class="bullets">${c.definition.map(d=>`<li>${d}</li>`).join("")}</ul>`;
  if(c.keywords && c.keywords.length){
    h += `<div class="back-title rep">Key Terms</div><div class="kw-row">${c.keywords.map(k=>`<span class="kw">${k}</span>`).join("")}</div>`;
  }
  if(c.sequence && c.sequence.length){
    h += `<div class="back-title rep">Sequence</div><ol class="seq-list">${c.sequence.map(s=>`<li>${s}</li>`).join("")}</ol>`;
  }
  if(c.distinction){
    h += `<div class="distinction-box">${c.distinction}</div>`;
  }
  h += `<div class="mastery-row">
    <button class="mastery-btn" data-act="review">Needs Review</button>
    <button class="mastery-btn" data-act="mastered">Mastered</button>
  </div>`;
  return h;
}

function render(){
  const total = deck.length;
  document.getElementById("progressLabel").textContent = total ? `Card ${idx+1} of ${total}` : "No cards match filters";
  document.getElementById("progressFill").style.width = total ? `${((idx+1)/total)*100}%` : "0%";
  const stage = document.getElementById("stage");
  if(!total){ stage.innerHTML = '<div class="empty-state">No cards match the current filters. Try clearing a filter.</div>'; return; }
  if(!document.getElementById("card")){ location.reload(); return; }
  const c = deck[idx];
  const card = document.getElementById("card");
  card.classList.remove("flipped"); flipped = false;
  document.getElementById("frontBadge").className = "badge " + (BADGE_CLASS[c.badge]||"cyan");
  document.getElementById("frontBadge").textContent = c.badge;
  document.getElementById("frontPrompt").textContent = c.front;
  document.getElementById("backFace").innerHTML = renderBack(c);
  bindMasteryButtons(c);
  document.getElementById("prevBtn").disabled = idx===0;
  document.getElementById("nextBtn").disabled = idx===total-1;
}

function bindMasteryButtons(c){
  document.querySelectorAll(".mastery-btn").forEach(btn=>{
    const act = btn.dataset.act;
    if(window.__MASTERY_MEM__[c.id]===act) btn.dataset.state = act;
    btn.onclick = (e)=>{
      e.stopPropagation();
      window.__MASTERY_MEM__[c.id] = window.__MASTERY_MEM__[c.id]===act ? undefined : act;
      document.querySelectorAll(".mastery-btn").forEach(b=>b.removeAttribute("data-state"));
      if(window.__MASTERY_MEM__[c.id]) btn.dataset.state = window.__MASTERY_MEM__[c.id];
    };
  });
}

function flip(){ if(!deck.length) return; const card = document.getElementById("card"); flipped=!flipped; card.classList.toggle("flipped", flipped); }
function next(){ if(idx<deck.length-1){ idx++; render(); } }
function prev(){ if(idx>0){ idx--; render(); } }
function shuffle(){
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  idx=0; render();
}

document.getElementById("card").addEventListener("click", flip);
document.getElementById("flipBtn").addEventListener("click", flip);
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("shuffleBtn").addEventListener("click", shuffle);

document.addEventListener("keydown", (e)=>{
  if(document.getElementById("gridSearch")===document.activeElement) return;
  if(e.code==="Space" || e.code==="ArrowUp"){ e.preventDefault(); flip(); }
  else if(e.code==="ArrowLeft"){ prev(); }
  else if(e.code==="ArrowRight"){ next(); }
  else if(e.code==="KeyR"){ shuffle(); }
});

// ---- Filters setup ----
const tags = [...new Set(CARDS.map(c=>c.badge))];
const cats = [...new Set(CARDS.map(c=>c.category))];
document.getElementById("tagChips").innerHTML = tags.map(t=>`<div class="chip" data-tag="${t}">${t} <span class="count">${CARDS.filter(c=>c.badge===t).length}</span></div>`).join("");
document.getElementById("catChips").innerHTML = cats.map(c=>`<div class="chip" data-cat="${c}">${c} <span class="count">${CARDS.filter(x=>x.category===c).length}</span></div>`).join("");

document.getElementById("tagChips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  const t = chip.dataset.tag;
  activeTag = activeTag===t ? null : t;
  document.querySelectorAll("#tagChips .chip").forEach(c=>c.dataset.active = (c.dataset.tag===activeTag) ? "true":"false");
  applyFilters();
});
document.getElementById("catChips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  const c = chip.dataset.cat;
  activeCat = activeCat===c ? null : c;
  document.querySelectorAll("#catChips .chip").forEach(x=>x.dataset.active = (x.dataset.cat===activeCat) ? "true":"false");
  applyFilters();
});
document.getElementById("statusChips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  activeStatus = chip.dataset.status;
  document.querySelectorAll("#statusChips .chip").forEach(c=>c.dataset.active = (c.dataset.status===activeStatus)?"true":"false");
  applyFilters();
});
document.getElementById("filterToggleBtn").addEventListener("click", ()=>{
  document.getElementById("filterPanel").classList.toggle("open");
});

// ---- Mode toggle ----
document.getElementById("studyModeBtn").addEventListener("click", ()=>{
  document.getElementById("studyModeBtn").dataset.active="true";
  document.getElementById("gridModeBtn").dataset.active="false";
  document.getElementById("stage").classList.remove("hidden");
  document.querySelector(".controls").style.display="flex";
  document.getElementById("gridWrap").classList.remove("active");
});
document.getElementById("gridModeBtn").addEventListener("click", ()=>{
  document.getElementById("studyModeBtn").dataset.active="false";
  document.getElementById("gridModeBtn").dataset.active="true";
  document.getElementById("stage").classList.add("hidden");
  document.querySelector(".controls").style.display="none";
  document.getElementById("gridWrap").classList.add("active");
  renderGrid(CARDS);
});
function renderGrid(list){
  document.getElementById("gridCards").innerHTML = list.map(c=>`
    <div class="gcard">
      <div class="badge ${BADGE_CLASS[c.badge]||'cyan'}">${c.badge}</div>
      <div class="front-prompt">${c.front}</div>
      <ul class="bullets">${c.definition.slice(0,3).map(d=>`<li>${d}</li>`).join("")}</ul>
    </div>`).join("") || '<div class="empty-state">No matches.</div>';
}
document.getElementById("gridSearch").addEventListener("input", (e)=>{
  const q = e.target.value.toLowerCase();
  const list = CARDS.filter(c=> c.front.toLowerCase().includes(q) || c.definition.join(" ").toLowerCase().includes(q) || (c.keywords||[]).join(" ").toLowerCase().includes(q));
  renderGrid(list);
});

render();
</script>
</body>
</html>
