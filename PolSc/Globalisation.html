<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Globalisation — Political Science XII</title>
<style>
:root{
  --font:'Calibri','Segoe UI','Segoe UI Variable',Candara,'Helvetica Neue',Helvetica,Arial,sans-serif;

  --bg:#0a0e1c;
  --bg-elev:#121830;
  --bg-elev2:#1a2140;
  --glass:rgba(255,255,255,0.055);
  --glass-border:rgba(255,255,255,0.09);
  --violet:#8b5cf6;
  --violet-dim:rgba(139,92,246,0.16);
  --violet-text:#d9c9ff;
  --cyan:#22d3ee;
  --cyan-dim:rgba(34,211,238,0.16);
  --crimson:#fb4570;
  --crimson-dim:rgba(251,69,112,0.16);
  --crimson-text:#ff8aa8;
  --amber:#f5b942;
  --amber-dim:rgba(245,185,66,0.16);
  --text:#e8ebf5;
  --text-dim:#9aa3c0;
  --text-faint:#6b7394;
  --glow1:rgba(139,92,246,0.14);
  --glow2:rgba(34,211,238,0.10);
  --scrollbar:rgba(255,255,255,0.12);
  --card-face:linear-gradient(160deg, var(--bg-elev2), var(--bg-elev));
  --kw-bg:rgba(255,255,255,0.07);
  --kw-text:#ffffff;
  --mastered-bg:rgba(34,197,94,0.16);
  --mastered-border:#22c55e;
  --mastered-text:#86efac;
}
[data-theme="light"]{
  --bg:#f4f5fb;
  --bg-elev:#ffffff;
  --bg-elev2:#eef0fb;
  --glass:rgba(20,20,45,0.045);
  --glass-border:rgba(20,20,45,0.11);
  --violet:#7c3aed;
  --violet-dim:rgba(124,58,237,0.12);
  --violet-text:#6d28d9;
  --cyan:#0e7490;
  --cyan-dim:rgba(14,116,144,0.12);
  --crimson:#e11d48;
  --crimson-dim:rgba(225,29,72,0.11);
  --crimson-text:#be123c;
  --amber:#b45309;
  --amber-dim:rgba(180,83,9,0.13);
  --text:#191d2e;
  --text-dim:#4b5170;
  --text-faint:#7b8098;
  --glow1:rgba(124,58,237,0.07);
  --glow2:rgba(14,116,144,0.06);
  --scrollbar:rgba(20,20,45,0.16);
  --card-face:linear-gradient(160deg, #ffffff, #f3f4fc);
  --kw-bg:rgba(20,20,45,0.07);
  --kw-text:#191d2e;
  --mastered-bg:rgba(22,163,74,0.13);
  --mastered-border:#16a34a;
  --mastered-text:#15803d;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, var(--glow1), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, var(--glow2), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  padding-bottom:104px;
  transition:background-color .25s ease, color .25s ease;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

.topbar{ padding:18px 16px 10px; max-width:640px; margin:0 auto; }
.top-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:2px; }
.book{ font-size:12px; color:var(--text-faint); letter-spacing:0.02em; }
.theme-btn{
  border:1px solid var(--glass-border); background:var(--glass); color:var(--text-dim);
  width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
}
.theme-btn svg{ width:16px; height:16px; }
.topbar h1{ font-family:var(--font); font-weight:700; font-size:22px; line-height:1.25; margin:0 0 10px; color:var(--text); }
.progress-row{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-dim); }
.progress-track{ flex:1; height:4px; background:var(--glass); border-radius:2px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--violet), var(--cyan)); border-radius:2px; transition:width .35s ease; }

.filter-toggle{ max-width:640px; margin:10px auto 0; padding:0 16px; display:flex; justify-content:flex-end; }
.filter-toggle button{
  background:var(--glass); border:1px solid var(--glass-border); color:var(--text-dim);
  font-family:var(--font); font-size:12.5px; padding:6px 12px; border-radius:20px;
  cursor:pointer; display:flex; align-items:center; gap:6px;
}
.filter-toggle button:hover{ color:var(--text); border-color:var(--glass-border); }
.filter-panel{ max-width:640px; margin:8px auto 0; padding:0 16px; max-height:0; overflow:hidden; transition:max-height .3s ease; }
.filter-panel.open{ max-height:260px; }
.filter-inner{ background:var(--glass); border:1px solid var(--glass-border); border-radius:14px; padding:12px 14px; }
.filter-group-label{ font-size:11px; color:var(--text-faint); margin:6px 0 6px; }
.chip-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px;}
.chip{
  font-family:var(--font); font-size:12px; padding:6px 11px; border-radius:16px;
  background:var(--glass); border:1px solid var(--glass-border); color:var(--text-dim);
  cursor:pointer; user-select:none; transition:background .15s, color .15s, border-color .15s;
}
.chip[data-active="true"]{ background:var(--violet-dim); border-color:var(--violet); color:var(--violet-text); }
.chip .count{ opacity:0.65; margin-left:3px; }

.stage{ max-width:640px; margin:18px auto 0; padding:0 16px; }
.card-scene{ perspective:1600px; height:420px; }
.card{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,.2,.2,1); cursor:pointer; }
.card.flipped{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:20px; border:1px solid var(--glass-border);
  background:var(--card-face);
  padding:26px 24px; overflow-y:auto;
  display:flex; flex-direction:column;
}
.face::-webkit-scrollbar{ width:5px; }
.face::-webkit-scrollbar-thumb{ background:var(--scrollbar); border-radius:3px; }
.face-front{ justify-content:center; }
.face-back{ transform:rotateY(180deg); justify-content:flex-start; }

.badge{ align-self:flex-start; font-size:11.5px; padding:5px 11px; border-radius:8px; margin-bottom:16px; font-weight:700; letter-spacing:0.01em; }
.badge.amber{ background:var(--amber-dim); color:var(--amber); }
.badge.cyan{ background:var(--cyan-dim); color:var(--cyan); }
.badge.crimson{ background:var(--crimson-dim); color:var(--crimson-text); }
.badge.violet{ background:var(--violet-dim); color:var(--violet-text); }

.front-prompt{ font-family:var(--font); font-size:21px; line-height:1.42; font-weight:700; color:var(--text); white-space:pre-line; }
.tap-hint{ margin-top:auto; padding-top:14px; font-size:12px; color:var(--text-faint); text-align:center; }

.back-title{ font-family:var(--font); font-size:16px; font-weight:700; color:var(--cyan); margin:0 0 10px; }
.back-title.rep{ margin-top:16px; }
.bullets{ margin:0 0 4px; padding-left:18px; color:var(--text); font-size:14.5px; line-height:1.55; }
.bullets li{ margin-bottom:6px; }
.bullets b{ color:var(--text); }
.kw-row{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 4px; }
.kw{ font-size:12px; padding:3px 9px; border-radius:7px; background:var(--kw-bg); color:var(--kw-text); font-weight:700; }
.seq-list{ counter-reset:seq; list-style:none; padding:0; margin:0 0 4px; }
.seq-list li{ counter-increment:seq; position:relative; padding-left:26px; margin-bottom:8px; font-size:14px; color:var(--text); line-height:1.5; }
.seq-list li::before{ content:counter(seq); position:absolute; left:0; top:0; width:18px; height:18px; border-radius:50%; background:var(--violet-dim); color:var(--violet-text); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.distinction-box{ background:var(--crimson-dim); border-left:3px solid var(--crimson); border-radius:6px; padding:10px 12px; font-size:13.5px; color:var(--crimson-text); margin-top:10px; line-height:1.5; }
.mastery-row{ margin-top:auto; padding-top:14px; display:flex; gap:8px; }
.mastery-btn{ flex:1; padding:9px 8px; border-radius:10px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text-dim); font-family:var(--font); font-size:12.5px; font-weight:700; cursor:pointer; }
.mastery-btn[data-state="mastered"]{ background:var(--mastered-bg); border-color:var(--mastered-border); color:var(--mastered-text); }
.mastery-btn[data-state="review"]{ background:var(--crimson-dim); border-color:var(--crimson); color:var(--crimson-text); }

.controls{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, var(--bg) 55%, transparent); pointer-events:none; }
.control-cluster{ pointer-events:auto; display:flex; align-items:center; gap:8px; background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(14px); border-radius:22px; padding:8px; }
.ctrl-btn{ border:none; background:var(--kw-bg); color:var(--text); width:44px; height:44px; border-radius:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.ctrl-btn:active{ filter:brightness(1.2); }
.ctrl-btn.primary{ background:linear-gradient(135deg, var(--violet), #6d28d9); width:56px; height:44px; }
.ctrl-btn.primary svg{ stroke:#fff; }
.ctrl-btn svg{ width:19px; height:19px; stroke:var(--text); }
.ctrl-btn:disabled{ opacity:0.3; }

.grid-toggle-row{ max-width:640px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; }
.mode-btn{ flex:1; padding:9px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text-dim); font-family:var(--font); font-size:13px; font-weight:700; cursor:pointer; }
.mode-btn[data-active="true"]{ background:var(--violet-dim); color:var(--violet-text); border-color:var(--violet); }

.grid-wrap{ max-width:960px; margin:16px auto 0; padding:0 16px 20px; display:none; }
.grid-wrap.active{ display:block; }
.grid-search{ width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text); font-family:var(--font); font-size:14px; margin-bottom:14px; }
.grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; }
.gcard{ background:var(--bg-elev); border:1px solid var(--glass-border); border-radius:14px; padding:16px; }
.gcard .front-prompt{ font-size:15px; margin-bottom:8px; }
.gcard .bullets{ font-size:13px; }

.stage.hidden, .grid-toggle-row.hidden{ display:none; }
.empty-state{ text-align:center; color:var(--text-faint); padding:40px 20px; font-size:14px; }

@media (max-width:400px){
  .card-scene{ height:460px; }
  .front-prompt{ font-size:19px; }
  .topbar h1{ font-size:19px; }
}
</style>
</head>

<script>
const CARDS = [{"id": "glob-01", "front": "Define 'globalisation' as used in this chapter.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["A multidimensional process that expands and intensifies connections across national borders in economic, political, and cultural life", "Involves flows of capital, goods, people, ideas, and technology moving with fewer barriers between countries", "Not purely economic — it also reshapes politics and culture"], "keywords": ["Globalisation definition", "Multidimensional"], "sequence": [], "distinction": null}, {"id": "glob-02", "front": "What role did technology play in accelerating globalisation?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["The information technology (IT) revolution dramatically cut the cost and time of communication", "Enabled instantaneous movement of capital, information, and ideas across the globe", "Allowed production processes to be split across multiple countries (global supply chains)"], "keywords": ["IT revolution", "Global supply chains"], "sequence": [], "distinction": null}, {"id": "glob-03", "front": "List the three key dimensions of globalisation covered in this chapter.", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Economic — growing flows of trade, capital, and production across borders; the rise of multinational corporations (MNCs)", "Political — a shrinking role for the state in some areas, alongside the rise of international institutions and non-state actors", "Cultural — spread of common cultural products and lifestyles, alongside resistance and local adaptation"], "keywords": ["Economic, political, cultural"], "sequence": [], "distinction": null}, {"id": "glob-04", "front": "What is the 'structuralist' view of globalisation's political impact?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Argues globalisation is not purely an economic phenomenon but is deeply political", "Sees globalisation as advantaging some (developed countries, MNCs) at the expense of others", "Views the state's role as shrinking in the face of global market forces"], "keywords": ["Structuralist view"], "sequence": [], "distinction": null}, {"id": "glob-05", "front": "What is the alternative view that globalisation strengthens, rather than weakens, the state?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Argues states remain central actors — they choose to open their economies and can regulate the pace and terms of integration", "State institutions actively facilitate globalisation through policy, infrastructure, and international agreements", "Sees the state's role as changing in form (from controller to facilitator), not disappearing"], "keywords": ["State facilitation view"], "distinction": "One view: globalisation shrinks the state. Counter-view: the state actively shapes and enables globalisation — its role changes rather than vanishes.", "sequence": []}, {"id": "glob-06", "front": "What is 'cultural homogenisation' as a critique of globalisation?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["The concern that globalisation spreads one dominant (often Western/American) culture worldwide, eroding local diversity", "Often illustrated through the spread of global brands, fast food, and media content", "Critics fear this erases distinct local identities and traditions over time"], "keywords": ["Cultural homogenisation"], "sequence": [], "distinction": null}, {"id": "glob-07", "front": "What is 'cultural heterogenisation' as a counter-argument?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["The view that globalisation does not simply erase local cultures but also enriches diversity", "Local cultures adapt and blend global influences with their own traditions, producing new hybrid forms", "Global cultural flows can move in multiple directions, not just from West to the rest"], "keywords": ["Cultural heterogenisation", "Hybridisation"], "sequence": [], "distinction": null}, {"id": "glob-08", "front": "What are the main economic criticisms of globalisation?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Benefits are seen as unevenly distributed, widening inequality within and between countries", "Developing countries argue global trade rules often favour developed nations and powerful MNCs", "Rapid capital flows can cause financial instability, as seen in various economic crises"], "keywords": ["Uneven benefits", "Inequality"], "sequence": [], "distinction": null}, {"id": "glob-09", "front": "What is the 'anti-globalisation movement'?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["A loose, worldwide coalition of groups opposing the specific form globalisation has taken", "Criticises the dominance of MNCs, growing inequality, and the erosion of local economies and cultures", "Includes trade unions, environmentalists, farmers' groups, and human rights activists"], "keywords": ["Anti-globalisation movement"], "sequence": [], "distinction": null}, {"id": "glob-10", "front": "What is the World Social Forum (WSF)?", "badge": "CUET Fact/Date", "category": "Treaties & Chronology", "definition": ["An annual gathering that emerged as a counter-platform to the World Economic Forum at Davos", "First held in Porto Alegre, Brazil, in 2001", "Brings together civil society groups, activists, and intellectuals critical of neo-liberal globalisation to propose alternatives"], "keywords": ["World Social Forum", "Porto Alegre 2001"], "sequence": [], "distinction": null}, {"id": "glob-11", "front": "How did India's economy respond to and shape globalisation?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["India began major economic liberalisation in 1991, opening up trade and investment", "This coincided with a severe balance-of-payments crisis and the broader global shift after the USSR's collapse", "Integration into global markets brought growth, foreign investment, and IT-sector expansion, alongside debates over inequality"], "keywords": ["India 1991 liberalisation"], "sequence": [], "distinction": null}, {"id": "glob-12", "front": "What is a multinational corporation (MNC), and why is it central to economic globalisation?", "badge": "CUET Fact/Date", "category": "CUET Shortcut", "definition": ["A company that operates production or service facilities in more than one country", "MNCs organise global production chains, shifting manufacturing and services to wherever costs are most favourable", "Their scale gives them significant influence over trade patterns and even domestic policy in host countries"], "keywords": ["MNC definition"], "sequence": [], "distinction": null}, {"id": "glob-13", "front": "Is globalisation a new phenomenon, or does it have historical precedents?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Cross-border trade, migration, and cultural exchange have existed for centuries (e.g. the Silk Route, colonial trade networks)", "What is distinct about contemporary globalisation is its speed, scale, and technological intensity", "Modern globalisation compresses time and distance to an unprecedented degree"], "keywords": ["Historical precedents", "Speed and scale"], "sequence": [], "distinction": null}, {"id": "glob-14", "front": "How does globalisation affect state sovereignty, according to this chapter?", "badge": "Board 6-Marker Clue", "category": "6-Marker Core Concepts", "definition": ["Global economic integration limits some traditional state controls, such as capital and trade restrictions", "States increasingly share authority with international institutions (WTO, IMF) and even non-state actors (MNCs, NGOs)", "Debate remains open on whether this represents a genuine decline of the state or simply its transformation"], "keywords": ["Shared authority with WTO/IMF", "Decline vs transformation of the state"], "sequence": [], "distinction": null}, {"id": "glob-15", "front": "CUET-style: Match — homogenisation, heterogenisation, structuralist view, World Social Forum.", "badge": "CUET Fact/Date", "category": "CUET Shortcut", "definition": ["Homogenisation = fear of one dominant global culture replacing local ones", "Heterogenisation = view that local cultures adapt and diversify rather than disappear", "Structuralist view = globalisation as political, favouring some states/actors over others", "World Social Forum = civil-society counter-platform critiquing globalisation (since 2001)"], "keywords": ["Match the following"], "sequence": [], "distinction": null}, {"id": "glob-16", "front": "Assertion: Globalisation is a purely economic process.\nReason: It only involves cross-border trade and investment flows.", "badge": "Assertion-Reasoning", "category": "Assertion & Reason Prep", "definition": ["Both Assertion and Reason are false", "This chapter frames globalisation as economic, political, and cultural, not purely economic"], "keywords": ["Both false"], "sequence": [], "distinction": null}, {"id": "glob-17", "front": "Assertion: The anti-globalisation movement rejects all forms of international cooperation.\nReason: It opposes the dominance of MNCs and unequal global trade rules.", "badge": "Assertion-Reasoning", "category": "Assertion & Reason Prep", "definition": ["Assertion is false, Reason is true", "The movement critiques the current form of globalisation (the true Reason) but generally seeks fairer international cooperation, not its rejection altogether"], "keywords": ["A false, R true"], "sequence": [], "distinction": null}, {"id": "glob-18", "front": "Assertion: Cultural globalisation always results in the complete disappearance of local traditions.\nReason: Global cultural flows can blend with, rather than erase, local unter-argument", "Conclude: globalisation is multidimensional, contested, and unevenly experienced across countries and groups"], "keywords": ["Answer structure"], "sequence": [], "distinction": null}];
const BADGE_CLASS = {"Board 6-Marker Clue":"amber","CUET Fact/Date":"cyan","Map/Cartoon Anchor":"crimson","Assertion-Reasoning":"violet"};

// ---- Theme ----
const SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>';
const root = document.documentElement;
let theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
function applyTheme(){
  root.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').innerHTML = theme === 'dark' ? SUN_SVG : MOON_SVG;
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});
applyTheme();

// ---- State ----
window.__MASTERY_MEM__ = {};
let deck = CARDS.slice();
let idx = 0;
let flipped = false;
let activeTag = null;
let activeCat = null;
let activeStatus = "all";

function applyFilters(){
  deck = CARDS.filter(c=>{
    if(activeTag && c.badge!==activeTag) return false;
    if(activeCat && c.category!==activeCat) return false;
    if(activeStatus==="mastered" && window.__MASTERY_MEM__[c.id]!=="mastered") return false;
    if(activeStatus==="review" && window.__MASTERY_MEM__[c.id]!=="review") return false;
    return true;
  });
  idx = 0; flipped = false;
  render();
}

function renderBack(c){
  let h = "";
  h += `<div class="back-title">Core Points</div><ul class="bullets">${c.definition.map(d=>`<li>${d}</li>`).join("")}</ul>`;
  if(c.keywords && c.keywords.length){
    h += `<div class="back-title rep">Key Terms</div><div class="kw-row">${c.keywords.map(k=>`<span class="kw">${k}</span>`).join("")}</div>`;
  }
  if(c.sequence && c.sequence.length){
    h += `<div class="back-title rep">Sequence</div><ol class="seq-list">${c.sequence.map(s=>`<li>${s}</li>`).join("")}</ol>`;
  }
  if(c.distinction){
    h += `<div class="distinction-box">${c.distinction}</div>`;
  }
  h += `<div class="mastery-row">
    <button class="mastery-btn" data-act="review">Needs Review</button>
    <button class="mastery-btn" data-act="mastered">Mastered</button>
  </div>`;
  return h;
}

function render(){
  const total = deck.length;
  document.getElementById("progressLabel").textContent = total ? `Card ${idx+1} of ${total}` : "No cards match filters";
  document.getElementById("progressFill").style.width = total ? `${((idx+1)/total)*100}%` : "0%";
  const stage = document.getElementById("stage");
  if(!total){ stage.innerHTML = '<div class="empty-state">No cards match the current filters. Try clearing a filter.</div>'; return; }
  if(!document.getElementById("card")){ location.reload(); return; }
  const c = deck[idx];
  const card = document.getElementById("card");
  card.classList.remove("flipped"); flipped = false;
  document.getElementById("frontBadge").className = "badge " + (BADGE_CLASS[c.badge]||"cyan");
  document.getElementById("frontBadge").textContent = c.badge;
  document.getElementById("frontPrompt").textContent = c.front;
  document.getElementById("backFace").innerHTML = renderBack(c);
  bindMasteryButtons(c);
  document.getElementById("prevBtn").disabled = idx===0;
  document.getElementById("nextBtn").disabled = idx===total-1;
}

function bindMasteryButtons(c){
  document.querySelectorAll(".mastery-btn").forEach(btn=>{
    const act = btn.dataset.act;
    if(window.__MASTERY_MEM__[c.id]===act) btn.dataset.state = act;
    btn.onclick = (e)=>{
      e.stopPropagation();
      window.__MASTERY_MEM__[c.id] = window.__MASTERY_MEM__[c.id]===act ? undefined : act;
      document.querySelectorAll(".mastery-btn").forEach(b=>b.removeAttribute("data-state"));
      if(window.__MASTERY_MEM__[c.id]) btn.dataset.state = window.__MASTERY_MEM__[c.id];
    };
  });
}

function flip(){ if(!deck.length) return; const card = document.getElementById("card"); flipped=!flipped; card.classList.toggle("flipped", flipped); }
function next(){ if(idx<deck.length-1){ idx++; render(); } }
function prev(){ if(idx>0){ idx--; render(); } }
function shuffle(){
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  idx=0; render();
}

document.getElementById("card").addEventListener("click", flip);
document.getElementById("flipBtn").addEventListener("click", flip);
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("shuffleBtn").addEventListener("click", shuffle);

document.addEventListener("keydown", (e)=>{
  if(document.getElementById("gridSearch")===document.activeElement) return;
  if(e.code==="Space" || e.code==="ArrowUp"){ e.preventDefault(); flip(); }
  else if(e.code==="ArrowLeft"){ prev(); }
  else if(e.code==="ArrowRight"){ next(); }
  else if(e.code==="KeyR"){ shuffle(); }
});

// ---- Filters setup ----
const tags = [...new Set(CARDS.map(c=>c.badge))];
const cats = [...new Set(CARDS.map(c=>c.category))];
document.getElementById("tagChips").innerHTML = tags.map(t=>`<div class="chip" data-tag="${t}">${t} <span class="count">${CARDS.filter(c=>c.badge===t).length}</span></div>`).join("");
document.getElementById("catChips").innerHTML = cats.map(c=>`<div class="chip" data-cat="${c}">${c} <span class="count">${CARDS.filter(x=>x.category===c).length}</span></div>`).join("");

document.getElementById("tagChips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  const t = chip.dataset.tag;
  activeTag = activeTag===t ? null : t;
  document.querySelectorAll("#tagChips .chip").forEach(c=>c.dataset.active = (c.dataset.tag===activeTag) ? "true":"false");
  applyFilters();
});
document.getElementById("catChips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  const c = chip.dataset.cat;
  activeCat = activeCat===c ? null : c;
  document.querySelectorAll("#catChips .chip").forEach(x=>x.dataset.active = (x.dataset.cat===activeCat) ? "true":"false");
  applyFilters();
});
document.getElementById("statusChips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  activeStatus = chip.dataset.status;
  document.querySelectorAll("#statusChips .chip").forEach(c=>c.dataset.active = (c.dataset.status===activeStatus)?"true":"false");
  applyFilters();
});
document.getElementById("filterToggleBtn").addEventListener("click", ()=>{
  document.getElementById("filterPanel").classList.toggle("open");
});

// ---- Mode toggle ----
document.getElementById("studyModeBtn").addEventListener("click", ()=>{
  document.getElementById("studyModeBtn").dataset.active="true";
  document.getElementById("gridModeBtn").dataset.active="false";
  document.getElementById("stage").classList.remove("hidden");
  document.querySelector(".controls").style.display="flex";
  document.getElementById("gridWrap").classList.remove("active");
});
document.getElementById("gridModeBtn").addEventListener("click", ()=>{
  document.getElementById("studyModeBtn").dataset.active="false";
  document.getElementById("gridModeBtn").dataset.active="true";
  document.getElementById("stage").classList.add("hidden");
  document.querySelector(".controls").style.display="none";
  document.getElementById("gridWrap").classList.add("active");
  renderGrid(CARDS);
});
function renderGrid(list){
  document.getElementById("gridCards").innerHTML = list.map(c=>`
    <div class="gcard">
      <div class="badge ${BADGE_CLASS[c.badge]||'cyan'}">${c.badge}</div>
      <div class="front-prompt">${c.front}</div>
      <ul class="bullets">${c.definition.slice(0,3).map(d=>`<li>${d}</li>`).join("")}</ul>
    </div>`).join("") || '<div class="empty-state">No matches.</div>';
}
document.getElementById("gridSearch").addEventListener("input", (e)=>{
  const q = e.target.value.toLowerCase();
  const list = CARDS.filter(c=> c.front.toLowerCase().includes(q) || c.definition.join(" ").toLowerCase().includes(q) || (c.keywords||[]).join(" ").toLowerCase().includes(q));
  renderGrid(list);
});

render();
</script>
</body>
</html>
