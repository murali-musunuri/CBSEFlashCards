<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Applied Grammar & Literary Devices — English Elective XII</title>
<style>
:root{
  --font:'Calibri','Segoe UI','Segoe UI Variable',Candara,'Helvetica Neue',Helvetica,Arial,sans-serif;

  --bg:#0a0e1c;
  --bg-elev:#121830;
  --bg-elev2:#1a2140;
  --glass:rgba(255,255,255,0.055);
  --glass-border:rgba(255,255,255,0.09);
  --violet:#8b5cf6;
  --violet-dim:rgba(139,92,246,0.16);
  --violet-text:#d9c9ff;
  --cyan:#22d3ee;
  --cyan-dim:rgba(34,211,238,0.16);
  --crimson:#fb4570;
  --crimson-dim:rgba(251,69,112,0.16);
  --crimson-text:#ff8aa8;
  --amber:#f5b942;
  --amber-dim:rgba(245,185,66,0.16);
  --teal:#2dd4bf;
  --teal-dim:rgba(45,212,191,0.16);
  --teal-text:#5eead4;
  --text:#e8ebf5;
  --text-dim:#9aa3c0;
  --text-faint:#6b7394;
  --glow1:rgba(139,92,246,0.14);
  --glow2:rgba(34,211,238,0.10);
  --scrollbar:rgba(255,255,255,0.12);
  --card-face:linear-gradient(160deg, var(--bg-elev2), var(--bg-elev));
  --kw-bg:rgba(255,255,255,0.07);
  --kw-text:#ffffff;
  --mastered-bg:rgba(34,197,94,0.16);
  --mastered-border:#22c55e;
  --mastered-text:#86efac;
}
[data-theme="light"]{
  --bg:#f4f5fb;
  --bg-elev:#ffffff;
  --bg-elev2:#eef0fb;
  --glass:rgba(20,20,45,0.045);
  --glass-border:rgba(20,20,45,0.11);
  --violet:#7c3aed;
  --violet-dim:rgba(124,58,237,0.12);
  --violet-text:#6d28d9;
  --cyan:#0e7490;
  --cyan-dim:rgba(14,116,144,0.12);
  --crimson:#e11d48;
  --crimson-dim:rgba(225,29,72,0.11);
  --crimson-text:#be123c;
  --amber:#b45309;
  --amber-dim:rgba(180,83,9,0.13);
  --teal:#0f766e;
  --teal-dim:rgba(15,118,110,0.12);
  --teal-text:#0f766e;
  --text:#191d2e;
  --text-dim:#4b5170;
  --text-faint:#7b8098;
  --glow1:rgba(124,58,237,0.07);
  --glow2:rgba(14,116,144,0.06);
  --scrollbar:rgba(20,20,45,0.16);
  --card-face:linear-gradient(160deg, #ffffff, #f3f4fc);
  --kw-bg:rgba(20,20,45,0.07);
  --kw-text:#191d2e;
  --mastered-bg:rgba(22,163,74,0.13);
  --mastered-border:#16a34a;
  --mastered-text:#15803d;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, var(--glow1), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, var(--glow2), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  padding-bottom:104px;
  transition:background-color .25s ease, color .25s ease;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

.topbar{ padding:18px 16px 10px; max-width:640px; margin:0 auto; }
.top-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:2px; }
.book{ font-size:12px; color:var(--text-faint); letter-spacing:0.02em; }
.theme-btn{
  border:1px solid var(--glass-border); background:var(--glass); color:var(--text-dim);
  width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
}
.theme-btn svg{ width:16px; height:16px; }
.topbar h1{ font-family:var(--font); font-weight:700; font-size:22px; line-height:1.25; margin:0 0 10px; color:var(--text); }
.progress-row{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-dim); }
.progress-track{ flex:1; height:4px; background:var(--glass); border-radius:2px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--violet), var(--cyan)); border-radius:2px; transition:width .35s ease; }

.filter-toggle{ max-width:640px; margin:10px auto 0; padding:0 16px; display:flex; justify-content:flex-end; }
.filter-toggle button{
  background:var(--glass); border:1px solid var(--glass-border); color:var(--text-dim);
  font-family:var(--font); font-size:12.5px; padding:6px 12px; border-radius:20px;
  cursor:pointer; display:flex; align-items:center; gap:6px;
}
.filter-toggle button:hover{ color:var(--text); border-color:var(--glass-border); }
.filter-panel{ max-width:640px; margin:8px auto 0; padding:0 16px; max-height:0; overflow:hidden; transition:max-height .3s ease; }
.filter-panel.open{ max-height:260px; }
.filter-inner{ background:var(--glass); border:1px solid var(--glass-border); border-radius:14px; padding:12px 14px; }
.filter-group-label{ font-size:11px; color:var(--text-faint); margin:6px 0 6px; }
.chip-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px;}
.chip{
  font-family:var(--font); font-size:12px; padding:6px 11px; border-radius:16px;
  background:var(--glass); border:1px solid var(--glass-border); color:var(--text-dim);
  cursor:pointer; user-select:none; transition:background .15s, color .15s, border-color .15s;
}
.chip[data-active="true"]{ background:var(--violet-dim); border-color:var(--violet); color:var(--violet-text); }
.chip .count{ opacity:0.65; margin-left:3px; }

.stage{ max-width:640px; margin:18px auto 0; padding:0 16px; }
.card-scene{ perspective:1600px; height:420px; }
.card{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,.2,.2,1); cursor:pointer; }
.card.flipped{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:20px; border:1px solid var(--glass-border);
  background:var(--card-face);
  padding:26px 24px; overflow-y:auto;
  display:flex; flex-direction:column;
}
.face::-webkit-scrollbar{ width:5px; }
.face::-webkit-scrollbar-thumb{ background:var(--scrollbar); border-radius:3px; }
.face-front{ justify-content:center; }
.face-back{ transform:rotateY(180deg); justify-content:flex-start; }

.badge{ align-self:flex-start; font-size:11.5px; padding:5px 11px; border-radius:8px; margin-bottom:16px; font-weight:700; letter-spacing:0.01em; }
.badge.amber{ background:var(--amber-dim); color:var(--amber); }
.badge.cyan{ background:var(--cyan-dim); color:var(--cyan); }
.badge.crimson{ background:var(--crimson-dim); color:var(--crimson-text); }
.badge.violet{ background:var(--violet-dim); color:var(--violet-text); }
.badge.teal{ background:var(--teal-dim); color:var(--teal-text); }

.front-prompt{ font-family:var(--font); font-size:21px; line-height:1.42; font-weight:700; color:var(--text); white-space:pre-line; }
.tap-hint{ margin-top:auto; padding-top:14px; font-size:12px; color:var(--text-faint); text-align:center; }

.back-title{ font-family:var(--font); font-size:16px; font-weight:700; color:var(--cyan); margin:0 0 10px; }
.back-title.rep{ margin-top:16px; }
.bullets{ margin:0 0 4px; padding-left:18px; color:var(--text); font-size:14.5px; line-height:1.55; }
.bullets li{ margin-bottom:6px; }
.bullets b{ color:var(--text); }
.kw-row{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 4px; }
.kw{ font-size:12px; padding:3px 9px; border-radius:7px; background:var(--kw-bg); color:var(--kw-text); font-weight:700; }
.seq-list{ counter-reset:seq; list-style:none; padding:0; margin:0 0 4px; }
.seq-list li{ counter-increment:seq; position:relative; padding-left:26px; margin-bottom:8px; font-size:14px; color:var(--text); line-height:1.5; }
.seq-list li::before{ content:counter(seq); position:absolute; left:0; top:0; width:18px; height:18px; border-radius:50%; background:var(--violet-dim); color:var(--violet-text); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.distinction-box{ background:var(--crimson-dim); border-left:3px solid var(--crimson); border-radius:6px; padding:10px 12px; font-size:13.5px; color:var(--crimson-text); margin-top:10px; line-height:1.5; }
.mastery-row{ margin-top:auto; padding-top:14px; display:flex; gap:8px; }
.mastery-btn{ flex:1; padding:9px 8px; border-radius:10px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text-dim); font-family:var(--font); font-size:12.5px; font-weight:700; cursor:pointer; }
.mastery-btn[data-state="mastered"]{ background:var(--mastered-bg); border-color:var(--mastered-border); color:var(--mastered-text); }
.mastery-btn[data-state="review"]{ background:var(--crimson-dim); border-color:var(--crimson); color:var(--crimson-text); }

.controls{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, var(--bg) 55%, transparent); pointer-events:none; }
.control-cluster{ pointer-events:auto; display:flex; align-items:center; gap:8px; background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(14px); border-radius:22px; padding:8px; }
.ctrl-btn{ border:none; background:var(--kw-bg); color:var(--text); width:44px; height:44px; border-radius:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.ctrl-btn:active{ filter:brightness(1.2); }
.ctrl-btn.primary{ background:linear-gradient(135deg, var(--violet), #6d28d9); width:56px; height:44px; }
.ctrl-btn.primary svg{ stroke:#fff; }
.ctrl-btn svg{ width:19px; height:19px; stroke:var(--text); }
.ctrl-btn:disabled{ opacity:0.3; }

.grid-toggle-row{ max-width:640px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px; }
.mode-btn{ flex:1; padding:9px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text-dim); font-family:var(--font); font-size:13px; font-weight:700; cursor:pointer; }
.mode-btn[data-active="true"]{ background:var(--violet-dim); color:var(--violet-text); border-color:var(--violet); }

.grid-wrap{ max-width:960px; margin:16px auto 0; padding:0 16px 20px; display:none; }
.grid-wrap.active{ display:block; }
.grid-search{ width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text); font-family:var(--font); font-size:14px; margin-bottom:14px; }
.grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; }
.gcard{ background:var(--bg-elev); border:1px solid var(--glass-border); border-radius:14px; padding:16px; }
.gcard .front-prompt{ font-size:15px; margin-bottom:8px; }
.gcard .bullets{ font-size:13px; }

.stage.hidden, .grid-toggle-row.hidden{ display:none; }
.empty-state{ text-align:center; color:var(--text-faint); padding:40px 20px; font-size:14px; }

@media (max-width:400px){
  .card-scene{ height:460px; }
  .front-prompt{ font-size:19px; }
  .topbar h1{ font-size:19px; }
}
</style>
</head>

<script>
const CARDS = [{"id": "agld-01", "front": "Define metaphor, and distinguish it from simile.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["A metaphor directly states that one thing IS another, implying a comparison without using 'like' or 'as'", "A simile explicitly compares two things using 'like' or 'as'", "Metaphors tend to feel more immediate and forceful; similes signal the comparison more gently"], "keywords": ["Metaphor", "Simile"], "distinction": "Simile: 'her courage was like a shield.' Metaphor: 'her courage was a shield.' The dropped 'like' is the whole difference — and the whole effect.", "sequence": []}, {"id": "agld-02", "front": "Define oxymoron, and give the general pattern it follows.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["A figure of speech combining two normally contradictory terms for effect", "Pattern: usually an adjective-noun pair that seems logically incompatible ('deafening silence', 'bittersweet')", "Creates tension or complexity by forcing two opposite ideas to coexist in one phrase"], "keywords": ["Oxymoron", "Contradiction"], "sequence": [], "distinction": null}, {"id": "agld-03", "front": "Define conceit as a literary device (not the everyday meaning of the word).", "badge": "Literary Term", "category": "Literary Devices", "definition": ["An extended, elaborate metaphor that draws a surprising or intellectually striking comparison between two very unlike things", "Sustained across several lines or an entire poem, not just a single phrase", "Strongly associated with the Metaphysical poets (e.g. John Donne), who often built entire poems around one ingenious conceit"], "keywords": ["Conceit", "Metaphysical poets"], "distinction": "A regular metaphor is usually brief; a conceit is a metaphor stretched and developed across an extended passage, often surprising in its cleverness.", "sequence": []}, {"id": "agld-04", "front": "Define alliteration, and note its typical effect.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["Repetition of the same initial consonant sound across nearby words", "Creates rhythm, musicality, and emphasis; can also mimic sound (onomatopoeic effect) or bind phrases together in memory", "Common in both poetry and persuasive prose/speeches for its memorable, rhythmic quality"], "keywords": ["Alliteration", "Consonant repetition"], "sequence": [], "distinction": null}, {"id": "agld-05", "front": "Define assonance and consonance, and distinguish them.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["Assonance: repetition of vowel sounds within nearby words (not necessarily at word-start)", "Consonance: repetition of consonant sounds within or at the end of nearby words", "Both create internal musicality without relying on full rhyme"], "keywords": ["Assonance", "Consonance"], "distinction": "Assonance repeats vowel sounds ('light' and 'time'); consonance repeats consonant sounds ('mixed' and 'bricks'). Alliteration is a special case of consonance at word-beginnings only.", "sequence": []}, {"id": "agld-06", "front": "Define personification.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["Attributing human qualities, emotions, or actions to non-human things, animals, or abstract ideas", "Makes abstract or inanimate subjects feel vivid, relatable, and emotionally charged", "Frequently used in nature poetry and descriptive prose to animate the physical world"], "keywords": ["Personification"], "sequence": [], "distinction": null}, {"id": "agld-07", "front": "Define allegory, and distinguish it from simple symbolism.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["A narrative in which characters, settings, or events consistently represent abstract ideas or a second, parallel meaning", "Operates at two levels throughout an entire work, not just in isolated images", "Symbolism uses individual symbols within a work; allegory structures the whole narrative around a sustained parallel meaning"], "keywords": ["Allegory", "Symbolism"], "distinction": "A single recurring image (a flag = freedom) is symbolism. An entire story structured so every character/event maps onto another meaning throughout is allegory.", "sequence": []}, {"id": "agld-08", "front": "Define irony, and list its three main types.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["A gap between what is said/expected and what is actually meant or what actually happens", "Verbal irony: saying the opposite of what is meant", "Situational irony: an outcome that is the opposite of what was expected", "Dramatic irony: the audience/reader knows something a character does not"], "keywords": ["Verbal, situational, dramatic irony"], "sequence": [], "distinction": null}, {"id": "agld-09", "front": "Define stream of consciousness as a narrative technique.", "badge": "Literary Term", "category": "Theme & Character Analysis", "definition": ["A narrative technique presenting a character's continuous, often unstructured flow of thoughts, feelings, and impressions", "Mimics the actual, non-linear way the human mind processes experience, rather than organising thoughts into neat sentences", "Strongly associated with early-20th-century modernist writers exploring interior consciousness"], "keywords": ["Stream of consciousness", "Modernism"], "sequence": [], "distinction": null}, {"id": "agld-10", "front": "Define pathetic fallacy.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["Attributing human emotion specifically to nature or the weather, so the natural world seems to mirror a character's inner state", "A stormy sky during a character's grief, or a bright morning during a moment of hope, are classic examples", "A specific subtype of personification, focused on emotional mirroring through natural/weather imagery"], "keywords": ["Pathetic fallacy"], "distinction": "Pathetic fallacy is personification specifically applied to nature/weather to reflect human emotion — a narrower, more specific device.", "sequence": []}, {"id": "agld-11", "front": "Define hubris and catharsis, and how they typically relate in classical tragedy.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["Hubris: excessive pride or overconfidence in a character, often leading to their downfall", "Catharsis: the emotional release or purification an audience/reader experiences after witnessing tragic events", "Classic tragic structure: a character's hubris drives the plot toward a downfall, and witnessing that downfall produces catharsis in the audience"], "keywords": ["Hubris", "Catharsis"], "sequence": [], "distinction": null}, {"id": "agld-12", "front": "Define anaphora.", "badge": "Literary Term", "category": "Literary Devices", "definition": ["Deliberate repetition of a word or phrase at the beginning of successive clauses or lines", "Builds rhythm, emphasis, and rhetorical momentum", "Common in persuasive writing, speeches, and poetry seeking a building, incantatory effect"], "keywords": ["Anaphora", "Repetition"], "sequence": [], "distinction": null}, {"id": "agld-13", "front": "Define tone and mood, and distinguish them clearly.", "badge": "Literary Term", "category": "Theme & Character Analysis", "definition": ["Tone: the author's/narrator's attitude toward the subject or audience (e.g. ironic, reflective, bitter, tender)", "Mood: the emotional atmosphere the text creates for the reader (e.g. tense, melancholic, joyful)", "Tone is about the writer's stance; mood is about the reader's felt experience"], "keywords": ["Tone", "Mood"], "distinction": "A common exam trap: tone and mood are often used interchangeably by students, but tone belongs to the author/narrator, while mood belongs to the reader's experience.", "sequence": []}, {"id": "agld-14", "front": "Define motif, and distinguish it from theme.", "badge": "Literary Term", "category": "Theme & Character Analysis", "definition": ["Motif: a recurring image, phrase, or idea that runs through a text, reinforcing its meaning", "Theme: the underlying central idea or message the whole work explores", "A motif is a repeated concrete device; the theme is the abstract idea that motif helps build"], "keywords": ["Motif", "Theme"], "distinction": "A motif (e.g. recurring imagery of light) is a tool. A theme (e.g. 'the search for truth') is the meaning that tool helps construct.", "sequence": []}, {"id": "agld-15", "front": "What is the difference between first-person, third-person limited, and third-person omniscient narration?", "badge": "Literary Term", "category": "Theme & Character Analysis", "definition": ["First-person: narrator uses 'I', directly experiencing and relaying events, with restricted knowledge", "Third-person limited: narrator uses 'he/she/they' but is confined to one character's thoughts and perceptions", "Third-person omniscient: narrator uses 'he/she/they' but has unrestricted access to every character's thoughts and the full scope of events"], "keywords": ["Narrative point of view"], "sequence": [], "distinction": null}, {"id": "agld-16", "front": "What is the core rule for active-to-passive voice transformation?", "badge": "Writing Template", "category": "Applied Grammar Rules", "definition": ["The object of the active sentence becomes the subject of the passive sentence", "The verb changes to a form of 'be' + past participle", "The original subject becomes optional, introduced with 'by' (often dropped if unimportant)", "Formula: Active — Subject + Verb + Object → Passive — Object + be + Past Participle + (by Subject)"], "keywords": ["Active to passive formula"], "sequence": [], "distinction": null}, {"id": "agld-17", "front": "How does voice transformation change across tenses? Give the pattern for present, past, and future simple.", "badge": "Writing Template", "category": "Applied Grammar Rules", "definition": ["Present simple: 'She writes the report' → 'The report is written by her'", "Past simple: 'She wrote the report' → 'The report was written by her'", "Future simple: 'She will write the report' → 'The report will be written by her'"], "keywords": ["Tense-wise passive formula"], "sequence": [], "distinction": null}, {"id": "agld-18", "front": "What is the general rule for direct-to-indirect (reported) speech transformation?", "badge": "Writing Template", "category": "Applied Grammar Rules", "definition": ["Remove quotation marks; introduce with a reporting verb (said, told, asked, etc.)", "Shift tense one step back ('backshift'): present simple → past simple; present perfect → past perfect, etc.", "Change pronouns to match the reporting perspective", "Adjust time/place words: 'now' → 'then', 'today' → 'that day', 'here' → 'there'"], "keywords": ["Reported speech rules"], "sequence": [], "distinction": null}, {"id": "agld-19", "front": "How does reported speech differ for statements, questions, and commands?", "badge": "Writing Template", "category": "Applied Grammar Rules", "definition": ["Statements: use 'that' (optional) — 'He said that he was tired'", "Yes/No questions: use 'if' or 'whether', with normal (not inverted) word order — 'She asked if he was ready'", "Wh-questions: retain the question word, with normal word order — 'They asked where he was going'", "Commands/requests: use an infinitive after the reporting verb — 'He told her to leave'"], "keywords": ["Statements, questions, commands"], "sequence": [], "distinction": null}, {"id": "agld-20", "front": "What are the main rules for subject-verb agreement that examiners test?", "badge": "Writing Template", "category": "Applied Grammar Rules", "definition": ["A singular subject takes a singular verb; a plural subject takes a plural verb", "Collective nouns (team, family, jury) usually take a singular verb when treated as one unit", "Subjects joined by 'and' usually take a plural verb; subjects joined by 'or/nor' agree with the nearer subject", "Indefinite pronouns like 'each', 'everyone', 'neither' take a singular verb"], "keywords": ["Subject-verb agreement"], "sequence": [], "distinction": null}, {"id": "agld-21", "front": "What is a common error-correction pattern examiners test around articles ('a/an/the')?", "badge": "Writing Template", "category": "Applied Grammar Rules", "definition": ["'A' before consonant sounds, 'an' before vowel sounds (based on sound, not spelling — e.g. 'an hour', 'a university')", "'The' for specific, already-identified, or unique things; no article for general plural/uncountable nouns", "Common trap: omitting 'the' before superlatives ('the best') or unique nouns ('the sun')"], "keywords": ["Article usage"], "sequence": [], "distinction": null}, {"id": "agld-22", "front": "What is the standard sentence-transformation rule for converting a simple sentence into a complex sentence?", "badge": "Writing Template", "category": "Applied Grammar Rules", "definition": ["Identify a phrase in the simple sentence that can be expanded into a full clause", "Convert it into a subordinate clause (introduced by 'because', 'although', 'who', 'which', 'that', etc.)", "Ensure the subordinate clause depends grammatically on the main clause", "Example: 'Despite his illness, he attended the meeting' → 'Although he was ill, he attended the meeting'"], "keywords": ["Simple to complex sentence"], "sequence": [], "distinction": null}, {"id": "agld-23", "front": "What is the rule for combining two simple sentences into one compound sentence?", "badge": "Writing Template", "category": "Applied Grammar Rules", "definition": ["Join two independent (complete) sentences using a coordinating conjunction: 'and', 'but', 'or', 'so', 'for', 'yet'", "Both original sentences must remain grammatically complete on their own", "A comma typically precedes the coordinating conjunction in formal writing"], "keywords": ["Compound sentence formation"], "sequence": [], "distinction": null}, {"id": "agld-24", "front": "CUET Vocabulary: What does 'discursive' mean, and why is it a key term for this syllabus?", "badge": "CUET Vocabulary", "category": "CUET Vocabulary", "definition": ["Moving between related topics in an exploratory, wide-ranging way rather than following one strict, single argument", "Central to the CBSE 'discursive writing' component, which asks students to explore a topic from multiple angles rather than argue one fixed position"], "keywords": ["Discursive"], "sequence": [], "distinction": null}, {"id": "agld-25", "front": "CUET Vocabulary: Distinguish 'implicit' from 'explicit'.", "badge": "CUET Vocabulary", "category": "CUET Vocabulary", "definition": ["Implicit: implied or suggested indirectly, without being directly stated", "Explicit: stated directly, clearly, and unambiguously", "Frequently tested in RTC/inference questions asking what a text implies versus what it states outright"], "keywords": ["Implicit vs explicit"], "sequence": [], "distinction": null}, {"id": "agld-26", "front": "CUET Vocabulary: What does 'ambivalent' mean?", "badge": "CUET Vocabulary", "category": "CUET Vocabulary", "definition": ["Having mixed or contradictory feelings/attitudes toward something at the same time", "Useful for describing complex characters torn between conflicting emotions or loyalties"], "keywords": ["Ambivalent"], "sequence": [], "distinction": null}, {"id": "agld-27", "front": "CUET Vocabulary: What does 'poignant' mean, and when is it appropriately used?", "badge": "CUET Vocabulary", "category": "CUET Vocabulary", "definition": ["Evoking a keen sense of sadness or regret; deeply emotionally touching", "Appropriate for describing a scene, line, or moment that produces sharp, moving emotional impact — not just 'sad', but sad in a piercing, memorable way"], "keywords": ["Poignant"], "sequence": [], "distinction": null}, {"id": "agld-28", "front": "CUET Vocabulary: Distinguish 'empathy' from 'sympathy'.", "badge": "CUET Vocabulary", "category": "CUET Vocabulary", "definition": ["Empathy: the capacity to understand and share another's feelings as if experiencing them oneself", "Sympathy: feeling concern or compassion for someone's situation, without necessarily sharing the feeling itself"], "keywords": ["Empathy vs sympathy"], "distinction": "Empathy = feeling WITH someone. Sympathy = feeling FOR someone. This distinction is a favourite CUET vocabulary trap.", "sequence": []}, {"id": "agld-29", "front": "CUET Vocabulary: What does 'nuanced' mean, and why does it matter for high-scoring literary analysis?", "badge": "CUET Vocabulary", "category": "CUET Vocabulary", "definition": ["Characterised by subtle shades of meaning, feeling, or expression rather than broad, simple categories", "Examiners reward 'nuanced' analysis — noticing subtlety and complexity rather than reducing a text to one flat interpretation"], "keywords": ["Nuanced"], "sequence": [], "distinction": null}, {"id": "agld-30", "front": "CUET Vocabulary: Distinguish 'connotation' from 'denotation'.", "badge": "CUET Vocabulary", "category": "CUET Vocabulary", "definition": ["Denotation: a word's literal, dictionary meaning", "Connotation: the additional emotional or cultural associations a word carries beyond its literal meaning", "Example: 'home' denotes a dwelling but connotes warmth, safety, and belonging"], "keywords": ["Connotation vs denotation"], "sequence": [], "distinction": null}];
const BADGE_CLASS = {"RTC Analysis":"amber","CUET Vocabulary":"cyan","Writing Template":"crimson","Poetic Device":"violet","Literary Term":"teal"};

// ---- Theme ----
const SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>';
const root = document.documentElement;
let theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
function applyTheme(){
  root.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').innerHTML = theme === 'dark' ? SUN_SVG : MOON_SVG;
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});
applyTheme();

// ---- State ----
window.__MASTERY_MEM__ = {};
let deck = CARDS.slice();
let idx = 0;
let flipped = false;
let activeTag = null;
let activeCat = null;
let activeStatus = "all";

function applyFilters(){
  deck = CARDS.filter(c=>{
    if(activeTag && c.badge!==activeTag) return false;
    if(activeCat && c.category!==activeCat) return false;
    if(activeStatus==="mastered" && window.__MASTERY_MEM__[c.id]!=="mastered") return false;
    if(activeStatus==="review" && window.__MASTERY_MEM__[c.id]!=="review") return false;
    return true;
  });
  idx = 0; flipped = false;
  render();
}

function renderBack(c){
  let h = "";
  h += `<div class="back-title">Core Points</div><ul class="bullets">${c.definition.map(d=>`<li>${d}</li>`).join("")}</ul>`;
  if(c.keywords && c.keywords.length){
    h += `<div class="back-title rep">Key Terms</div><div class="kw-row">${c.keywords.map(k=>`<span class="kw">${k}</span>`).join("")}</div>`;
  }
  if(c.sequence && c.sequence.length){
    h += `<div class="back-title rep">Sequence</div><ol class="seq-list">${c.sequence.map(s=>`<li>${s}</li>`).join("")}</ol>`;
  }
  if(c.distinction){
    h += `<div class="distinction-box">${c.distinction}</div>`;
  }
  h += `<div class="mastery-row">
    <button class="mastery-btn" data-act="review">Needs Review</button>
    <button class="mastery-btn" data-act="mastered">Mastered</button>
  </div>`;
  return h;
}

function render(){
  const total = deck.length;
  document.getElementById("progressLabel").textContent = total ? `Card ${idx+1} of ${total}` : "No cards match filters";
  document.getElementById("progressFill").style.width = total ? `${((idx+1)/total)*100}%` : "0%";
  const stage = document.getElementById("stage");
  if(!total){ stage.innerHTML = '<div class="empty-state">No cards match the current filters. Try clearing a filter.</div>'; return; }
  if(!document.getElementById("card")){ location.reload(); return; }
  const c = deck[idx];
  const card = document.getElementById("card");
  card.classList.remove("flipped"); flipped = false;
  document.getElementById("frontBadge").className = "badge " + (BADGE_CLASS[c.badge]||"cyan");
  document.getElementById("frontBadge").textContent = c.badge;
  document.getElementById("frontPrompt").textContent = c.front;
  document.getElementById("backFace").innerHTML = renderBack(c);
  bindMasteryButtons(c);
  document.getElementById("prevBtn").disabled = idx===0;
  document.getElementById("nextBtn").disabled = idx===total-1;
}

function bindMasteryButtons(c){
  document.querySelectorAll(".mastery-btn").forEach(btn=>{
    const act = btn.dataset.act;
    if(window.__MASTERY_MEM__[c.id]===act) btn.dataset.state = act;
    btn.onclick = (e)=>{
      e.stopPropagation();
      window.__MASTERY_MEM__[c.id] = window.__MASTERY_MEM__[c.id]===act ? undefined : act;
      document.querySelectorAll(".mastery-btn").forEach(b=>b.removeAttribute("data-state"));
      if(window.__MASTERY_MEM__[c.id]) btn.dataset.state = window.__MASTERY_MEM__[c.id];
    };
  });
}

function flip(){ if(!deck.length) return; const card = document.getElementById("card"); flipped=!flipped; card.classList.toggle("flipped", flipped); }
function next(){ if(idx<deck.length-1){ idx++; render(); } }
function prev(){ if(idx>0){ idx--; render(); } }
function shuffle(){
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  idx=0; render();
}

document.getElementById("card").addEventListener("click", flip);
document.getElementById("flipBtn").addEventListener("click", flip);
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("shuffleBtn").addEventListener("click", shuffle);

document.addEventListener("keydown", (e)=>{
  if(document.getElementById("gridSearch")===document.activeElement) return;
  if(e.code==="Space" || e.code==="ArrowUp"){ e.preventDefault(); flip(); }
  else if(e.code==="ArrowLeft"){ prev(); }
  else if(e.code==="ArrowRight"){ next(); }
  else if(e.code==="KeyR"){ shuffle(); }
});

// ---- Filters setup ----
const tags = [...new Set(CARDS.map(c=>c.badge))];
const cats = [...new Set(CARDS.map(c=>c.category))];
document.getElementById("tagChips").innerHTML = tags.map(t=>`<div class="chip" data-tag="${t}">${t} <span class="count">${CARDS.filter(c=>c.badge===t).length}</span></div>`).join("");
document.getElementById("catChips").innerHTML = cats.map(c=>`<div class="chip" data-cat="${c}">${c} <span class="count">${CARDS.filter(x=>x.category===c).length}</span></div>`).join("");

document.getElementById("tagChips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  const t = chip.dataset.tag;
  activeTag = activeTag===t ? null : t;
  document.querySelectorAll("#tagChips .chip").forEach(c=>c.dataset.active = (c.dataset.tag===activeTag) ? "true":"false");
  applyFilters();
});
document.getElementById("catChips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  const c = chip.dataset.cat;
  activeCat = activeCat===c ? null : c;
  document.querySelectorAll("#catChips .chip").forEach(x=>x.dataset.active = (x.dataset.cat===activeCat) ? "true":"false");
  applyFilters();
});
document.getElementById("statusChips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  activeStatus = chip.dataset.status;
  document.querySelectorAll("#statusChips .chip").forEach(c=>c.dataset.active = (c.dataset.status===activeStatus)?"true":"false");
  applyFilters();
});
document.getElementById("filterToggleBtn").addEventListener("click", ()=>{
  document.getElementById("filterPanel").classList.toggle("open");
});

// ---- Mode toggle ----
document.getElementById("studyModeBtn").addEventListener("click", ()=>{
  document.getElementById("studyModeBtn").dataset.active="true";
  document.getElementById("gridModeBtn").dataset.active="false";
  document.getElementById("stage").classList.remove("hidden");
  document.querySelector(".controls").style.display="flex";
  document.getElementById("gridWrap").classList.remove("active");
});
document.getElementById("gridModeBtn").addEventListener("click", ()=>{
  document.getElementById("studyModeBtn").dataset.active="false";
  document.getElementById("gridModeBtn").dataset.active="true";
  document.getElementById("stage").classList.add("hidden");
  document.querySelector(".controls").style.display="none";
  document.getElementById("gridWrap").classList.add("active");
  renderGrid(CARDS);
});
function renderGrid(list){
  document.getElementById("gridCards").innerHTML = list.map(c=>`
    <div class="gcard">
      <div class="badge ${BADGE_CLASS[c.badge]||'cyan'}">${c.badge}</div>
      <div class="front-prompt">${c.front}</div>
      <ul class="bullets">${c.definition.slice(0,3).map(d=>`<li>${d}</li>`).join("")}</ul>
    </div>`).join("") || '<div class="empty-state">No matches.</div>';
}
document.getElementById("gridSearch").addEventListener("input", (e)=>{
  const q = e.target.value.toLowerCase();
  const list = CARDS.filter(c=> c.front.toLowerCase().includes(q) || c.definition.join(" ").toLowerCase().includes(q) || (c.keywords||[]).join(" ").toLowerCase().includes(q));
  renderGrid(list);
});

render();
</script>
</body>
</html>
