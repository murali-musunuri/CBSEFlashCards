<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Linear Programming — Flashcards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" id="MathJax-script" async></script>

<style>
  :root{
    /* ---- Light theme (default tokens) ---- */
    --bg:#f5f7fc;
    --bg-2:#eaeef8;
    --grid-line: rgba(40,55,100,0.055);
    --grid-line-strong: rgba(40,55,100,0.09);
    --surface: rgba(255,255,255,0.62);
    --surface-hi: rgba(255,255,255,0.86);
    --surface-border: rgba(30,40,80,0.10);
    --surface-border-hi: rgba(30,40,80,0.18);
    --text: #171c2c;
    --text-dim: #454f68;
    --text-mute: #7a8298;
    --teal:#0d9488;
    --teal-solid-ink:#052620;
    --teal-dim: rgba(13,148,136,0.12);
    --amber:#a4650a;
    --amber-dim: rgba(164,101,10,0.12);
    --violet:#6d5bd0;
    --violet-dim: rgba(109,91,208,0.12);
    --success:#0f8a5f;
    --success-dim: rgba(15,138,95,0.12);
    --danger:#c33a5d;
    --danger-dim: rgba(195,58,93,0.12);
    --shadow-lg: 0 30px 60px -25px rgba(30,40,80,0.28);
    --shadow-md: 0 12px 28px -12px rgba(30,40,80,0.30);
    --radius: 20px;
    --nav-bg: rgba(255,255,255,0.80);
    color-scheme: light;
  }

  /* ---- Dark theme: OS preference (only when no explicit light choice) ---- */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0e17;
      --bg-2:#0d1220;
      --grid-line: rgba(150,175,255,0.05);
      --grid-line-strong: rgba(150,175,255,0.09);
      --surface: rgba(255,255,255,0.055);
      --surface-hi: rgba(255,255,255,0.09);
      --surface-border: rgba(255,255,255,0.10);
      --surface-border-hi: rgba(255,255,255,0.18);
      --text: #eaf0fa;
      --text-dim: #aab2c5;
      --text-mute: #737d94;
      --teal:#2fe0c4;
      --teal-solid-ink:#052620;
      --teal-dim: rgba(47,224,196,0.16);
      --amber:#f6b93b;
      --amber-dim: rgba(246,185,59,0.12);
      --violet:#9d8cf9;
      --violet-dim: rgba(157,140,249,0.14);
      --success:#34d399;
      --success-dim: rgba(52,211,153,0.16);
      --danger:#fb7185;
      --danger-dim: rgba(251,113,133,0.16);
      --shadow-lg: 0 30px 60px -20px rgba(0,0,0,0.6);
      --shadow-md: 0 12px 30px -10px rgba(0,0,0,0.55);
      --nav-bg: rgba(15,19,30,0.82);
      color-scheme: dark;
    }
  }

  /* ---- Dark theme: explicit toggle (wins either way) ---- */
  :root[data-theme="dark"]{
    --bg:#0a0e17;
    --bg-2:#0d1220;
    --grid-line: rgba(150,175,255,0.05);
    --grid-line-strong: rgba(150,175,255,0.09);
    --surface: rgba(255,255,255,0.055);
    --surface-hi: rgba(255,255,255,0.09);
    --surface-border: rgba(255,255,255,0.10);
    --surface-border-hi: rgba(255,255,255,0.18);
    --text: #eaf0fa;
    --text-dim: #aab2c5;
    --text-mute: #737d94;
    --teal:#2fe0c4;
    --teal-solid-ink:#052620;
    --teal-dim: rgba(47,224,196,0.16);
    --amber:#f6b93b;
    --amber-dim: rgba(246,185,59,0.12);
    --violet:#9d8cf9;
    --violet-dim: rgba(157,140,249,0.14);
    --success:#34d399;
    --success-dim: rgba(52,211,153,0.16);
    --danger:#fb7185;
    --danger-dim: rgba(251,113,133,0.16);
    --shadow-lg: 0 30px 60px -20px rgba(0,0,0,0.6);
    --shadow-md: 0 12px 30px -10px rgba(0,0,0,0.55);
    --nav-bg: rgba(15,19,30,0.82);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color:var(--text);
    font-family:'Manrope', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      radial-gradient(1100px 700px at 15% -10%, var(--violet-dim), transparent 60%),
      radial-gradient(900px 600px at 100% 10%, var(--teal-dim), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-size: 34px 34px, 34px 34px, auto, auto, auto;
    background-attachment: fixed;
    overflow-x:hidden;
    animation: ambient-drift 22s ease-in-out infinite;
  }
  @keyframes ambient-drift{
    0%,100%{ background-position: 0 0, 0 0, 15% -10%, 100% 10%, 0 0; }
    50%{ background-position: 6px 6px, 6px 6px, 19% -6%, 95% 14%, 0 0; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  ::selection{ background:var(--teal-dim); color:var(--text); }

  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  .display{ font-family:'Manrope', ui-sans-serif, sans-serif; font-weight:800; }

  a{ color:var(--teal); }

  /* ---------- App shell ---------- */
  .app{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom: 128px; /* room for fixed nav */
  }

  header.top{
    position:sticky; top:0; z-index:40;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    background: var(--nav-bg);
    border-bottom:1px solid var(--surface-border);
  }
  .top-inner{
    max-width: 980px; margin:0 auto;
    padding: 14px 18px 12px;
  }
  .brand-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px; min-width:0;
  }
  .brand-mark{
    flex:none; width:34px; height:34px; border-radius:10px;
    background: linear-gradient(135deg, var(--teal), var(--violet));
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-weight:600; color:var(--teal-solid-ink); font-size:13px;
    box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--teal) 55%, transparent);
  }
  .brand-text h1{
    font-family:'Manrope'; font-weight:800; font-size:15.5px; margin:0; letter-spacing:0.1px; line-height:1.25;
  }
  .brand-text p{
    margin:1px 0 0; font-size:11.5px; color:var(--text-mute); font-family:'IBM Plex Mono'; letter-spacing:0.3px;
  }

  .mode-tabs{
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--surface-border);
    padding:4px; border-radius:12px; flex:none;
  }
  .mode-tab{
    appearance:none; border:none; cursor:pointer; background:transparent; color:var(--text-dim);
    font-family:'Manrope'; font-weight:700; font-size:12.5px; padding:7px 13px; border-radius:9px;
    transition: all .18s ease;
  }
  .mode-tab.active{
    background: var(--teal); color:var(--teal-solid-ink);
    box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--teal) 50%, transparent);
  }
  .mode-tab:not(.active):hover{ color:var(--text); background:var(--surface-hi); }

  .header-controls{ display:flex; align-items:center; gap:8px; flex:none; }
  .theme-toggle{
    appearance:none; cursor:pointer; width:38px; height:38px; border-radius:12px; flex:none;
    background:var(--surface); border:1px solid var(--surface-border); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; transition:.15s ease;
  }
  .theme-toggle:hover{ color:var(--text); background:var(--surface-hi); border-color:var(--surface-border-hi); }
  .theme-toggle svg{ width:17px; height:17px; display:none; }
  .theme-toggle[data-theme-state="light"] .icon-sun{ display:block; }
  .theme-toggle[data-theme-state="dark"] .icon-moon{ display:block; }
  .theme-toggle[data-theme-state="system"] .icon-auto{ display:block; }

  .progress-row{
    margin-top:12px; display:flex; align-items:center; gap:10px;
  }
  .progress-track{
    flex:1; height:6px; border-radius:99px; background:var(--surface); overflow:hidden; border:1px solid var(--surface-border);
  }
  .progress-fill{
    height:100%; border-radius:99px;
    background: linear-gradient(90deg, var(--violet), var(--teal));
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-mute); white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }

  .settings-panel{ display:none; }
  .settings-panel.open{ display:block; }
  .settings-btn svg{ display:block !important; }
  .theme-toggle.active{ color:var(--teal); background:var(--teal-dim); border-color: color-mix(in srgb, var(--teal) 45%, transparent); }
  .filter-row{
    margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  }
  .chip{
    appearance:none; cursor:pointer; font-family:'IBM Plex Mono'; font-size:11px; font-weight:500;
    padding:5px 11px; border-radius:99px; border:1px solid var(--surface-border); background:var(--surface);
    color:var(--text-dim); transition:.15s ease; letter-spacing:.2px;
  }
  .chip:hover{ border-color:var(--surface-border-hi); color:var(--text); }
  .chip.active{ background:var(--teal-dim); border-color:color-mix(in srgb, var(--teal) 50%, transparent); color:var(--teal); }
  .chip .n{ opacity:.65; margin-left:4px; }

  /* ---------- Gamification: streak / mastery / level ---------- */
  .stats-row{
    margin-top:9px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .streak-chip{
    display:inline-flex; align-items:center; gap:5px; flex:none;
    font-family:'IBM Plex Mono'; font-size:11.5px; font-weight:600; color:var(--text-dim);
    background:var(--surface); border:1px solid var(--surface-border); padding:5px 10px 5px 8px; border-radius:99px;
    transition: all .2s ease;
  }
  .streak-chip.hot{ color:var(--amber); background:var(--amber-dim); border-color:color-mix(in srgb, var(--amber) 45%, transparent); }
  .streak-flame{ font-size:13px; filter:grayscale(1) opacity(0.55); transition:filter .25s ease, transform .25s ease; }
  .streak-chip.hot .streak-flame{ filter:none; animation: flame-pulse 1.1s ease-in-out infinite; }
  @keyframes flame-pulse{ 0%,100%{ transform:scale(1) rotate(-2deg); } 50%{ transform:scale(1.18) rotate(2deg); } }

  .mastery-track{
    flex:1; min-width:90px; height:6px; border-radius:99px; background:var(--surface); overflow:hidden; border:1px solid var(--surface-border);
  }
  .mastery-fill{
    height:100%; border-radius:99px; background: linear-gradient(90deg, var(--success), var(--teal));
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }
  .mastery-label{
    font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-mute); white-space:nowrap; font-variant-numeric: tabular-nums;
  }
  .level-badge{
    flex:none; font-family:'Manrope'; font-weight:800; font-size:11px; letter-spacing:.3px; text-transform:uppercase;
    padding:5px 11px; border-radius:99px; color:var(--teal-solid-ink); background:var(--surface-border-hi);
    transition: background .3s ease, color .3s ease;
  }
  .level-badge.lv-rookie{ background:var(--surface-hi); color:var(--text-dim); }
  .level-badge.lv-solid{ background:var(--teal-dim); color:var(--teal); }
  .level-badge.lv-sharp{ background:var(--violet-dim); color:var(--violet); }
  .level-badge.lv-ace{ background: linear-gradient(120deg, var(--amber), var(--teal)); color:var(--teal-solid-ink); }

  /* ---------- Toasts & celebration burst ---------- */
  .toast-stack{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:80;
    display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;
  }
  .toast{
    font-family:'Manrope'; font-weight:700; font-size:13px; color:var(--text);
    background:var(--surface-hi); border:1px solid var(--surface-border-hi); backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    padding:10px 18px; border-radius:14px; box-shadow: var(--shadow-md);
    animation: toast-in .35s cubic-bezier(.22,1,.36,1) both;
    display:flex; align-items:center; gap:8px;
  }
  .toast.leaving{ animation: toast-out .3s ease both; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(-14px) scale(.92); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes toast-out{ to{ opacity:0; transform:translateY(-10px) scale(.94); } }

  .burst-layer{ position:fixed; inset:0; pointer-events:none; z-index:75; overflow:hidden; }
  .burst-piece{
    position:absolute; top:50%; left:50%; width:8px; height:8px; border-radius:2px;
    animation: burst-fly 900ms cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes burst-fly{
    0%{ transform: translate(-50%,-50%) rotate(0deg) scale(1); opacity:1; }
    100%{ transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(.4); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .streak-chip.hot .streak-flame{ animation:none; }
    .burst-piece{ animation:none; display:none; }
  }

  .group-row{
    margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between;
    padding-top:8px; border-top:1px dashed var(--surface-border);
  }
  .type-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .type-chip.active[data-type="board"]{ background:var(--amber-dim); border-color:color-mix(in srgb, var(--amber) 50%, transparent); color:var(--amber); }
  .type-chip.active[data-type="cuet"]{ background:var(--violet-dim); border-color:color-mix(in srgb, var(--violet) 50%, transparent); color:var(--violet); }
  .type-chip.active[data-type="pitfall"]{ background:var(--danger-dim); border-color:color-mix(in srgb, var(--danger) 50%, transparent); color:var(--danger); }
  .type-chip.active[data-type="worked"]{ background:var(--teal-dim); border-color:color-mix(in srgb, var(--teal) 50%, transparent); color:var(--teal); }
  .type-chip.active[data-type="all"]{ background:var(--surface-hi); border-color:var(--surface-border-hi); color:var(--text); }

  .topic-select{
    appearance:none; cursor:pointer; font-family:'IBM Plex Mono'; font-size:11px; font-weight:500;
    padding:6px 30px 6px 12px; border-radius:99px; border:1px solid var(--surface-border); background:var(--surface);
    color:var(--text-dim); letter-spacing:.2px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position: right 9px center; background-size:13px;
  }
  .topic-select:hover{ border-color:var(--surface-border-hi); color:var(--text); }
  .topic-select:focus-visible{ outline:2px solid var(--teal); outline-offset:1px; }

  .grid-section-header{
    grid-column: 1 / -1;
    display:flex; align-items:baseline; gap:10px;
    margin: 6px 0 -2px; padding-bottom:8px; border-bottom:1px solid var(--surface-border);
  }
  .grid-section-header:first-child{ margin-top:0; }
  .grid-section-header h2{
    font-family:'Manrope'; font-weight:800; font-size:14px; margin:0; color:var(--text);
  }
  .grid-section-header .n{
    font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-mute);
  }

  /* ---------- Study stage ---------- */
  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding: 26px 16px 10px;
  }
  .card-wrap{
    width:100%; max-width:640px;
    perspective: 1800px;
  }
  .card{
    position:relative; width:100%; min-height: clamp(300px, 48vh, 420px);
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.22,1,.36,1);
    cursor:pointer;
  }
  .card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    border-radius: var(--radius);
    background: linear-gradient(160deg, var(--surface-hi), var(--surface));
    border:1px solid var(--surface-border);
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backface-visibility:hidden;
    display:flex; flex-direction:column;
    padding: 26px 26px 20px;
    overflow:hidden;
  }
  .face::before{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }
  .face.back{ transform: rotateY(180deg); }

  .face-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:600; letter-spacing:.4px; text-transform:uppercase;
    padding:6px 10px; border-radius:8px; border:1px solid;
  }
  .tag.board{ color:var(--amber); border-color:color-mix(in srgb, var(--amber) 40%, transparent); background:var(--amber-dim); }
  .tag.cuet{ color:var(--violet); border-color:color-mix(in srgb, var(--violet) 45%, transparent); background:var(--violet-dim); }
  .tag.pitfall{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, transparent); background:var(--danger-dim); }
  .tag.worked{ color:var(--teal); border-color:color-mix(in srgb, var(--teal) 40%, transparent); background:var(--teal-dim); }

  .cat-pill{
    font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-mute); white-space:nowrap; padding-top:8px;
  }

  .face-body{
    flex:1; display:flex; align-items:center; margin-top:14px; overflow-y:auto; padding-right:2px;
  }
  .front-prompt{
    font-family:'Manrope'; font-weight:800; font-size: clamp(17px, 3.4vw, 23px); line-height:1.38; letter-spacing:0.1px;
  }
  .back-content{
    font-size:15px; line-height:1.62; color:var(--text-dim);
  }
  .back-content b, .back-content strong{ color:var(--text); }
  .back-content mjx-container{ color:var(--text) !important; }

  .flip-hint{
    text-align:center; font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-mute);
    letter-spacing:.4px; margin-top:10px;
  }

  .assess-row{
    display:flex; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--surface-border);
  }
  .assess-btn{
    flex:1; appearance:none; cursor:pointer; border-radius:12px; padding:11px 10px; font-family:'Manrope';
    font-weight:700; font-size:13px; border:1px solid var(--surface-border); background:var(--surface);
    color:var(--text-dim); display:flex; align-items:center; justify-content:center; gap:7px; transition:.15s ease;
  }
  .assess-btn:hover{ transform: translateY(-1px); }
  .assess-btn:active, .nav-btn:active, .chip:active, .mode-tab:active, .theme-toggle:active{ transform: scale(0.94); }
  .assess-btn.review{ }
  .assess-btn.review:hover, .assess-btn.review.active{ background:var(--danger-dim); border-color:color-mix(in srgb, var(--danger) 50%, transparent); color:var(--danger); }
  .assess-btn.mastered:hover, .assess-btn.mastered.active{ background:var(--success-dim); border-color:color-mix(in srgb, var(--success) 50%, transparent); color:var(--success); }

  .status-dot{
    position:absolute; top:14px; right:14px; width:9px; height:9px; border-radius:50%;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
  }
  .status-dot.mastered{ background:var(--success); }
  .status-dot.review{ background:var(--danger); }

  /* ---------- Bottom nav ---------- */
  nav.bottom{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:center;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .nav-cluster{
    pointer-events:auto;
    display:flex; align-items:center; gap:6px;
    background: var(--nav-bg);
    border:1px solid var(--surface-border-hi);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-radius: 20px;
    padding:8px; box-shadow: var(--shadow-md);
  }
  .nav-btn{
    appearance:none; cursor:pointer; border:none; background:transparent; color:var(--text-dim);
    width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    transition:.15s ease; flex:none;
  }
  .nav-btn:hover{ background:var(--surface-hi); color:var(--text); }
  .nav-btn svg{ width:19px; height:19px; }
  .nav-btn.primary{
    width:auto; padding:0 22px; height:48px; border-radius:15px; gap:8px;
    background: var(--teal); color:var(--teal-solid-ink); font-weight:800;
    font-family:'Manrope'; font-size:13.5px;
    box-shadow: 0 10px 22px -8px color-mix(in srgb, var(--teal) 55%, transparent);
  }
  .nav-btn.primary:hover{ filter:brightness(1.06); }
  .nav-sep{ width:1px; height:26px; background:var(--surface-border); margin:0 2px; }

  /* ---------- Grid mode ---------- */
  .grid-view{ max-width:1180px; margin:0 auto; padding: 22px 16px 10px; width:100%; }
  .grid-cards{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:14px;
  }
  .mini-card{
    position:relative; min-height:190px; border-radius:16px;
    background: linear-gradient(160deg, var(--surface-hi), var(--surface));
    border:1px solid var(--surface-border);
    padding:16px; cursor:pointer; display:flex; flex-direction:column;
    transition: transform .18s ease, border-color .18s ease;
  }
  .mini-card:hover{ transform: translateY(-2px); border-color:var(--surface-border-hi); }
  .mini-card .tag{ font-size:9px; padding:4px 8px; align-self:flex-start; }
  .mini-card .mini-idx{ position:absolute; top:14px; right:14px; font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-mute); }
  .mini-front{ font-family:'Manrope'; font-weight:800; font-size:14px; line-height:1.4; margin-top:10px; flex:1; }
  .mini-back{ font-size:12.5px; line-height:1.55; color:var(--text-dim); margin-top:10px; display:none; flex:1; overflow-y:auto; max-height:220px; }
  .mini-card.flipped .mini-front{ display:none; }
  .mini-card.flipped .mini-back{ display:block; }
  .mini-flip-note{ font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--text-mute); margin-top:10px; }
  .mini-status{ position:absolute; top:14px; left:14px; width:8px; height:8px; border-radius:50%; }
  .mini-status.mastered{ background:var(--success); }
  .mini-status.review{ background:var(--danger); }

  .empty-state{
    text-align:center; padding: 60px 20px; color:var(--text-mute); font-family:'IBM Plex Mono'; font-size:13px;
  }

  /* scrollbars */
  .face-body::-webkit-scrollbar, .mini-back::-webkit-scrollbar{ width:6px; }
  .face-body::-webkit-scrollbar-thumb, .mini-back::-webkit-scrollbar-thumb{ background:var(--surface-border-hi); border-radius:99px; }

  @media (max-width: 560px){
    .card{ min-height: clamp(280px, 46vh, 460px); }
    .face{ padding:20px 18px 16px; }
    nav.bottom{ padding: 12px 10px calc(12px + env(safe-area-inset-bottom)); }
    .nav-cluster{ gap:3px; padding:6px; }
    .nav-btn{ width:40px; height:40px; }
    .nav-btn.primary{ padding:0 16px; height:44px; font-size:12.5px; }
  }
</style>

<script>
(function(){

  /* ===================== CARD DATA ===================== */
  var CARDS = [
    {cat:"Terminology", tag:"board", tagLabel:"Board Tip", front:"What is the Objective Function in an LPP?",
     back:"The linear function $Z = ax + by$ that is to be <b>maximized or minimized</b>, where $a, b$ are constants (unit profit/cost) and $x, y$ are decision variables. Example: $Z = 40x + 50y$. Board answers must state $Z$ explicitly before graphing."},
    {cat:"Terminology", tag:"board", tagLabel:"Board Tip", front:"Decision Variables — definition and notation",
     back:"The variables (usually $x, y$) whose values are determined to optimize $Z$. They represent quantities under the decision-maker's control. Always define them in words first: <i>\"Let $x$ = number of units of A, $y$ = number of units of B produced.\"</i>"},
    {cat:"Terminology", tag:"board", tagLabel:"Board Tip", front:"What are Constraints in an LPP?",
     back:"Linear inequations/equations on the decision variables arising from limited resources. Two kinds: <b>Structural constraints</b> — from resource limits (e.g. $3x+5y\\le45$); <b>Non-negativity constraints</b> — $x\\ge0,\\ y\\ge0$."},
    {cat:"Terminology", tag:"pitfall", tagLabel:"Pitfall", front:"Non-negativity restriction — what and why?",
     back:"The condition $x \\ge 0,\\ y \\ge 0$, required because decision variables represent physical quantities that cannot be negative. Forgetting it is one of the most common mark-losses — it restricts the feasible region to Quadrant I."},
    {cat:"Terminology", tag:"board", tagLabel:"Board Tip", front:"Optimal Value of an LPP — definition",
     back:"The maximum or minimum value of $Z$ over the feasible region. It is always attained at a <b>corner point</b> of the region — never at an interior point."},
    {cat:"Terminology", tag:"board", tagLabel:"Board Tip", front:"Define a Linear Programming Problem (LPP)",
     back:"A problem of maximizing or minimizing a linear objective function $Z=ax+by$, subject to a set of linear constraints (inequations) and non-negativity restrictions on the decision variables."},
    {cat:"Terminology", tag:"board", tagLabel:"Board Tip", front:"Feasible Solution — definition",
     back:"Any point $(x,y)$ that satisfies <b>all</b> the constraints (structural + non-negativity) simultaneously. The set of all feasible solutions forms the Feasible Region."},
    {cat:"Terminology", tag:"board", tagLabel:"Board Tip", front:"Feasible Region — definition and shape",
     back:"The common (intersection) region satisfying all constraints simultaneously. It is always a <b>convex set</b> — a bounded polygon or an unbounded convex area — never has an indentation."},
    {cat:"Terminology", tag:"cuet", tagLabel:"CUET Shortcut", front:"Why is the feasible region always convex?",
     back:"It is formed by the intersection of half-planes, each of which is convex, and the intersection of convex sets is always convex. Practically: the segment joining any two feasible points lies entirely within the region."},
    {cat:"Terminology", tag:"board", tagLabel:"Board Tip", front:"Corner Point (Vertex) of the feasible region — definition",
     back:"A point where two boundary (constraint) lines of the feasible region intersect. The optimal value of $Z$, if it exists, always occurs at a corner point — the basis of the Corner Point Method."},
    {cat:"Terminology", tag:"board", tagLabel:"Board Tip", front:"Optimization — definition",
     back:"The process of finding the values of the decision variables that maximize or minimize the objective function $Z$, while satisfying every constraint of the LPP. This process — not just the final number — is what \"solving\" an LPP means."},

    {cat:"Formulation", tag:"board", tagLabel:"Board Tip", front:"Algorithm: steps to formulate an LPP from a word problem",
     back:"1) Identify &amp; define decision variables ($x,y$).<br>2) Identify the objective and write $Z=ax+by$.<br>3) Identify resource constraints from the data and write as inequations.<br>4) Add non-negativity restrictions $x\\ge0,\\ y\\ge0$.<br>CBSE Applied Maths caps this at <b>3 non-trivial constraints</b>."},
    {cat:"Formulation", tag:"board", tagLabel:"Board Tip", front:"Trivial vs Non-trivial constraints — what does \"3 non-trivial constraints\" mean?",
     back:"Non-negativity restrictions ($x\\ge0,\\ y\\ge0$) are treated as <b>trivial</b> — every LPP has them by default. <b>Non-trivial constraints</b> are the structural, resource-based inequations specific to the problem (e.g. $3x+5y\\le45$) — CBSE Applied Maths caps formulation at 3 of these."},
    {cat:"Formulation", tag:"board", tagLabel:"Board Tip", front:"Structural constraints vs Non-negativity constraints — difference",
     back:"Structural constraints come from limited resources (e.g. $2x+3y\\le120$) and can use $\\le$, $\\ge$ or $=$. Non-negativity constraints are always $x\\ge0,\\ y\\ge0$ and apply to every LPP regardless of context."},
    {cat:"Formulation", tag:"pitfall", tagLabel:"Pitfall", front:"What happens if you drop x≥0, y≥0 while formulating?",
     back:"The feasible region is no longer confined to Quadrant I, so the graph and every corner point found become invalid — even with a correct objective function. Always state $x\\ge0,\\ y\\ge0$ as the final line of formulation."},
    {cat:"Formulation", tag:"board", tagLabel:"Board Tip", front:"How to convert a resource-data table into constraint inequations",
     back:"For each resource (row): $\\sum$(units of resource per product $\\times$ quantity produced) $\\le$ Total resource available. E.g. chairs need 3 hrs, tables need 2 hrs, 12 hrs/day available: $3x+2y\\le12$."},
    {cat:"Formulation", tag:"worked", tagLabel:"Worked Example", front:"Formulate: chairs give ₹20 profit (3 hrs each), tables give ₹30 profit (5 hrs each); 45 hrs/day available; at most 8 tables sellable/day.",
     back:"Let $x$ = chairs, $y$ = tables.<br>Maximize $Z = 20x+30y$<br>subject to: $3x+5y\\le45$ (hours), $y\\le8$ (demand cap), $x\\ge0,\\ y\\ge0$."},
    {cat:"Formulation", tag:"worked", tagLabel:"Worked Example", front:"Formulate: Food A ₹6/unit (2 vitamin, 1 protein), Food B ₹5/unit (1 vitamin, 3 protein); need ≥8 vitamin, ≥9 protein daily.",
     back:"Let $x$ = units of A, $y$ = units of B.<br>Minimize $Z = 6x+5y$<br>subject to: $2x+y\\ge8$ (vitamin), $x+3y\\ge9$ (protein), $x\\ge0,\\ y\\ge0$.<br>Diet problems typically use $\\ge$ (minimum requirement), unlike manufacturing's $\\le$."},
    {cat:"Formulation", tag:"cuet", tagLabel:"CUET Shortcut", front:"Translating word-problem language into inequality symbols",
     back:"\"At least\", \"minimum\", \"not less than\" → $\\ge$.<br>\"At most\", \"maximum\", \"not more than\", \"cannot exceed\" → $\\le$.<br>\"Exactly\", \"exactly equal to\" → $=$.<br>Misreading these keywords is one of the fastest ways to formulate the wrong LPP."},

    {cat:"Types of LPP", tag:"board", tagLabel:"Board Tip", front:"Manufacturing-type LPP — signature features",
     back:"Objective: usually <b>maximize</b> profit/revenue. Constraints: usually $\\le$ (limited machine hours, labour, raw material, demand cap). Decision variables: units of each product produced."},
    {cat:"Types of LPP", tag:"board", tagLabel:"Board Tip", front:"Diet-type LPP — signature features",
     back:"Objective: usually <b>minimize</b> cost. Constraints: usually $\\ge$ (minimum nutritional requirement). Decision variables: quantity of each food item."},
    {cat:"Types of LPP", tag:"cuet", tagLabel:"CUET Shortcut", front:"Allocation/Transportation-type LPP — signature features",
     back:"Objective: minimize transportation cost or maximize allocation benefit, subject to <b>supply-limit</b> ($\\le$) and <b>demand-requirement</b> ($\\ge$) constraints together — a hybrid pattern worth spotting quickly in MCQs."},
    {cat:"Types of LPP", tag:"board", tagLabel:"Board Tip", front:"Investment-allocation LPP — signature features",
     back:"Objective: maximize return $Z=r_1x+r_2y$. Constraints: total investible capital ($x+y\\le$ budget), often plus a policy constraint like a minimum/maximum proportion in one option."},
    {cat:"Types of LPP", tag:"cuet", tagLabel:"CUET Shortcut", front:"Keyword cues: is a word problem Max or Min?",
     back:"\"Profit, revenue, output, return, gain\" → <b>Maximize</b>. \"Cost, expenditure, distance, time, requirement met\" → <b>Minimize</b>. This tells you which end of the feasible region to expect the optimum near."},
    {cat:"Types of LPP", tag:"cuet", tagLabel:"CUET Shortcut", front:"Constraint-direction pattern by LPP type — quick table",
     back:"Manufacturing (resources limited) → $\\le$.<br>Diet (nutrition needed) → $\\ge$.<br>Transportation (supply &amp; demand) → mixed $\\le$ and $\\ge$.<br>Use this to sanity-check your formulated inequations fast."},

    {cat:"Graphical Method", tag:"board", tagLabel:"Board Tip", front:"Algorithm: graphing one linear inequality, e.g. $3x+5y\\le45$",
     back:"1) Treat as equation $3x+5y=45$; find intercepts: $x=15$ (put $y=0$), $y=9$ (put $x=0$).<br>2) Plot the line joining $(15,0)$ and $(0,9)$ — solid, since $\\le$ includes equality.<br>3) Use the origin test to shade the correct side."},
    {cat:"Graphical Method", tag:"board", tagLabel:"Board Tip", front:"The Origin Test — how and why",
     back:"Substitute $(0,0)$ into the inequality. If satisfied (true), shade the side containing the origin; if false, shade the opposite side. Use any other convenient point only when the line itself passes through the origin."},
    {cat:"Graphical Method", tag:"board", tagLabel:"Board Tip", front:"Solid line vs dashed line convention",
     back:"CBSE Applied Maths LPP constraints are always $\\le$ or $\\ge$ (never strict $&lt;,&gt;$), so boundary lines are always drawn <b>solid</b> — points on the line are included in the feasible region."},
    {cat:"Graphical Method", tag:"board", tagLabel:"Board Tip", front:"Finding the x- and y-intercepts of $ax+by=c$",
     back:"x-intercept: set $y=0 \\Rightarrow x=c/a$, giving $(c/a,\\ 0)$.<br>y-intercept: set $x=0 \\Rightarrow y=c/b$, giving $(0,\\ c/b)$.<br>These two points fully determine the boundary line."},
    {cat:"Graphical Method", tag:"board", tagLabel:"Board Tip", front:"Half-plane — definition",
     back:"The region of the plane lying on one side of a boundary line $ax+by=c$. Every linear inequality (e.g. $ax+by\\le c$) represents a closed half-plane — boundary included, since board-level constraints are always $\\le$ or $\\ge$. The feasible region is the intersection of several half-planes."},
    {cat:"Graphical Method", tag:"board", tagLabel:"Board Tip", front:"How to find the feasible region with multiple constraints",
     back:"Graph and shade each constraint separately (including $x\\ge0,\\ y\\ge0$, i.e. restrict to Quadrant I). The feasible region is the <b>common overlapping area</b> satisfying every shaded constraint simultaneously — outline it clearly."},
    {cat:"Graphical Method", tag:"board", tagLabel:"Board Tip", front:"Algorithm: the Corner Point Method",
     back:"1) Graph all constraints; identify the feasible region.<br>2) Find every corner point by solving pairs of boundary equations simultaneously.<br>3) Evaluate $Z$ at each corner point.<br>4) Largest value = maximum, smallest = minimum (subject to the unbounded-region check)."},
    {cat:"Graphical Method", tag:"board", tagLabel:"Board Tip", front:"Fundamental Theorem of LPP — bounded feasible region",
     back:"If the feasible region is <b>bounded</b>, $Z=ax+by$ attains both a maximum and a minimum value, and each occurs at a corner point of the feasible region."},
    {cat:"Graphical Method", tag:"board", tagLabel:"Board Tip", front:"Fundamental Theorem of LPP — unbounded feasible region",
     back:"If the region is <b>unbounded</b>, a maximum (or minimum) may or may not exist. If it exists, it still occurs at a corner point — but check whether the open half-plane $ax+by&gt;M$ (max) or $ax+by&lt;m$ (min) shares any point with the feasible region. If yes → that optimal value does not exist."},
    {cat:"Graphical Method", tag:"cuet", tagLabel:"CUET Shortcut", front:"Iso-profit (iso-cost) line method",
     back:"Draw $Z=ax+by=k$ for a convenient constant $k$, then slide it parallel to itself in the direction of increasing (max) or decreasing (min) $Z$. The last corner point it touches before leaving the feasible region is optimal — faster than evaluating every vertex."},
    {cat:"Graphical Method", tag:"pitfall", tagLabel:"Pitfall", front:"Reading corner-point coordinates off the graph",
     back:"Never eyeball intersection coordinates from graph paper alone — always solve the two relevant boundary equations algebraically (simultaneous equations) for exact values. Graph-reading errors are a leading cause of lost marks, even with a correct method."},

    {cat:"Feasible / Unbounded", tag:"board", tagLabel:"Board Tip", front:"Infeasible Solution — definition",
     back:"A point that violates at least one constraint. It does <b>not</b> lie in the feasible region and can never be considered for optimization."},
    {cat:"Feasible / Unbounded", tag:"board", tagLabel:"Board Tip", front:"Bounded feasible region — definition",
     back:"A feasible region that can be enclosed within a circle of finite radius — it does not extend indefinitely in any direction. Manufacturing problems (all $\\le$) typically give bounded regions."},
    {cat:"Feasible / Unbounded", tag:"board", tagLabel:"Board Tip", front:"Unbounded feasible region — definition",
     back:"A feasible region that extends infinitely in at least one direction. Diet-type problems (all $\\ge$) typically give unbounded regions."},
    {cat:"Feasible / Unbounded", tag:"pitfall", tagLabel:"Pitfall", front:"What if the constraints have no common region at all?",
     back:"The LPP is <b>infeasible</b> — no point satisfies all constraints simultaneously, so no feasible (and hence no optimal) solution exists. E.g. $x+y\\le4$ together with $x+y\\ge10$ can never both hold."},
    {cat:"Feasible / Unbounded", tag:"board", tagLabel:"Board Tip", front:"Why does bounded vs unbounded matter for finding Z's optimum?",
     back:"A bounded region guarantees <b>both</b> max and min exist (Fundamental Theorem). An unbounded region only guarantees the optimum exists in the direction it exists at all — you must verify with the open half-plane test before finalizing."},

    {cat:"Solving & Optimizing", tag:"board", tagLabel:"Board Tip", front:"Full procedure: finding the optimal feasible solution",
     back:"Formulate → Graph constraints → Identify feasible region → List all corner points (solve simultaneous equations) → Tabulate $Z$ at each → Pick max/min as required → State the answer in the context of the problem."},
    {cat:"Solving & Optimizing", tag:"board", tagLabel:"Board Tip", front:"Multiple Optimal Solutions — when and how to spot",
     back:"Occurs when the objective line $Z=k$ is <b>parallel</b> to a boundary edge of the feasible region that touches the optimum. Then every point on that entire edge — not just its two corners — gives the same optimal $Z$."},
    {cat:"Solving & Optimizing", tag:"board", tagLabel:"Board Tip", front:"When is the optimal solution unique?",
     back:"When the maximum (or minimum) value of $Z$ occurs at exactly <b>one</b> corner point — i.e. the objective line is not parallel to any binding constraint edge at the optimum."},
    {cat:"Solving & Optimizing", tag:"pitfall", tagLabel:"Pitfall", front:"Unbounded region, problem asks to Maximize — can Z be unbounded?",
     back:"Yes — if the region is unbounded in the direction $Z$ increases, $Z$ can be made arbitrarily large and <b>no maximum exists</b>, even though corner points exist. Always run the open half-plane check ($ax+by&gt;M$) before concluding a maximum from an unbounded region."},
    {cat:"Solving & Optimizing", tag:"worked", tagLabel:"Worked Example", front:"Solve: Maximize $Z=20x+30y$ s.t. $3x+5y\\le45,\\ y\\le8,\\ x,y\\ge0$",
     back:"Corner points: $(0,0)$, $(15,0)$, $(0,8)$, and the intersection of $3x+5y=45$ &amp; $y=8$: $3x+40=45\\Rightarrow x=\\tfrac53$, giving $(\\tfrac53,8)$.<br>$Z$: $(0,0)=0$; $(15,0)=300$; $(0,8)=240$; $(\\tfrac53,8)\\approx273.3$.<br><b>Max $Z=300$ at $(15,0)$</b> — make only chairs."},
    {cat:"Solving & Optimizing", tag:"worked", tagLabel:"Worked Example", front:"Solve: Minimize $Z=6x+5y$ s.t. $2x+y\\ge8,\\ x+3y\\ge9,\\ x,y\\ge0$",
     back:"Region is unbounded (above both lines). Corner points: $(0,8)$, $(9,0)$, and intersection $2x+y=8,\\ x+3y=9 \\Rightarrow (3,2)$.<br>$Z$: $(0,8)=40$; $(3,2)=28$; $(9,0)=54$.<br>Open half-plane $6x+5y&lt;28$ shares no point with the region, so <b>Min $Z=28$ at $(3,2)$</b> is confirmed."},
    {cat:"Solving & Optimizing", tag:"board", tagLabel:"Board Tip", front:"How to verify your optimal solution before finalizing",
     back:"1) Confirm the corner point satisfies <b>every</b> original constraint, not just the two used to solve for it.<br>2) For unbounded regions, run the open half-plane existence check.<br>3) Re-substitute into $Z$ to confirm arithmetic. Marking schemes award a mark specifically for this verification/conclusion."},
    {cat:"Solving & Optimizing", tag:"board", tagLabel:"Board Tip", front:"How to state the final answer",
     back:"Always translate the mathematical optimum back into the problem's words and units: <i>\"Maximum profit is ₹300, obtained by producing 15 chairs and 0 tables per day.\"</i> A bare \"$Z=300$\" without context loses the interpretation mark."},

    {cat:"Exam Technique", tag:"pitfall", tagLabel:"Pitfall", front:"Shading the wrong half-plane",
     back:"Always re-verify with the origin test (or a convenient test point) for <b>every</b> constraint separately — one wrong shade silently changes the entire feasible region and every downstream answer."},
    {cat:"Exam Technique", tag:"pitfall", tagLabel:"Pitfall", front:"Forgetting x≥0, y≥0 confines you to Quadrant I",
     back:"Even with every structural constraint graphed correctly, skipping the Quadrant-I restriction lets negative-coordinate corner points sneak into your table — always confine the feasible region to the first quadrant first."},
    {cat:"Exam Technique", tag:"pitfall", tagLabel:"Pitfall", front:"Evaluating Z at only some corner points",
     back:"Every vertex of the feasible region must be listed and evaluated in the $Z$-table — skipping even one, especially one that looks \"obviously\" non-optimal, is a common way to arrive at the wrong extremum."},
    {cat:"Exam Technique", tag:"board", tagLabel:"Board Tip", front:"Presenting your corner-point Z table",
     back:"Marking schemes reward a clearly ruled table with columns [Corner Point | Value of $Z$], every corner point listed, and the max/min circled or starred with a one-line concluding sentence — presentation carries dedicated marks."},
    {cat:"Exam Technique", tag:"pitfall", tagLabel:"Pitfall", front:"Mislabeling axes or swapping x and y",
     back:"Always decide which axis represents which decision variable <b>before</b> plotting, and keep the labelling consistent through formulation, graph, and final answer — swapping $x\\leftrightarrow y$ midway silently reverses the entire solution."},
    {cat:"Exam Technique", tag:"cuet", tagLabel:"CUET Shortcut", front:"Eliminating options fast in objective-type questions",
     back:"You can often skip the full graph: solve the given constraint-pairs directly for candidate corner points, discard any that violate another stated constraint, then plug the survivors into $Z$ — much faster than sketching under time pressure."},
    {cat:"Exam Technique", tag:"board", tagLabel:"Board Tip", front:"Applied Maths LPP — scope boundary (what's NOT tested)",
     back:"CBSE Applied Mathematics (241) restricts LPP to graphical/corner-point solutions of <b>two-variable</b> problems only, with formulation up to 3 non-trivial constraints. Simplex method, three-variable LPP and sensitivity analysis are outside this syllabus's scope."},
    {cat:"Exam Technique", tag:"cuet", tagLabel:"CUET Shortcut", front:"Quick recall: profit-max pattern vs cost-min pattern",
     back:"<b>Maximize + $\\le$ constraints + bounded region</b> → profit/manufacturing signature.<br><b>Minimize + $\\ge$ constraints + unbounded region</b> (needing the half-plane check) → cost/diet signature. Spotting this early tells you what kind of graph to expect."},
    {cat:"Exam Technique", tag:"board", tagLabel:"Board Tip", front:"Memory hook: where does the optimal value of Z always occur?",
     back:"The optimal value of a linear objective function over a non-empty feasible region — bounded or unbounded — is <b>always</b> attained at a corner point (vertex), never at an interior point. This single fact justifies the entire Corner Point Method."}
  ];

  CARDS.forEach(function(c, i){ c.id = i; });

  /* ===================== STATE ===================== */
  var status = {};       // id -> 'mastered' | 'review'
  var order = CARDS.map(function(c){ return c.id; });
  var isShuffled = false;
  var curPos = 0;
  var mode = 'study';
  var filter = 'all';
  var typeFilter = 'all';
  var topicFilter = 'all';
  var flipped = false;

  var CATEGORIES = (function(){
    var seen = [], set = {};
    CARDS.forEach(function(c){ if(!set[c.cat]){ set[c.cat] = true; seen.push(c.cat); } });
    return seen;
  })();

  var CHAPTER_ID = 'linear-programming';
  var STORAGE_KEY = 'flashcards-' + CHAPTER_ID + '-status';
  var STREAK_KEY = 'flashcards-' + CHAPTER_ID + '-streak';
  function loadStatus(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) status = JSON.parse(raw) || {};
    }catch(e){ status = {}; }
  }
  function saveStatus(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(status)); }catch(e){}
  }
  loadStatus();

  var streak = 0;
  try{ streak = parseInt(localStorage.getItem(STREAK_KEY), 10) || 0; }catch(e){ streak = 0; }
  function saveStreak(){ try{ localStorage.setItem(STREAK_KEY, String(streak)); }catch(e){} }
  var shownMilestones = {};

  /* ===================== Theme (Light / Dark / Auto) ===================== */
  var THEME_KEY = 'flashcards-' + CHAPTER_ID + '-theme';
  var THEME_ORDER = ['system', 'light', 'dark'];
  var THEME_TITLE = { system:'Theme: Auto (follows device)', light:'Theme: Light', dark:'Theme: Dark' };
  var themeToggle = document.getElementById('themeToggle');

  function applyTheme(t){
    if(t === 'dark' || t === 'light'){
      document.documentElement.setAttribute('data-theme', t);
    } else {
      document.documentElement.removeAttribute('data-theme');
      t = 'system';
    }
    if(themeToggle){
      themeToggle.setAttribute('data-theme-state', t);
      themeToggle.setAttribute('title', THEME_TITLE[t]);
    }
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  }

  (function initTheme(){
    var saved = 'system';
    try{ saved = localStorage.getItem(THEME_KEY) || 'system'; }catch(e){}
    applyTheme(saved);
  })();

  if(themeToggle){
    themeToggle.addEventListener('click', function(){
      var current = themeToggle.getAttribute('data-theme-state') || 'system';
      var next = THEME_ORDER[(THEME_ORDER.indexOf(current) + 1) % THEME_ORDER.length];
      applyTheme(next);
    });
  }

  /* ===================== DOM refs ===================== */
  var el = {
    card: document.getElementById('card'),
    frontTag: document.getElementById('frontTag'),
    frontCat: document.getElementById('frontCat'),
    frontPrompt: document.getElementById('frontPrompt'),
    backTag: document.getElementById('backTag'),
    backContent: document.getElementById('backContent'),
    backStatusDot: document.getElementById('backStatusDot'),
    progressFill: document.getElementById('progressFill'),
    progressLabel: document.getElementById('progressLabel'),
    studyView: document.getElementById('studyView'),
    gridView: document.getElementById('gridView'),
    gridCards: document.getElementById('gridCards'),
    gridEmpty: document.getElementById('gridEmpty'),
    btnPrev: document.getElementById('btnPrev'),
    btnNext: document.getElementById('btnNext'),
    btnFlip: document.getElementById('btnFlip'),
    btnShuffle: document.getElementById('btnShuffle'),
    shuffleChip: document.getElementById('shuffleChip'),
    resetOrderChip: document.getElementById('resetOrderChip'),
    btnReview: document.getElementById('btnReview'),
    btnMastered: document.getElementById('btnMastered'),
    studyNav: document.getElementById('studyNav'),
    cntAll: document.getElementById('cnt-all'),
    cntReview: document.getElementById('cnt-review'),
    cntMastered: document.getElementById('cnt-mastered'),
    typeRow: document.getElementById('typeRow'),
    topicSelect: document.getElementById('topicSelect'),
    streakChip: document.getElementById('streakChip'),
    streakCount: document.getElementById('streakCount'),
    masteryFill: document.getElementById('masteryFill'),
    masteryLabel: document.getElementById('masteryLabel'),
    levelBadge: document.getElementById('levelBadge'),
    toastStack: document.getElementById('toastStack'),
    burstLayer: document.getElementById('burstLayer')
  };

  var tagClass = { board:'board', cuet:'cuet', pitfall:'pitfall', worked:'worked' };

  function passesFilters(id){
    var c = CARDS[id];
    if(filter === 'mastered' && status[id] !== 'mastered') return false;
    if(filter === 'review' && status[id] !== 'review') return false;
    if(typeFilter !== 'all' && c.tag !== typeFilter) return false;
    if(topicFilter !== 'all' && c.cat !== topicFilter) return false;
    return true;
  }

  function visibleIds(){
    return order.filter(passesFilters);
  }

  function typeset(){
    if(window.MathJax && window.MathJax.typesetPromise){
      window.MathJax.typesetPromise();
    }
  }

  function renderCounts(){
    var mastered = 0, review = 0;
    var typeCounts = { board:0, cuet:0, pitfall:0, worked:0 };
    CARDS.forEach(function(c){
      if(status[c.id] === 'mastered') mastered++;
      else if(status[c.id] === 'review') review++;
      typeCounts[c.tag]++;
    });
    el.cntAll.textContent = CARDS.length;
    el.cntReview.textContent = review;
    el.cntMastered.textContent = mastered;
    Object.keys(typeCounts).forEach(function(t){
      var node = document.getElementById('cnt-type-' + t);
      if(node) node.textContent = typeCounts[t];
    });
    updateMasteryUI(mastered);
  }

  /* ===================== Gamification: mastery bar, level, streak, toasts ===================== */
  var LEVELS = [
    { min: 0,   cls:'lv-rookie', label:'Rookie' },
    { min: 25,  cls:'lv-solid',  label:'Warming Up' },
    { min: 50,  cls:'lv-sharp',  label:'Sharp' },
    { min: 75,  cls:'lv-ace',    label:'Ace' },
    { min: 100, cls:'lv-ace',    label:'Mastered ⭐' }
  ];
  var lastPct = -1;

  function updateMasteryUI(mastered){
    var total = CARDS.length || 1;
    var pct = Math.round((mastered / total) * 100);
    if(el.masteryFill) el.masteryFill.style.width = pct + '%';
    if(el.masteryLabel) el.masteryLabel.textContent = mastered + ' / ' + CARDS.length + ' mastered';
    if(el.levelBadge){
      var lvl = LEVELS[0];
      LEVELS.forEach(function(l){ if(pct >= l.min) lvl = l; });
      el.levelBadge.textContent = lvl.label;
      el.levelBadge.className = 'level-badge ' + lvl.cls;
    }
    checkMilestones(pct, mastered, total);
    lastPct = pct;
  }

  function checkMilestones(pct, mastered, total){
    if(lastPct < 0) return; // don't toast on initial load
    [25, 50, 75].forEach(function(m){
      if(pct >= m && lastPct < m && !shownMilestones['pct'+m]){
        shownMilestones['pct'+m] = true;
        showToast('💪 ' + m + '% of the chapter mastered — keep going!');
      }
    });
    if(mastered === total && total > 0 && lastPct < 100 && !shownMilestones.complete){
      shownMilestones.complete = true;
      showToast('🏆 Deck cleared! Every card in this chapter is mastered.');
      spawnBurst();
    }
  }

  function updateStreakUI(){
    if(!el.streakChip) return;
    el.streakCount.textContent = streak;
    el.streakChip.classList.toggle('hot', streak >= 3);
    if(streak > 0 && streak % 5 === 0 && !shownMilestones['streak'+streak]){
      shownMilestones['streak'+streak] = true;
      showToast('🔥 ' + streak + ' in a row! You\'re on fire.');
    }
  }

  function showToast(text){
    if(!el.toastStack) return;
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    el.toastStack.appendChild(t);
    setTimeout(function(){
      t.classList.add('leaving');
      setTimeout(function(){ t.remove(); }, 320);
    }, 2600);
  }

  function spawnBurst(){
    if(!el.burstLayer) return;
    var colors = ['var(--teal)', 'var(--amber)', 'var(--violet)', 'var(--success)'];
    for(var i = 0; i < 26; i++){
      var p = document.createElement('div');
      p.className = 'burst-piece';
      var angle = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 160;
      p.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist - 40) + 'px');
      p.style.setProperty('--rot', (Math.random()*520 - 260) + 'deg');
      p.style.background = colors[i % colors.length];
      p.style.borderRadius = (i % 3 === 0) ? '50%' : '2px';
      p.style.left = (45 + Math.random()*10) + '%';
      p.style.top = '38%';
      el.burstLayer.appendChild(p);
      (function(node){ setTimeout(function(){ node.remove(); }, 950); })(p);
    }
  }

  function initTopicSelect(){
    CATEGORIES.forEach(function(cat){
      var count = CARDS.filter(function(c){ return c.cat === cat; }).length;
      var opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat + ' (' + count + ')';
      el.topicSelect.appendChild(opt);
    });
  }
  initTopicSelect();

  function clampPos(){
    var ids = visibleIds();
    if(ids.length === 0){ curPos = 0; return; }
    if(curPos >= ids.length) curPos = ids.length - 1;
    if(curPos < 0) curPos = 0;
  }

  function renderStudy(){
    var ids = visibleIds();
    clampPos();
    if(ids.length === 0){
      el.frontPrompt.textContent = 'No cards in this filter yet.';
      el.frontTag.textContent = '—';
      el.frontCat.textContent = '';
      el.backContent.textContent = 'Switch filters above to keep studying.';
      el.progressLabel.textContent = '0 of 0';
      el.progressFill.style.width = '0%';
      return;
    }
    var id = ids[curPos];
    var c = CARDS[id];
    flipped = false;
    el.card.classList.remove('flipped');

    el.frontTag.textContent = c.tagLabel;
    el.frontTag.className = 'tag ' + tagClass[c.tag];
    el.frontCat.textContent = c.cat;
    el.frontPrompt.innerHTML = c.front;

    el.backTag.textContent = c.tagLabel;
    el.backTag.className = 'tag ' + tagClass[c.tag];
    el.backContent.innerHTML = c.back;

    var st = status[c.id];
    el.backStatusDot.className = 'status-dot' + (st ? ' ' + st : '');
    el.btnReview.classList.toggle('active', st === 'review');
    el.btnMastered.classList.toggle('active', st === 'mastered');

    el.progressLabel.textContent = 'Card ' + (curPos+1) + ' of ' + ids.length;
    el.progressFill.style.width = (((curPos+1)/ids.length)*100) + '%';

    typeset();
  }

  function renderGrid(){
    // Group by topic category (in the chapter's natural order), independent of shuffle,
    // so the Reference Grid always reads as a structured revision map.
    var visible = {};
    visibleIds().forEach(function(id){ visible[id] = true; });

    el.gridCards.innerHTML = '';
    var shown = 0;

    CATEGORIES.forEach(function(cat){
      var catIds = CARDS.filter(function(c){ return c.cat === cat && visible[c.id]; }).map(function(c){ return c.id; });
      if(catIds.length === 0) return;

      var header = document.createElement('div');
      header.className = 'grid-section-header';
      header.innerHTML = '<h2>' + cat + '</h2><span class="n">' + catIds.length + ' card' + (catIds.length === 1 ? '' : 's') + '</span>';
      el.gridCards.appendChild(header);

      catIds.forEach(function(id){
        shown++;
        var c = CARDS[id];
        var st = status[c.id];
        var wrap = document.createElement('div');
        wrap.className = 'mini-card';
        wrap.innerHTML =
          '<div class="mini-status ' + (st||'') + '"></div>' +
          '<div class="mini-idx">#' + (id+1) + '</div>' +
          '<span class="tag ' + tagClass[c.tag] + '">' + c.tagLabel + '</span>' +
          '<div class="mini-front">' + c.front + '</div>' +
          '<div class="mini-back">' + c.back + '</div>' +
          '<div class="mini-flip-note">TAP TO FLIP</div>';
        wrap.addEventListener('click', function(){
          wrap.classList.toggle('flipped');
          typeset();
        });
        el.gridCards.appendChild(wrap);
      });
    });

    el.gridEmpty.style.display = shown ? 'none' : 'block';
    typeset();
  }

  function render(){
    renderCounts();
    if(mode === 'study') renderStudy();
    else renderGrid();
  }

  /* ===================== Interactions ===================== */
  el.card.addEventListener('click', function(){
    flipped = !flipped;
    el.card.classList.toggle('flipped', flipped);
  });
  el.btnFlip.addEventListener('click', function(e){
    e.stopPropagation();
    flipped = !flipped;
    el.card.classList.toggle('flipped', flipped);
  });

  function go(delta){
    var ids = visibleIds();
    if(ids.length === 0) return;
    curPos = (curPos + delta + ids.length) % ids.length;
    renderStudy();
  }
  el.btnPrev.addEventListener('click', function(){ go(-1); });
  el.btnNext.addEventListener('click', function(){ go(1); });

  function shuffle(){
    var arr = order.slice();
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    order = arr;
    isShuffled = true;
    curPos = 0;
    el.resetOrderChip.style.display = 'inline-flex';
    render();
  }
  el.btnShuffle.addEventListener('click', shuffle);
  el.shuffleChip.addEventListener('click', shuffle);
  el.resetOrderChip.addEventListener('click', function(){
    order = CARDS.map(function(c){ return c.id; });
    isShuffled = false;
    curPos = 0;
    el.resetOrderChip.style.display = 'none';
    render();
  });

  function setStatusFor(id, value){
    var prev = status[id];
    if(prev === value){
      delete status[id];
      if(value === 'mastered'){ streak = Math.max(0, streak - 1); }
    } else {
      status[id] = value;
      if(value === 'mastered'){ streak++; }
      else { streak = 0; }
    }
    saveStatus();
    saveStreak();
    updateStreakUI();
    render();
  }
  el.btnReview.addEventListener('click', function(e){
    e.stopPropagation();
    var ids = visibleIds();
    if(!ids.length) return;
    setStatusFor(ids[curPos], 'review');
  });
  el.btnMastered.addEventListener('click', function(e){
    e.stopPropagation();
    var ids = visibleIds();
    if(!ids.length) return;
    setStatusFor(ids[curPos], 'mastered');
  });

  document.querySelectorAll('.mode-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.mode-tab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.getAttribute('data-mode');
      el.studyView.style.display = mode === 'study' ? 'flex' : 'none';
      el.gridView.style.display = mode === 'grid' ? 'block' : 'none';
      el.studyNav.style.display = mode === 'study' ? 'flex' : 'none';
      render();
    });
  });

  document.querySelectorAll('.chip[data-filter]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.chip[data-filter]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      filter = btn.getAttribute('data-filter');
      curPos = 0;
      render();
    });
  });

  document.querySelectorAll('.type-chip').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.type-chip').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      typeFilter = btn.getAttribute('data-type');
      curPos = 0;
      render();
    });
  });

  el.topicSelect.addEventListener('change', function(){
    topicFilter = el.topicSelect.value;
    curPos = 0;
    render();
  });

  document.addEventListener('keydown', function(e){
    if(mode !== 'study') return;
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      flipped = !flipped;
      el.card.classList.toggle('flipped', flipped);
    } else if(e.code === 'ArrowLeft'){
      e.preventDefault(); go(-1);
    } else if(e.code === 'ArrowRight'){
      e.preventDefault(); go(1);
    } else if(e.key === 'r' || e.key === 'R'){
      e.preventDefault(); shuffle();
    }
  });

  updateStreakUI();
  render();
})();
</script>
</body>
</html>
