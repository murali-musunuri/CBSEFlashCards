<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Probability Distributions — Flashcards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" id="MathJax-script" async></script>

<style>
  :root{
    /* ---- Light theme (default tokens) ---- */
    --bg:#f5f7fc;
    --bg-2:#eaeef8;
    --grid-line: rgba(40,55,100,0.055);
    --grid-line-strong: rgba(40,55,100,0.09);
    --surface: rgba(255,255,255,0.62);
    --surface-hi: rgba(255,255,255,0.86);
    --surface-border: rgba(30,40,80,0.10);
    --surface-border-hi: rgba(30,40,80,0.18);
    --text: #171c2c;
    --text-dim: #454f68;
    --text-mute: #7a8298;
    --teal:#0d9488;
    --teal-solid-ink:#052620;
    --teal-dim: rgba(13,148,136,0.12);
    --amber:#a4650a;
    --amber-dim: rgba(164,101,10,0.12);
    --violet:#6d5bd0;
    --violet-dim: rgba(109,91,208,0.12);
    --success:#0f8a5f;
    --success-dim: rgba(15,138,95,0.12);
    --danger:#c33a5d;
    --danger-dim: rgba(195,58,93,0.12);
    --shadow-lg: 0 30px 60px -25px rgba(30,40,80,0.28);
    --shadow-md: 0 12px 28px -12px rgba(30,40,80,0.30);
    --radius: 20px;
    --nav-bg: rgba(255,255,255,0.80);
    color-scheme: light;
  }

  /* ---- Dark theme: OS preference (only when no explicit light choice) ---- */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0e17;
      --bg-2:#0d1220;
      --grid-line: rgba(150,175,255,0.05);
      --grid-line-strong: rgba(150,175,255,0.09);
      --surface: rgba(255,255,255,0.055);
      --surface-hi: rgba(255,255,255,0.09);
      --surface-border: rgba(255,255,255,0.10);
      --surface-border-hi: rgba(255,255,255,0.18);
      --text: #eaf0fa;
      --text-dim: #aab2c5;
      --text-mute: #737d94;
      --teal:#2fe0c4;
      --teal-solid-ink:#052620;
      --teal-dim: rgba(47,224,196,0.16);
      --amber:#f6b93b;
      --amber-dim: rgba(246,185,59,0.12);
      --violet:#9d8cf9;
      --violet-dim: rgba(157,140,249,0.14);
      --success:#34d399;
      --success-dim: rgba(52,211,153,0.16);
      --danger:#fb7185;
      --danger-dim: rgba(251,113,133,0.16);
      --shadow-lg: 0 30px 60px -20px rgba(0,0,0,0.6);
      --shadow-md: 0 12px 30px -10px rgba(0,0,0,0.55);
      --nav-bg: rgba(15,19,30,0.82);
      color-scheme: dark;
    }
  }

  /* ---- Dark theme: explicit toggle (wins either way) ---- */
  :root[data-theme="dark"]{
    --bg:#0a0e17;
    --bg-2:#0d1220;
    --grid-line: rgba(150,175,255,0.05);
    --grid-line-strong: rgba(150,175,255,0.09);
    --surface: rgba(255,255,255,0.055);
    --surface-hi: rgba(255,255,255,0.09);
    --surface-border: rgba(255,255,255,0.10);
    --surface-border-hi: rgba(255,255,255,0.18);
    --text: #eaf0fa;
    --text-dim: #aab2c5;
    --text-mute: #737d94;
    --teal:#2fe0c4;
    --teal-solid-ink:#052620;
    --teal-dim: rgba(47,224,196,0.16);
    --amber:#f6b93b;
    --amber-dim: rgba(246,185,59,0.12);
    --violet:#9d8cf9;
    --violet-dim: rgba(157,140,249,0.14);
    --success:#34d399;
    --success-dim: rgba(52,211,153,0.16);
    --danger:#fb7185;
    --danger-dim: rgba(251,113,133,0.16);
    --shadow-lg: 0 30px 60px -20px rgba(0,0,0,0.6);
    --shadow-md: 0 12px 30px -10px rgba(0,0,0,0.55);
    --nav-bg: rgba(15,19,30,0.82);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color:var(--text);
    font-family:'Manrope', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      radial-gradient(1100px 700px at 15% -10%, var(--violet-dim), transparent 60%),
      radial-gradient(900px 600px at 100% 10%, var(--teal-dim), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-size: 34px 34px, 34px 34px, auto, auto, auto;
    background-attachment: fixed;
    overflow-x:hidden;
    animation: ambient-drift 22s ease-in-out infinite;
  }
  @keyframes ambient-drift{
    0%,100%{ background-position: 0 0, 0 0, 15% -10%, 100% 10%, 0 0; }
    50%{ background-position: 6px 6px, 6px 6px, 19% -6%, 95% 14%, 0 0; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  ::selection{ background:var(--teal-dim); color:var(--text); }

  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  .display{ font-family:'Manrope', ui-sans-serif, sans-serif; font-weight:800; }

  a{ color:var(--teal); }

  /* ---------- App shell ---------- */
  .app{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom: 128px; /* room for fixed nav */
  }

  header.top{
    position:sticky; top:0; z-index:40;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    background: var(--nav-bg);
    border-bottom:1px solid var(--surface-border);
  }
  .top-inner{
    max-width: 980px; margin:0 auto;
    padding: 14px 18px 12px;
  }
  .brand-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px; min-width:0;
  }
  .brand-mark{
    flex:none; width:34px; height:34px; border-radius:10px;
    background: linear-gradient(135deg, var(--teal), var(--violet));
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-weight:600; color:var(--teal-solid-ink); font-size:13px;
    box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--teal) 55%, transparent);
  }
  .brand-text h1{
    font-family:'Manrope'; font-weight:800; font-size:15.5px; margin:0; letter-spacing:0.1px; line-height:1.25;
  }
  .brand-text p{
    margin:1px 0 0; font-size:11.5px; color:var(--text-mute); font-family:'IBM Plex Mono'; letter-spacing:0.3px;
  }

  .mode-tabs{
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--surface-border);
    padding:4px; border-radius:12px; flex:none;
  }
  .mode-tab{
    appearance:none; border:none; cursor:pointer; background:transparent; color:var(--text-dim);
    font-family:'Manrope'; font-weight:700; font-size:12.5px; padding:7px 13px; border-radius:9px;
    transition: all .18s ease;
  }
  .mode-tab.active{
    background: var(--teal); color:var(--teal-solid-ink);
    box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--teal) 50%, transparent);
  }
  .mode-tab:not(.active):hover{ color:var(--text); background:var(--surface-hi); }

  .header-controls{ display:flex; align-items:center; gap:8px; flex:none; }
  .theme-toggle{
    appearance:none; cursor:pointer; width:38px; height:38px; border-radius:12px; flex:none;
    background:var(--surface); border:1px solid var(--surface-border); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; transition:.15s ease;
  }
  .theme-toggle:hover{ color:var(--text); background:var(--surface-hi); border-color:var(--surface-border-hi); }
  .theme-toggle svg{ width:17px; height:17px; display:none; }
  .theme-toggle[data-theme-state="light"] .icon-sun{ display:block; }
  .theme-toggle[data-theme-state="dark"] .icon-moon{ display:block; }
  .theme-toggle[data-theme-state="system"] .icon-auto{ display:block; }

  .progress-row{
    margin-top:12px; display:flex; align-items:center; gap:10px;
  }
  .progress-track{
    flex:1; height:6px; border-radius:99px; background:var(--surface); overflow:hidden; border:1px solid var(--surface-border);
  }
  .progress-fill{
    height:100%; border-radius:99px;
    background: linear-gradient(90deg, var(--violet), var(--teal));
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{
    font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-mute); white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }

  .settings-panel{ display:none; }
  .settings-panel.open{ display:block; }
  .settings-btn svg{ display:block !important; }
  .theme-toggle.active{ color:var(--teal); background:var(--teal-dim); border-color: color-mix(in srgb, var(--teal) 45%, transparent); }
  .filter-row{
    margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  }
  .chip{
    appearance:none; cursor:pointer; font-family:'IBM Plex Mono'; font-size:11px; font-weight:500;
    padding:5px 11px; border-radius:99px; border:1px solid var(--surface-border); background:var(--surface);
    color:var(--text-dim); transition:.15s ease; letter-spacing:.2px;
  }
  .chip:hover{ border-color:var(--surface-border-hi); color:var(--text); }
  .chip.active{ background:var(--teal-dim); border-color:color-mix(in srgb, var(--teal) 50%, transparent); color:var(--teal); }
  .chip .n{ opacity:.65; margin-left:4px; }

  /* ---------- Gamification: streak / mastery / level ---------- */
  .stats-row{
    margin-top:9px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .streak-chip{
    display:inline-flex; align-items:center; gap:5px; flex:none;
    font-family:'IBM Plex Mono'; font-size:11.5px; font-weight:600; color:var(--text-dim);
    background:var(--surface); border:1px solid var(--surface-border); padding:5px 10px 5px 8px; border-radius:99px;
    transition: all .2s ease;
  }
  .streak-chip.hot{ color:var(--amber); background:var(--amber-dim); border-color:color-mix(in srgb, var(--amber) 45%, transparent); }
  .streak-flame{ font-size:13px; filter:grayscale(1) opacity(0.55); transition:filter .25s ease, transform .25s ease; }
  .streak-chip.hot .streak-flame{ filter:none; animation: flame-pulse 1.1s ease-in-out infinite; }
  @keyframes flame-pulse{ 0%,100%{ transform:scale(1) rotate(-2deg); } 50%{ transform:scale(1.18) rotate(2deg); } }

  .mastery-track{
    flex:1; min-width:90px; height:6px; border-radius:99px; background:var(--surface); overflow:hidden; border:1px solid var(--surface-border);
  }
  .mastery-fill{
    height:100%; border-radius:99px; background: linear-gradient(90deg, var(--success), var(--teal));
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }
  .mastery-label{
    font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-mute); white-space:nowrap; font-variant-numeric: tabular-nums;
  }
  .level-badge{
    flex:none; font-family:'Manrope'; font-weight:800; font-size:11px; letter-spacing:.3px; text-transform:uppercase;
    padding:5px 11px; border-radius:99px; color:var(--teal-solid-ink); background:var(--surface-border-hi);
    transition: background .3s ease, color .3s ease;
  }
  .level-badge.lv-rookie{ background:var(--surface-hi); color:var(--text-dim); }
  .level-badge.lv-solid{ background:var(--teal-dim); color:var(--teal); }
  .level-badge.lv-sharp{ background:var(--violet-dim); color:var(--violet); }
  .level-badge.lv-ace{ background: linear-gradient(120deg, var(--amber), var(--teal)); color:var(--teal-solid-ink); }

  /* ---------- Toasts & celebration burst ---------- */
  .toast-stack{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:80;
    display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;
  }
  .toast{
    font-family:'Manrope'; font-weight:700; font-size:13px; color:var(--text);
    background:var(--surface-hi); border:1px solid var(--surface-border-hi); backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    padding:10px 18px; border-radius:14px; box-shadow: var(--shadow-md);
    animation: toast-in .35s cubic-bezier(.22,1,.36,1) both;
    display:flex; align-items:center; gap:8px;
  }
  .toast.leaving{ animation: toast-out .3s ease both; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(-14px) scale(.92); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes toast-out{ to{ opacity:0; transform:translateY(-10px) scale(.94); } }

  .burst-layer{ position:fixed; inset:0; pointer-events:none; z-index:75; overflow:hidden; }
  .burst-piece{
    position:absolute; top:50%; left:50%; width:8px; height:8px; border-radius:2px;
    animation: burst-fly 900ms cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes burst-fly{
    0%{ transform: translate(-50%,-50%) rotate(0deg) scale(1); opacity:1; }
    100%{ transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(.4); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .streak-chip.hot .streak-flame{ animation:none; }
    .burst-piece{ animation:none; display:none; }
  }

  .group-row{
    margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between;
    padding-top:8px; border-top:1px dashed var(--surface-border);
  }
  .type-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .type-chip.active[data-type="board"]{ background:var(--amber-dim); border-color:color-mix(in srgb, var(--amber) 50%, transparent); color:var(--amber); }
  .type-chip.active[data-type="cuet"]{ background:var(--violet-dim); border-color:color-mix(in srgb, var(--violet) 50%, transparent); color:var(--violet); }
  .type-chip.active[data-type="pitfall"]{ background:var(--danger-dim); border-color:color-mix(in srgb, var(--danger) 50%, transparent); color:var(--danger); }
  .type-chip.active[data-type="worked"]{ background:var(--teal-dim); border-color:color-mix(in srgb, var(--teal) 50%, transparent); color:var(--teal); }
  .type-chip.active[data-type="all"]{ background:var(--surface-hi); border-color:var(--surface-border-hi); color:var(--text); }

  .topic-select{
    appearance:none; cursor:pointer; font-family:'IBM Plex Mono'; font-size:11px; font-weight:500;
    padding:6px 30px 6px 12px; border-radius:99px; border:1px solid var(--surface-border); background:var(--surface);
    color:var(--text-dim); letter-spacing:.2px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position: right 9px center; background-size:13px;
  }
  .topic-select:hover{ border-color:var(--surface-border-hi); color:var(--text); }
  .topic-select:focus-visible{ outline:2px solid var(--teal); outline-offset:1px; }

  .grid-section-header{
    grid-column: 1 / -1;
    display:flex; align-items:baseline; gap:10px;
    margin: 6px 0 -2px; padding-bottom:8px; border-bottom:1px solid var(--surface-border);
  }
  .grid-section-header:first-child{ margin-top:0; }
  .grid-section-header h2{
    font-family:'Manrope'; font-weight:800; font-size:14px; margin:0; color:var(--text);
  }
  .grid-section-header .n{
    font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-mute);
  }

  /* ---------- Study stage ---------- */
  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding: 26px 16px 10px;
  }
  .card-wrap{
    width:100%; max-width:640px;
    perspective: 1800px;
  }
  .card{
    position:relative; width:100%; min-height: clamp(300px, 48vh, 420px);
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.22,1,.36,1);
    cursor:pointer;
  }
  .card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    border-radius: var(--radius);
    background: linear-gradient(160deg, var(--surface-hi), var(--surface));
    border:1px solid var(--surface-border);
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backface-visibility:hidden;
    display:flex; flex-direction:column;
    padding: 26px 26px 20px;
    overflow:hidden;
  }
  .face::before{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }
  .face.back{ transform: rotateY(180deg); }

  .face-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:600; letter-spacing:.4px; text-transform:uppercase;
    padding:6px 10px; border-radius:8px; border:1px solid;
  }
  .tag.board{ color:var(--amber); border-color:color-mix(in srgb, var(--amber) 40%, transparent); background:var(--amber-dim); }
  .tag.cuet{ color:var(--violet); border-color:color-mix(in srgb, var(--violet) 45%, transparent); background:var(--violet-dim); }
  .tag.pitfall{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, transparent); background:var(--danger-dim); }
  .tag.worked{ color:var(--teal); border-color:color-mix(in srgb, var(--teal) 40%, transparent); background:var(--teal-dim); }

  .cat-pill{
    font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-mute); white-space:nowrap; padding-top:8px;
  }

  .face-body{
    flex:1; display:flex; align-items:center; margin-top:14px; overflow-y:auto; padding-right:2px;
  }
  .front-prompt{
    font-family:'Manrope'; font-weight:800; font-size: clamp(17px, 3.4vw, 23px); line-height:1.38; letter-spacing:0.1px;
  }
  .back-content{
    font-size:15px; line-height:1.62; color:var(--text-dim);
  }
  .back-content b, .back-content strong{ color:var(--text); }
  .back-content mjx-container{ color:var(--text) !important; }

  .flip-hint{
    text-align:center; font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-mute);
    letter-spacing:.4px; margin-top:10px;
  }

  .assess-row{
    display:flex; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--surface-border);
  }
  .assess-btn{
    flex:1; appearance:none; cursor:pointer; border-radius:12px; padding:11px 10px; font-family:'Manrope';
    font-weight:700; font-size:13px; border:1px solid var(--surface-border); background:var(--surface);
    color:var(--text-dim); display:flex; align-items:center; justify-content:center; gap:7px; transition:.15s ease;
  }
  .assess-btn:hover{ transform: translateY(-1px); }
  .assess-btn:active, .nav-btn:active, .chip:active, .mode-tab:active, .theme-toggle:active{ transform: scale(0.94); }
  .assess-btn.review{ }
  .assess-btn.review:hover, .assess-btn.review.active{ background:var(--danger-dim); border-color:color-mix(in srgb, var(--danger) 50%, transparent); color:var(--danger); }
  .assess-btn.mastered:hover, .assess-btn.mastered.active{ background:var(--success-dim); border-color:color-mix(in srgb, var(--success) 50%, transparent); color:var(--success); }

  .status-dot{
    position:absolute; top:14px; right:14px; width:9px; height:9px; border-radius:50%;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
  }
  .status-dot.mastered{ background:var(--success); }
  .status-dot.review{ background:var(--danger); }

  /* ---------- Bottom nav ---------- */
  nav.bottom{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:center;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .nav-cluster{
    pointer-events:auto;
    display:flex; align-items:center; gap:6px;
    background: var(--nav-bg);
    border:1px solid var(--surface-border-hi);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-radius: 20px;
    padding:8px; box-shadow: var(--shadow-md);
  }
  .nav-btn{
    appearance:none; cursor:pointer; border:none; background:transparent; color:var(--text-dim);
    width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    transition:.15s ease; flex:none;
  }
  .nav-btn:hover{ background:var(--surface-hi); color:var(--text); }
  .nav-btn svg{ width:19px; height:19px; }
  .nav-btn.primary{
    width:auto; padding:0 22px; height:48px; border-radius:15px; gap:8px;
    background: var(--teal); color:var(--teal-solid-ink); font-weight:800;
    font-family:'Manrope'; font-size:13.5px;
    box-shadow: 0 10px 22px -8px color-mix(in srgb, var(--teal) 55%, transparent);
  }
  .nav-btn.primary:hover{ filter:brightness(1.06); }
  .nav-sep{ width:1px; height:26px; background:var(--surface-border); margin:0 2px; }

  /* ---------- Grid mode ---------- */
  .grid-view{ max-width:1180px; margin:0 auto; padding: 22px 16px 10px; width:100%; }
  .grid-cards{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:14px;
  }
  .mini-card{
    position:relative; min-height:190px; border-radius:16px;
    background: linear-gradient(160deg, var(--surface-hi), var(--surface));
    border:1px solid var(--surface-border);
    padding:16px; cursor:pointer; display:flex; flex-direction:column;
    transition: transform .18s ease, border-color .18s ease;
  }
  .mini-card:hover{ transform: translateY(-2px); border-color:var(--surface-border-hi); }
  .mini-card .tag{ font-size:9px; padding:4px 8px; align-self:flex-start; }
  .mini-card .mini-idx{ position:absolute; top:14px; right:14px; font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-mute); }
  .mini-front{ font-family:'Manrope'; font-weight:800; font-size:14px; line-height:1.4; margin-top:10px; flex:1; }
  .mini-back{ font-size:12.5px; line-height:1.55; color:var(--text-dim); margin-top:10px; display:none; flex:1; overflow-y:auto; max-height:220px; }
  .mini-card.flipped .mini-front{ display:none; }
  .mini-card.flipped .mini-back{ display:block; }
  .mini-flip-note{ font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--text-mute); margin-top:10px; }
  .mini-status{ position:absolute; top:14px; left:14px; width:8px; height:8px; border-radius:50%; }
  .mini-status.mastered{ background:var(--success); }
  .mini-status.review{ background:var(--danger); }

  .empty-state{
    text-align:center; padding: 60px 20px; color:var(--text-mute); font-family:'IBM Plex Mono'; font-size:13px;
  }

  /* scrollbars */
  .face-body::-webkit-scrollbar, .mini-back::-webkit-scrollbar{ width:6px; }
  .face-body::-webkit-scrollbar-thumb, .mini-back::-webkit-scrollbar-thumb{ background:var(--surface-border-hi); border-radius:99px; }

  @media (max-width: 560px){
    .card{ min-height: clamp(280px, 46vh, 460px); }
    .face{ padding:20px 18px 16px; }
    nav.bottom{ padding: 12px 10px calc(12px + env(safe-area-inset-bottom)); }
    .nav-cluster{ gap:3px; padding:6px; }
    .nav-btn{ width:40px; height:40px; }
    .nav-btn.primary{ padding:0 16px; height:44px; font-size:12.5px; }
  }
</style>

<script>
(function(){

  /* ===================== CARD DATA ===================== */
  var CARDS = [
    {cat:"Random Variables", tag:"board", tagLabel:"Board Tip", front:"What is a random variable?",
     back:"A variable whose value is a numerical outcome of a random experiment — e.g. the number of heads in 3 coin tosses. Usually denoted $X$."},
    {cat:"Random Variables", tag:"board", tagLabel:"Board Tip", front:"Discrete vs continuous random variable",
     back:"<b>Discrete:</b> takes a countable set of values (0,1,2,\u2026) \u2014 e.g. number of defective items. <b>Continuous:</b> can take any value in an interval \u2014 e.g. height, weight, time."},
    {cat:"Random Variables", tag:"board", tagLabel:"Board Tip", front:"Probability distribution of a discrete random variable",
     back:"A table listing every possible value $x_i$ of $X$ alongside its probability $P(x_i)$. Together, the pairs $(x_i, P(x_i))$ completely describe the random variable's behaviour."},
    {cat:"Random Variables", tag:"board", tagLabel:"Board Tip", front:"Conditions for a valid probability distribution",
     back:"Every $P(x_i)$ must satisfy $0 \\le P(x_i) \\le 1$, and the probabilities across all outcomes must sum to exactly 1: $$\\sum P(x_i) = 1$$"},
    {cat:"Random Variables", tag:"pitfall", tagLabel:"Pitfall", front:"Forgetting to check probabilities sum to 1",
     back:"Before trusting or using a given probability distribution table, always add up the $P(x_i)$ column \u2014 CBSE frequently sets a question where you must first find a missing probability using $\\sum P(x_i)=1$."},
    {cat:"Random Variables", tag:"worked", tagLabel:"Worked Example", front:"Building a probability distribution",
     back:"Toss two fair coins; let $X$=number of heads. $X\\in\\{0,1,2\\}$ with $P(0)=\\tfrac14,\\ P(1)=\\tfrac12,\\ P(2)=\\tfrac14$. Check: $\\tfrac14+\\tfrac12+\\tfrac14=1$. \u2713"},
    {cat:"Mathematical Expectation", tag:"board", tagLabel:"Board Tip", front:"Expected value (mean) of a random variable",
     back:"$$E(X) = \\sum x_i\\,P(x_i)$$ The probability-weighted average of all possible outcomes \u2014 interpreted as the long-run average value of $X$ over many repetitions."},
    {cat:"Mathematical Expectation", tag:"board", tagLabel:"Board Tip", front:"Linearity property of expectation",
     back:"For constants $a,b$: $$E(aX+b) = aE(X)+b$$ Expectation behaves like an ordinary average under scaling and shifting."},
    {cat:"Mathematical Expectation", tag:"worked", tagLabel:"Worked Example", front:"Computing E(X) from a distribution table",
     back:"For $X$: values $1,2,3$ with $P=0.2,0.5,0.3$: $E(X)=1(0.2)+2(0.5)+3(0.3)=0.2+1.0+0.9=2.1$."},
    {cat:"Mathematical Expectation", tag:"board", tagLabel:"Board Tip", front:"Expectation as a fair-game / decision tool",
     back:"In applied contexts, $E(X)$ answers \"what outcome should I expect on average\" \u2014 e.g. expected profit from a lottery ticket, or expected number of defective items in a batch, used to judge whether a game or policy is worthwhile."},
    {cat:"Variance", tag:"board", tagLabel:"Board Tip", front:"Variance of a random variable",
     back:"$$\\text{Var}(X) = E(X^2) - [E(X)]^2$$ where $E(X^2)=\\sum x_i^2\\,P(x_i)$. Variance measures how spread out the values of $X$ are around the mean."},
    {cat:"Variance", tag:"board", tagLabel:"Board Tip", front:"Standard deviation",
     back:"$$\\text{S.D.}(X) = \\sqrt{\\text{Var}(X)}$$ Expressed in the same units as $X$ itself (variance is in squared units), which is why S.D. is usually the more interpretable figure."},
    {cat:"Variance", tag:"worked", tagLabel:"Worked Example", front:"Computing variance from a distribution table",
     back:"Using $X$: values $1,2,3$ with $P=0.2,0.5,0.3$ (so $E(X)=2.1$): $E(X^2)=1(0.2)+4(0.5)+9(0.3)=0.2+2.0+2.7=4.9$. $\\text{Var}(X)=4.9-(2.1)^2=4.9-4.41=0.49$, so S.D. $=0.7$."},
    {cat:"Variance", tag:"board", tagLabel:"Board Tip", front:"Scaling property of variance",
     back:"For constants $a,b$: $$\\text{Var}(aX+b) = a^2\\,\\text{Var}(X)$$ Note the constant shift $b$ disappears entirely — adding a fixed amount to every outcome does not change the spread."},
    {cat:"Binomial Distribution", tag:"board", tagLabel:"Board Tip", front:"Bernoulli trial — definition",
     back:"A single trial with exactly <b>two</b> possible outcomes: \"success\" (probability $p$) and \"failure\" (probability $q=1-p$). A Binomial distribution is built from a fixed number of independent, identical Bernoulli trials."},
    {cat:"Binomial Distribution", tag:"board", tagLabel:"Board Tip", front:"Conditions for a Binomial distribution",
     back:"1) A fixed number of trials $n$.<br>2) Each trial is independent.<br>3) Only two outcomes per trial (success/failure).<br>4) The probability of success $p$ stays constant across all trials."},
    {cat:"Binomial Distribution", tag:"board", tagLabel:"Board Tip", front:"Binomial probability formula",
     back:"$$P(X=r) = {}^{n}C_r\\, p^{r}\\, q^{\\,n-r}, \\qquad r=0,1,\\dots,n$$ where $q=1-p$. $r$ = number of successes out of $n$ trials."},
    {cat:"Binomial Distribution", tag:"board", tagLabel:"Board Tip", front:"Mean and variance of a Binomial distribution",
     back:"Mean $=np$. Variance $=npq$. Standard deviation $=\\sqrt{npq}$ — all three formulas use only $n$, $p$, and $q=1-p$."},
    {cat:"Binomial Distribution", tag:"worked", tagLabel:"Worked Example", front:"Computing a Binomial probability",
     back:"A fair coin is tossed 5 times. Find $P(\\text{exactly 3 heads})$: here $n=5,\\ p=q=0.5$. $P(3)={}^5C_3(0.5)^3(0.5)^2 = 10\\times0.03125=0.3125$."},
    {cat:"Binomial Distribution", tag:"pitfall", tagLabel:"Pitfall", front:"Forgetting $q=1-p$, not $q=p$",
     back:"A very common slip is using $p$ in place of $q$ in the failure-probability slots. Always compute $q=1-p$ explicitly before substituting into the formula, especially when $p\\ne0.5$."},
    {cat:"Binomial Distribution", tag:"cuet", tagLabel:"CUET Shortcut", front:"Spotting a Binomial word problem",
     back:"Keywords like \"fixed number of trials\", \"exactly $r$ successes out of $n$\", \"probability of success is the same each time\" (dice, coins, quality-control sampling with replacement) all signal Binomial."},
    {cat:"Poisson Distribution", tag:"board", tagLabel:"Board Tip", front:"When is Poisson used?",
     back:"For counting the number of rare, independent events occurring in a <b>fixed interval</b> of time or space \u2014 e.g. number of calls received per hour, number of typing errors per page, number of accidents per day."},
    {cat:"Poisson Distribution", tag:"board", tagLabel:"Board Tip", front:"Poisson probability formula",
     back:"$$P(X=x) = \\dfrac{\\lambda^{x}\\,e^{-\\lambda}}{x!}, \\qquad x=0,1,2,\\dots$$ where $\\lambda$ (lambda) is the average (mean) number of occurrences in the given interval."},
    {cat:"Poisson Distribution", tag:"board", tagLabel:"Board Tip", front:"Mean and variance of a Poisson distribution",
     back:"The defining hallmark of the Poisson distribution: $$\\text{Mean} = \\text{Variance} = \\lambda$$ Both equal the single parameter $\\lambda$ — no separate variance formula to memorize."},
    {cat:"Poisson Distribution", tag:"worked", tagLabel:"Worked Example", front:"Computing a Poisson probability",
     back:"A call centre receives on average $\\lambda=4$ calls per minute. Find $P(X=2)$: $$P(2)=\\dfrac{4^2 e^{-4}}{2!} = \\dfrac{16\\times e^{-4}}{2} = 8e^{-4}\\approx0.1465$$"},
    {cat:"Poisson Distribution", tag:"board", tagLabel:"Board Tip", front:"Poisson as an approximation to Binomial",
     back:"When $n$ is large and $p$ is small (rare event) such that $np=\\lambda$ stays moderate, the Binomial distribution can be approximated by a Poisson distribution with the same mean $\\lambda=np$ — useful when $n$ is too large for direct Binomial computation."},
    {cat:"Poisson Distribution", tag:"pitfall", tagLabel:"Pitfall", front:"Mixing up $\\lambda$ with $n$ or $p$",
     back:"$\\lambda$ is the <b>average count</b> over the interval, not the number of trials ($n$) or a probability ($p$) — it can be any positive number, including non-integers (e.g. $\\lambda=2.5$ defects per batch)."},
    {cat:"Normal Distribution", tag:"board", tagLabel:"Board Tip", front:"Normal distribution — key characteristics",
     back:"A <b>continuous</b> probability distribution with a symmetric, bell-shaped curve. Fully described by just two parameters: mean $\\mu$ and standard deviation $\\sigma$."},
    {cat:"Normal Distribution", tag:"board", tagLabel:"Board Tip", front:"Standard normal variate",
     back:"$$Z = \\dfrac{x-\\mu}{\\sigma}$$ Converts any normal variable $x$ into the <b>standard normal</b> form with mean $0$ and standard deviation $1$, letting a single standard normal table serve every normal distribution."},
    {cat:"Normal Distribution", tag:"board", tagLabel:"Board Tip", front:"Symmetry property of the normal curve",
     back:"The curve is perfectly symmetric about $x=\\mu$, so mean = median = mode, and exactly 50% of the total area lies on each side of $\\mu$."},
    {cat:"Normal Distribution", tag:"board", tagLabel:"Board Tip", front:"Empirical rule (68\u201395\u201399.7 rule)",
     back:"For a normal distribution: about <b>68%</b> of values lie within $\\mu\\pm1\\sigma$, about <b>95%</b> within $\\mu\\pm2\\sigma$, and about <b>99.7%</b> within $\\mu\\pm3\\sigma$."},
    {cat:"Normal Distribution", tag:"board", tagLabel:"Board Tip", front:"Total area under the normal curve",
     back:"The total area under any normal curve (standard or not) always equals exactly $1$, since it represents the total probability across all possible outcomes."},
    {cat:"Normal Distribution", tag:"worked", tagLabel:"Worked Example", front:"Converting to a Z-score",
     back:"Test scores are normal with $\\mu=70,\\ \\sigma=10$. Find the Z-score for $x=85$: $$Z=\\dfrac{85-70}{10}=1.5$$ A score of 85 is 1.5 standard deviations above the mean."},
    {cat:"Exam Technique", tag:"cuet", tagLabel:"CUET Shortcut", front:"Which distribution? — recognition table",
     back:"Two outcomes, fixed trials $\\rightarrow$ <b>Binomial</b>. Rare events over an interval, only a mean rate given $\\rightarrow$ <b>Poisson</b>. Continuous measurement, bell curve, mean &amp; SD given $\\rightarrow$ <b>Normal</b>."},
    {cat:"Exam Technique", tag:"pitfall", tagLabel:"Pitfall", front:"Mixing up the mean/variance formulas across the three distributions",
     back:"Binomial: mean $np$, variance $npq$. Poisson: mean = variance $=\\lambda$. Normal: parameters ARE $\\mu$ and $\\sigma$ directly (nothing to derive). Write out which distribution you're using before reaching for a mean/variance formula."},
    {cat:"Exam Technique", tag:"board", tagLabel:"Board Tip", front:"Presentation tip: state the distribution and its conditions first",
     back:"Before computing any probability, write one line identifying which distribution applies and why (e.g. \"fixed $n$, constant $p$, two outcomes $\\Rightarrow$ Binomial\") — CBSE marking schemes award a mark for this identification step, separate from the arithmetic."},
    {cat:"Exam Technique", tag:"board", tagLabel:"Board Tip", front:"Memory hook: expectation and variance are the two universal questions",
     back:"Whichever distribution appears, the exam almost always eventually asks for $E(X)$ (the \"expected/average\" value) and $\\text{Var}(X)$ or S.D. (the \"spread\") — know the two formulas for whichever specific distribution the question names."},
  ];

  CARDS.forEach(function(c, i){ c.id = i; });

  /* ===================== STATE ===================== */
  var status = {};       // id -> 'mastered' | 'review'
  var order = CARDS.map(function(c){ return c.id; });
  var isShuffled = false;
  var curPos = 0;
  var mode = 'study';
  var filter = 'all';
  var typeFilter = 'all';
  var topicFilter = 'all';
  var flipped = false;

  var CATEGORIES = (function(){
    var seen = [], set = {};
    CARDS.forEach(function(c){ if(!set[c.cat]){ set[c.cat] = true; seen.push(c.cat); } });
    return seen;
  })();

  var CHAPTER_ID = 'probability-distributions';
  var STORAGE_KEY = 'flashcards-' + CHAPTER_ID + '-status';
  var STREAK_KEY = 'flashcards-' + CHAPTER_ID + '-streak';
  function loadStatus(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) status = JSON.parse(raw) || {};
    }catch(e){ status = {}; }
  }
  function saveStatus(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(status)); }catch(e){}
  }
  loadStatus();

  var streak = 0;
  try{ streak = parseInt(localStorage.getItem(STREAK_KEY), 10) || 0; }catch(e){ streak = 0; }
  function saveStreak(){ try{ localStorage.setItem(STREAK_KEY, String(streak)); }catch(e){} }
  var shownMilestones = {};

  /* ===================== Theme (Light / Dark / Auto) ===================== */
  var THEME_KEY = 'flashcards-' + CHAPTER_ID + '-theme';
  var THEME_ORDER = ['system', 'light', 'dark'];
  var THEME_TITLE = { system:'Theme: Auto (follows device)', light:'Theme: Light', dark:'Theme: Dark' };
  var themeToggle = document.getElementById('themeToggle');

  function applyTheme(t){
    if(t === 'dark' || t === 'light'){
      document.documentElement.setAttribute('data-theme', t);
    } else {
      document.documentElement.removeAttribute('data-theme');
      t = 'system';
    }
    if(themeToggle){
      themeToggle.setAttribute('data-theme-state', t);
      themeToggle.setAttribute('title', THEME_TITLE[t]);
    }
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  }

  (function initTheme(){
    var saved = 'system';
    try{ saved = localStorage.getItem(THEME_KEY) || 'system'; }catch(e){}
    applyTheme(saved);
  })();

  if(themeToggle){
    themeToggle.addEventListener('click', function(){
      var current = themeToggle.getAttribute('data-theme-state') || 'system';
      var next = THEME_ORDER[(THEME_ORDER.indexOf(current) + 1) % THEME_ORDER.length];
      applyTheme(next);
    });
  }

  /* ===================== DOM refs ===================== */
  var el = {
    card: document.getElementById('card'),
    frontTag: document.getElementById('frontTag'),
    frontCat: document.getElementById('frontCat'),
    frontPrompt: document.getElementById('frontPrompt'),
    backTag: document.getElementById('backTag'),
    backContent: document.getElementById('backContent'),
    backStatusDot: document.getElementById('backStatusDot'),
    progressFill: document.getElementById('progressFill'),
    progressLabel: document.getElementById('progressLabel'),
    studyView: document.getElementById('studyView'),
    gridView: document.getElementById('gridView'),
    gridCards: document.getElementById('gridCards'),
    gridEmpty: document.getElementById('gridEmpty'),
    btnPrev: document.getElementById('btnPrev'),
    btnNext: document.getElementById('btnNext'),
    btnFlip: document.getElementById('btnFlip'),
    btnShuffle: document.getElementById('btnShuffle'),
    shuffleChip: document.getElementById('shuffleChip'),
    resetOrderChip: document.getElementById('resetOrderChip'),
    btnReview: document.getElementById('btnReview'),
    btnMastered: document.getElementById('btnMastered'),
    studyNav: document.getElementById('studyNav'),
    cntAll: document.getElementById('cnt-all'),
    cntReview: document.getElementById('cnt-review'),
    cntMastered: document.getElementById('cnt-mastered'),
    typeRow: document.getElementById('typeRow'),
    topicSelect: document.getElementById('topicSelect'),
    streakChip: document.getElementById('streakChip'),
    streakCount: document.getElementById('streakCount'),
    masteryFill: document.getElementById('masteryFill'),
    masteryLabel: document.getElementById('masteryLabel'),
    levelBadge: document.getElementById('levelBadge'),
    toastStack: document.getElementById('toastStack'),
    burstLayer: document.getElementById('burstLayer')
  };

  var tagClass = { board:'board', cuet:'cuet', pitfall:'pitfall', worked:'worked' };

  function passesFilters(id){
    var c = CARDS[id];
    if(filter === 'mastered' && status[id] !== 'mastered') return false;
    if(filter === 'review' && status[id] !== 'review') return false;
    if(typeFilter !== 'all' && c.tag !== typeFilter) return false;
    if(topicFilter !== 'all' && c.cat !== topicFilter) return false;
    return true;
  }

  function visibleIds(){
    return order.filter(passesFilters);
  }

  function typeset(){
    if(window.MathJax && window.MathJax.typesetPromise){
      window.MathJax.typesetPromise();
    }
  }

  function renderCounts(){
    var mastered = 0, review = 0;
    var typeCounts = { board:0, cuet:0, pitfall:0, worked:0 };
    CARDS.forEach(function(c){
      if(status[c.id] === 'mastered') mastered++;
      else if(status[c.id] === 'review') review++;
      typeCounts[c.tag]++;
    });
    el.cntAll.textContent = CARDS.length;
    el.cntReview.textContent = review;
    el.cntMastered.textContent = mastered;
    Object.keys(typeCounts).forEach(function(t){
      var node = document.getElementById('cnt-type-' + t);
      if(node) node.textContent = typeCounts[t];
    });
    updateMasteryUI(mastered);
  }

  /* ===================== Gamification: mastery bar, level, streak, toasts ===================== */
  var LEVELS = [
    { min: 0,   cls:'lv-rookie', label:'Rookie' },
    { min: 25,  cls:'lv-solid',  label:'Warming Up' },
    { min: 50,  cls:'lv-sharp',  label:'Sharp' },
    { min: 75,  cls:'lv-ace',    label:'Ace' },
    { min: 100, cls:'lv-ace',    label:'Mastered ⭐' }
  ];
  var lastPct = -1;

  function updateMasteryUI(mastered){
    var total = CARDS.length || 1;
    var pct = Math.round((mastered / total) * 100);
    if(el.masteryFill) el.masteryFill.style.width = pct + '%';
    if(el.masteryLabel) el.masteryLabel.textContent = mastered + ' / ' + CARDS.length + ' mastered';
    if(el.levelBadge){
      var lvl = LEVELS[0];
      LEVELS.forEach(function(l){ if(pct >= l.min) lvl = l; });
      el.levelBadge.textContent = lvl.label;
      el.levelBadge.className = 'level-badge ' + lvl.cls;
    }
    checkMilestones(pct, mastered, total);
    lastPct = pct;
  }

  function checkMilestones(pct, mastered, total){
    if(lastPct < 0) return; // don't toast on initial load
    [25, 50, 75].forEach(function(m){
      if(pct >= m && lastPct < m && !shownMilestones['pct'+m]){
        shownMilestones['pct'+m] = true;
        showToast('💪 ' + m + '% of the chapter mastered — keep going!');
      }
    });
    if(mastered === total && total > 0 && lastPct < 100 && !shownMilestones.complete){
      shownMilestones.complete = true;
      showToast('🏆 Deck cleared! Every card in this chapter is mastered.');
      spawnBurst();
    }
  }

  function updateStreakUI(){
    if(!el.streakChip) return;
    el.streakCount.textContent = streak;
    el.streakChip.classList.toggle('hot', streak >= 3);
    if(streak > 0 && streak % 5 === 0 && !shownMilestones['streak'+streak]){
      shownMilestones['streak'+streak] = true;
      showToast('🔥 ' + streak + ' in a row! You\'re on fire.');
    }
  }

  function showToast(text){
    if(!el.toastStack) return;
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    el.toastStack.appendChild(t);
    setTimeout(function(){
      t.classList.add('leaving');
      setTimeout(function(){ t.remove(); }, 320);
    }, 2600);
  }

  function spawnBurst(){
    if(!el.burstLayer) return;
    var colors = ['var(--teal)', 'var(--amber)', 'var(--violet)', 'var(--success)'];
    for(var i = 0; i < 26; i++){
      var p = document.createElement('div');
      p.className = 'burst-piece';
      var angle = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 160;
      p.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist - 40) + 'px');
      p.style.setProperty('--rot', (Math.random()*520 - 260) + 'deg');
      p.style.background = colors[i % colors.length];
      p.style.borderRadius = (i % 3 === 0) ? '50%' : '2px';
      p.style.left = (45 + Math.random()*10) + '%';
      p.style.top = '38%';
      el.burstLayer.appendChild(p);
      (function(node){ setTimeout(function(){ node.remove(); }, 950); })(p);
    }
  }

  function initTopicSelect(){
    CATEGORIES.forEach(function(cat){
      var count = CARDS.filter(function(c){ return c.cat === cat; }).length;
      var opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat + ' (' + count + ')';
      el.topicSelect.appendChild(opt);
    });
  }
  initTopicSelect();

  function clampPos(){
    var ids = visibleIds();
    if(ids.length === 0){ curPos = 0; return; }
    if(curPos >= ids.length) curPos = ids.length - 1;
    if(curPos < 0) curPos = 0;
  }

  function renderStudy(){
    var ids = visibleIds();
    clampPos();
    if(ids.length === 0){
      el.frontPrompt.textContent = 'No cards in this filter yet.';
      el.frontTag.textContent = '—';
      el.frontCat.textContent = '';
      el.backContent.textContent = 'Switch filters above to keep studying.';
      el.progressLabel.textContent = '0 of 0';
      el.progressFill.style.width = '0%';
      return;
    }
    var id = ids[curPos];
    var c = CARDS[id];
    flipped = false;
    el.card.classList.remove('flipped');

    el.frontTag.textContent = c.tagLabel;
    el.frontTag.className = 'tag ' + tagClass[c.tag];
    el.frontCat.textContent = c.cat;
    el.frontPrompt.innerHTML = c.front;

    el.backTag.textContent = c.tagLabel;
    el.backTag.className = 'tag ' + tagClass[c.tag];
    el.backContent.innerHTML = c.back;

    var st = status[c.id];
    el.backStatusDot.className = 'status-dot' + (st ? ' ' + st : '');
    el.btnReview.classList.toggle('active', st === 'review');
    el.btnMastered.classList.toggle('active', st === 'mastered');

    el.progressLabel.textContent = 'Card ' + (curPos+1) + ' of ' + ids.length;
    el.progressFill.style.width = (((curPos+1)/ids.length)*100) + '%';

    typeset();
  }

  function renderGrid(){
    // Group by topic category (in the chapter's natural order), independent of shuffle,
    // so the Reference Grid always reads as a structured revision map.
    var visible = {};
    visibleIds().forEach(function(id){ visible[id] = true; });

    el.gridCards.innerHTML = '';
    var shown = 0;

    CATEGORIES.forEach(function(cat){
      var catIds = CARDS.filter(function(c){ return c.cat === cat && visible[c.id]; }).map(function(c){ return c.id; });
      if(catIds.length === 0) return;

      var header = document.createElement('div');
      header.className = 'grid-section-header';
      header.innerHTML = '<h2>' + cat + '</h2><span class="n">' + catIds.length + ' card' + (catIds.length === 1 ? '' : 's') + '</span>';
      el.gridCards.appendChild(header);

      catIds.forEach(function(id){
        shown++;
        var c = CARDS[id];
        var st = status[c.id];
        var wrap = document.createElement('div');
        wrap.className = 'mini-card';
        wrap.innerHTML =
          '<div class="mini-status ' + (st||'') + '"></div>' +
          '<div class="mini-idx">#' + (id+1) + '</div>' +
          '<span class="tag ' + tagClass[c.tag] + '">' + c.tagLabel + '</span>' +
          '<div class="mini-front">' + c.front + '</div>' +
          '<div class="mini-back">' + c.back + '</div>' +
          '<div class="mini-flip-note">TAP TO FLIP</div>';
        wrap.addEventListener('click', function(){
          wrap.classList.toggle('flipped');
          typeset();
        });
        el.gridCards.appendChild(wrap);
      });
    });

    el.gridEmpty.style.display = shown ? 'none' : 'block';
    typeset();
  }

  function render(){
    renderCounts();
    if(mode === 'study') renderStudy();
    else renderGrid();
  }

  /* ===================== Interactions ===================== */
  el.card.addEventListener('click', function(){
    flipped = !flipped;
    el.card.classList.toggle('flipped', flipped);
  });
  el.btnFlip.addEventListener('click', function(e){
    e.stopPropagation();
    flipped = !flipped;
    el.card.classList.toggle('flipped', flipped);
  });

  function go(delta){
    var ids = visibleIds();
    if(ids.length === 0) return;
    curPos = (curPos + delta + ids.length) % ids.length;
    renderStudy();
  }
  el.btnPrev.addEventListener('click', function(){ go(-1); });
  el.btnNext.addEventListener('click', function(){ go(1); });

  function shuffle(){
    var arr = order.slice();
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    order = arr;
    isShuffled = true;
    curPos = 0;
    el.resetOrderChip.style.display = 'inline-flex';
    render();
  }
  el.btnShuffle.addEventListener('click', shuffle);
  el.shuffleChip.addEventListener('click', shuffle);
  el.resetOrderChip.addEventListener('click', function(){
    order = CARDS.map(function(c){ return c.id; });
    isShuffled = false;
    curPos = 0;
    el.resetOrderChip.style.display = 'none';
    render();
  });

  function setStatusFor(id, value){
    var prev = status[id];
    if(prev === value){
      delete status[id];
      if(value === 'mastered'){ streak = Math.max(0, streak - 1); }
    } else {
      status[id] = value;
      if(value === 'mastered'){ streak++; }
      else { streak = 0; }
    }
    saveStatus();
    saveStreak();
    updateStreakUI();
    render();
  }
  el.btnReview.addEventListener('click', function(e){
    e.stopPropagation();
    var ids = visibleIds();
    if(!ids.length) return;
    setStatusFor(ids[curPos], 'review');
  });
  el.btnMastered.addEventListener('click', function(e){
    e.stopPropagation();
    var ids = visibleIds();
    if(!ids.length) return;
    setStatusFor(ids[curPos], 'mastered');
  });

  document.querySelectorAll('.mode-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.mode-tab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.getAttribute('data-mode');
      el.studyView.style.display = mode === 'study' ? 'flex' : 'none';
      el.gridView.style.display = mode === 'grid' ? 'block' : 'none';
      el.studyNav.style.display = mode === 'study' ? 'flex' : 'none';
      render();
    });
  });

  document.querySelectorAll('.chip[data-filter]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.chip[data-filter]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      filter = btn.getAttribute('data-filter');
      curPos = 0;
      render();
    });
  });

  document.querySelectorAll('.type-chip').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.type-chip').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      typeFilter = btn.getAttribute('data-type');
      curPos = 0;
      render();
    });
  });

  el.topicSelect.addEventListener('change', function(){
    topicFilter = el.topicSelect.value;
    curPos = 0;
    render();
  });

  document.addEventListener('keydown', function(e){
    if(mode !== 'study') return;
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      flipped = !flipped;
      el.card.classList.toggle('flipped', flipped);
    } else if(e.code === 'ArrowLeft'){
      e.preventDefault(); go(-1);
    } else if(e.code === 'ArrowRight'){
      e.preventDefault(); go(1);
    } else if(e.key === 'r' || e.key === 'R'){
      e.preventDefault(); shuffle();
    }
  });

  updateStreakUI();
  render();
})();
</script>
</body>
</html>
