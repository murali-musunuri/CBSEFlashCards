<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Marketing Management — Flashcards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f5f7fc; --bg-2:#eaeef8;
    --grid-line: rgba(40,55,100,0.055);
    --surface: rgba(255,255,255,0.62); --surface-hi: rgba(255,255,255,0.88);
    --surface-border: rgba(30,40,80,0.10); --surface-border-hi: rgba(30,40,80,0.18);
    --text:#171c2c; --text-dim:#454f68; --text-mute:#7a8298;
    --emerald:#0a9668; --emerald-ink:#052617; --emerald-dim: rgba(10,150,104,0.12);
    --cyan:#0891a8; --cyan-dim: rgba(8,145,168,0.12);
    --amber:#a4650a; --amber-dim: rgba(164,101,10,0.12);
    --violet:#6d5bd0; --violet-dim: rgba(109,91,208,0.12);
    --rose:#c33a5d; --rose-dim: rgba(195,58,93,0.12);
    --success:#0f8a5f; --success-dim: rgba(15,138,95,0.12);
    --shadow-lg: 0 30px 60px -25px rgba(30,40,80,0.28);
    --shadow-md: 0 12px 28px -12px rgba(30,40,80,0.30);
    --nav-bg: rgba(255,255,255,0.80);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#080b13; --bg-2:#0b0f1a;
      --grid-line: rgba(150,220,200,0.045);
      --surface: rgba(255,255,255,0.05); --surface-hi: rgba(255,255,255,0.085);
      --surface-border: rgba(255,255,255,0.10); --surface-border-hi: rgba(255,255,255,0.18);
      --text:#eaf5f0; --text-dim:#a8b8c5; --text-mute:#70808f;
      --emerald:#2af0a8; --emerald-ink:#04170f; --emerald-dim: rgba(42,240,168,0.16);
      --cyan:#3fe0f5; --cyan-dim: rgba(63,224,245,0.14);
      --amber:#ffc247; --amber-dim: rgba(255,194,71,0.14);
      --violet:#b3a1ff; --violet-dim: rgba(179,161,255,0.15);
      --rose:#ff8fa3; --rose-dim: rgba(255,143,163,0.15);
      --success:#2af0a8; --success-dim: rgba(42,240,168,0.16);
      --shadow-lg: 0 30px 60px -20px rgba(0,0,0,0.65);
      --shadow-md: 0 12px 30px -10px rgba(0,0,0,0.6);
      --nav-bg: rgba(11,15,23,0.82);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#080b13; --bg-2:#0b0f1a;
    --grid-line: rgba(150,220,200,0.045);
    --surface: rgba(255,255,255,0.05); --surface-hi: rgba(255,255,255,0.085);
    --surface-border: rgba(255,255,255,0.10); --surface-border-hi: rgba(255,255,255,0.18);
    --text:#eaf5f0; --text-dim:#a8b8c5; --text-mute:#70808f;
    --emerald:#2af0a8; --emerald-ink:#04170f; --emerald-dim: rgba(42,240,168,0.16);
    --cyan:#3fe0f5; --cyan-dim: rgba(63,224,245,0.14);
    --amber:#ffc247; --amber-dim: rgba(255,194,71,0.14);
    --violet:#b3a1ff; --violet-dim: rgba(179,161,255,0.15);
    --rose:#ff8fa3; --rose-dim: rgba(255,143,163,0.15);
    --success:#2af0a8; --success-dim: rgba(42,240,168,0.16);
    --shadow-lg: 0 30px 60px -20px rgba(0,0,0,0.65);
    --shadow-md: 0 12px 30px -10px rgba(0,0,0,0.6);
    --nav-bg: rgba(11,15,23,0.82);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); font-family:'Manrope',ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body{
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      radial-gradient(1100px 700px at 15% -10%, var(--emerald-dim), transparent 60%),
      radial-gradient(900px 600px at 100% 10%, var(--cyan-dim), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-size: 34px 34px, 34px 34px, auto, auto, auto;
    background-attachment: fixed; overflow-x:hidden;
    animation: ambient-drift 22s ease-in-out infinite;
  }
  @keyframes ambient-drift{
    0%,100%{ background-position: 0 0, 0 0, 15% -10%, 100% 10%, 0 0; }
    50%{ background-position: 6px 6px, 6px 6px, 19% -6%, 95% 14%, 0 0; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

  ::selection{ background:var(--emerald-dim); color:var(--text); }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  a{ color:var(--emerald); }

  .app{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding-bottom:128px; }

  header.top{
    position:sticky; top:0; z-index:40;
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    background: var(--nav-bg); border-bottom:1px solid var(--surface-border);
  }
  .top-inner{ max-width: 980px; margin:0 auto; padding: 14px 18px 12px; }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark{
    flex:none; width:34px; height:34px; border-radius:10px;
    background: linear-gradient(135deg, var(--emerald), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-weight:600; color:var(--emerald-ink); font-size:13px;
    box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--emerald) 55%, transparent);
  }
  .brand-text h1{ font-family:'Manrope'; font-weight:800; font-size:15.5px; margin:0; letter-spacing:0.1px; line-height:1.25; }
  .brand-text p{ margin:1px 0 0; font-size:11px; color:var(--text-mute); font-family:'IBM Plex Mono'; letter-spacing:0.3px; }

  .header-controls{ display:flex; align-items:center; gap:8px; flex:none; }
  .mode-tabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--surface-border); padding:4px; border-radius:12px; flex:none; }
  .mode-tab{ appearance:none; border:none; cursor:pointer; background:transparent; color:var(--text-dim); font-family:'Manrope'; font-weight:700; font-size:12.5px; padding:7px 13px; border-radius:9px; transition: all .18s ease; }
  .mode-tab.active{ background: var(--emerald); color:var(--emerald-ink); box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--emerald) 50%, transparent); }
  .mode-tab:not(.active):hover{ color:var(--text); background:var(--surface-hi); }
  .theme-toggle{ appearance:none; cursor:pointer; width:38px; height:38px; border-radius:12px; flex:none; background:var(--surface); border:1px solid var(--surface-border); color:var(--text-dim); display:flex; align-items:center; justify-content:center; transition:.15s ease; }
  .theme-toggle:hover{ color:var(--text); background:var(--surface-hi); }
  .theme-toggle svg{ width:17px; height:17px; display:none; }
  .theme-toggle[data-theme-state="light"] .icon-sun{ display:block; }
  .theme-toggle[data-theme-state="dark"] .icon-moon{ display:block; }
  .theme-toggle[data-theme-state="system"] .icon-auto{ display:block; }

  .progress-row{ margin-top:12px; display:flex; align-items:center; gap:10px; }
  .progress-track{ flex:1; height:6px; border-radius:99px; background:var(--surface); overflow:hidden; border:1px solid var(--surface-border); }
  .progress-fill{ height:100%; border-radius:99px; background: linear-gradient(90deg, var(--cyan), var(--emerald)); transition: width .35s cubic-bezier(.4,0,.2,1); }
  .progress-label{ font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-mute); white-space:nowrap; font-variant-numeric: tabular-nums; }

  .stats-row{ margin-top:9px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .streak-chip{ display:inline-flex; align-items:center; gap:5px; flex:none; font-family:'IBM Plex Mono'; font-size:11.5px; font-weight:600; color:var(--text-dim); background:var(--surface); border:1px solid var(--surface-border); padding:5px 10px 5px 8px; border-radius:99px; transition: all .2s ease; }
  .streak-chip.hot{ color:var(--amber); background:var(--amber-dim); border-color:color-mix(in srgb, var(--amber) 45%, transparent); }
  .streak-flame{ font-size:13px; filter:grayscale(1) opacity(0.55); transition:filter .25s ease, transform .25s ease; }
  .streak-chip.hot .streak-flame{ filter:none; animation: flame-pulse 1.1s ease-in-out infinite; }
  @keyframes flame-pulse{ 0%,100%{ transform:scale(1) rotate(-2deg); } 50%{ transform:scale(1.18) rotate(2deg); } }
  .mastery-track{ flex:1; min-width:90px; height:6px; border-radius:99px; background:var(--surface); overflow:hidden; border:1px solid var(--surface-border); }
  .mastery-fill{ height:100%; border-radius:99px; background: linear-gradient(90deg, var(--success), var(--cyan)); transition: width .5s cubic-bezier(.4,0,.2,1); }
  .mastery-label{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-mute); white-space:nowrap; font-variant-numeric: tabular-nums; }
  .level-badge{ flex:none; font-family:'Manrope'; font-weight:800; font-size:11px; letter-spacing:.3px; text-transform:uppercase; padding:5px 11px; border-radius:99px; color:var(--text-dim); background:var(--surface-hi); transition: background .3s ease, color .3s ease; }
  .level-badge.lv-solid{ background:var(--cyan-dim); color:var(--cyan); }
  .level-badge.lv-sharp{ background:var(--violet-dim); color:var(--violet); }
  .level-badge.lv-ace{ background: linear-gradient(120deg, var(--amber), var(--emerald)); color:var(--emerald-ink); }

  /* ---------- Collapsible filter widget ---------- */
  .filters-toggle{
    margin-top:10px; width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    appearance:none; cursor:pointer; background:var(--surface); border:1px solid var(--surface-border);
    color:var(--text-dim); font-family:'Manrope'; font-weight:700; font-size:12.5px; padding:9px 12px; border-radius:12px;
  }
  .filters-toggle:hover{ color:var(--text); background:var(--surface-hi); }
  .filters-toggle .chev{ transition: transform .25s ease; }
  .filters-toggle.open .chev{ transform: rotate(180deg); }
  .filters-toggle .active-count{
    font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--emerald); background:var(--emerald-dim);
    padding:2px 8px; border-radius:99px; margin-left:6px;
  }
  .filters-panel{
    max-height:0; overflow:hidden; transition: max-height .3s cubic-bezier(.4,0,.2,1);
  }
  .filters-panel.open{ max-height:400px; }
  .filters-panel-inner{ padding-top:10px; }

  .filter-row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .chip{ appearance:none; cursor:pointer; font-family:'IBM Plex Mono'; font-size:11px; font-weight:500; padding:5px 11px; border-radius:99px; border:1px solid var(--surface-border); background:var(--surface); color:var(--text-dim); transition:.15s ease; letter-spacing:.2px; }
  .chip:hover{ border-color:var(--surface-border-hi); color:var(--text); }
  .chip.active{ background:var(--emerald-dim); border-color:color-mix(in srgb, var(--emerald) 50%, transparent); color:var(--emerald); }
  .chip .n{ opacity:.65; margin-left:4px; }
  .type-chip.active[data-type="board"]{ background:var(--cyan-dim); border-color:color-mix(in srgb, var(--cyan) 50%, transparent); color:var(--cyan); }
  .type-chip.active[data-type="cuet"]{ background:var(--amber-dim); border-color:color-mix(in srgb, var(--amber) 50%, transparent); color:var(--amber); }
  .type-chip.active[data-type="process"]{ background:var(--emerald-dim); border-color:color-mix(in srgb, var(--emerald) 50%, transparent); color:var(--emerald); }
  .type-chip.active[data-type="pitfall"]{ background:var(--rose-dim); border-color:color-mix(in srgb, var(--rose) 50%, transparent); color:var(--rose); }
  .type-chip.active[data-type="worked"]{ background:var(--violet-dim); border-color:color-mix(in srgb, var(--violet) 50%, transparent); color:var(--violet); }
  .type-chip.active[data-type="all"]{ background:var(--surface-hi); border-color:var(--surface-border-hi); color:var(--text); }
  .topic-select{
    appearance:none; cursor:pointer; font-family:'IBM Plex Mono'; font-size:11px; font-weight:500;
    padding:6px 30px 6px 12px; border-radius:99px; border:1px solid var(--surface-border); background:var(--surface);
    color:var(--text-dim); letter-spacing:.2px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position: right 9px center; background-size:13px; max-width:100%;
  }
  .topic-select:hover{ border-color:var(--surface-border-hi); color:var(--text); }

  /* ---------- Toasts & celebration burst ---------- */
  .toast-stack{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast{ font-family:'Manrope'; font-weight:700; font-size:13px; color:var(--text); background:var(--surface-hi); border:1px solid var(--surface-border-hi); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); padding:10px 18px; border-radius:14px; box-shadow: var(--shadow-md); animation: toast-in .35s cubic-bezier(.22,1,.36,1) both; display:flex; align-items:center; gap:8px; }
  .toast.leaving{ animation: toast-out .3s ease both; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(-14px) scale(.92); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes toast-out{ to{ opacity:0; transform:translateY(-10px) scale(.94); } }
  .burst-layer{ position:fixed; inset:0; pointer-events:none; z-index:75; overflow:hidden; }
  .burst-piece{ position:absolute; top:50%; left:50%; width:8px; height:8px; border-radius:2px; animation: burst-fly 900ms cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes burst-fly{ 0%{ transform: translate(-50%,-50%) rotate(0deg) scale(1); opacity:1; } 100%{ transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(.4); opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .streak-chip.hot .streak-flame{ animation:none; } .burst-piece{ animation:none; display:none; } }

  /* ---------- Study stage ---------- */
  .stage{ flex:1; display:flex; align-items:center; justify-content:center; padding: 26px 16px 10px; }
  .card-wrap{ width:100%; max-width:660px; perspective: 1800px; }
  .card{ position:relative; width:100%; min-height: clamp(300px, 52vh, 460px); transform-style: preserve-3d; transition: transform .55s cubic-bezier(.22,1,.36,1); cursor:pointer; }
  .card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0; border-radius: 20px;
    background: linear-gradient(160deg, var(--surface-hi), var(--surface));
    border:1px solid var(--surface-border); box-shadow: var(--shadow-lg);
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    backface-visibility:hidden; display:flex; flex-direction:column; padding: 24px 24px 18px; overflow:hidden;
  }
  .face::before{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none;
  }
  .face.back{ transform: rotateY(180deg); }
  .face-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .tag{ display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; padding:6px 10px; border-radius:8px; border:1px solid; }
  .tag.board{ color:var(--cyan); border-color:color-mix(in srgb, var(--cyan) 40%, transparent); background:var(--cyan-dim); }
  .tag.cuet{ color:var(--amber); border-color:color-mix(in srgb, var(--amber) 40%, transparent); background:var(--amber-dim); }
  .tag.process{ color:var(--emerald); border-color:color-mix(in srgb, var(--emerald) 40%, transparent); background:var(--emerald-dim); }
  .tag.pitfall{ color:var(--rose); border-color:color-mix(in srgb, var(--rose) 40%, transparent); background:var(--rose-dim); }
  .tag.worked{ color:var(--violet); border-color:color-mix(in srgb, var(--violet) 40%, transparent); background:var(--violet-dim); }
  .cat-pill{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-mute); white-space:nowrap; padding-top:8px; text-align:right; max-width:45%; }

  .face-body{ flex:1; display:flex; align-items:center; margin-top:14px; overflow-y:auto; padding-right:2px; }
  .front-prompt{ font-family:'Manrope'; font-weight:800; font-size: clamp(17px, 3.2vw, 22px); line-height:1.36; letter-spacing:0.1px; }
  .back-content{ font-size:14.5px; line-height:1.6; color:var(--text-dim); width:100%; }
  .back-content b, .back-content strong{ color:var(--text); }
  .back-content .def{ margin:0 0 8px; }
  .back-content ul.pts, .back-content ol.steps{ margin:6px 0 8px; padding-left:20px; }
  .back-content ul.pts li, .back-content ol.steps li{ margin-bottom:5px; }
  .back-content .kw-row{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .back-content .kw{
    font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:600; color:var(--emerald);
    background:var(--emerald-dim); border:1px solid color-mix(in srgb, var(--emerald) 35%, transparent);
    padding:3px 9px; border-radius:99px;
  }
  .back-content .callout{
    margin-top:10px; padding:10px 12px; border-radius:12px; border:1px solid color-mix(in srgb, var(--rose) 35%, transparent);
    background:var(--rose-dim); font-size:13.5px; line-height:1.55;
  }
  .back-content .callout .callout-label{ font-family:'IBM Plex Mono'; font-size:10px; font-weight:700; color:var(--rose); text-transform:uppercase; letter-spacing:.4px; display:block; margin-bottom:4px; }

  .flip-hint{ text-align:center; font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-mute); letter-spacing:.4px; margin-top:10px; }

  .assess-row{ display:flex; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--surface-border); }
  .assess-btn{ flex:1; appearance:none; cursor:pointer; border-radius:12px; padding:11px 10px; font-family:'Manrope'; font-weight:700; font-size:13px; border:1px solid var(--surface-border); background:var(--surface); color:var(--text-dim); display:flex; align-items:center; justify-content:center; gap:7px; transition:.15s ease; }
  .assess-btn:hover{ transform: translateY(-1px); }
  .assess-btn:active, .nav-btn:active, .chip:active, .mode-tab:active, .theme-toggle:active, .filters-toggle:active{ transform: scale(0.94); }
  .assess-btn.review:hover, .assess-btn.review.active{ background:var(--rose-dim); border-color:color-mix(in srgb, var(--rose) 50%, transparent); color:var(--rose); }
  .assess-btn.mastered:hover, .assess-btn.mastered.active{ background:var(--success-dim); border-color:color-mix(in srgb, var(--success) 50%, transparent); color:var(--success); }

  .status-dot{ position:absolute; top:14px; right:14px; width:9px; height:9px; border-radius:50%; box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }
  .status-dot.mastered{ background:var(--success); }
  .status-dot.review{ background:var(--rose); }

  /* ---------- Bottom nav ---------- */
  nav.bottom{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:center; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); pointer-events:none; }
  .nav-cluster{ pointer-events:auto; display:flex; align-items:center; gap:6px; background: var(--nav-bg); border:1px solid var(--surface-border-hi); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border-radius: 20px; padding:8px; box-shadow: var(--shadow-md); }
  .nav-btn{ appearance:none; cursor:pointer; border:none; background:transparent; color:var(--text-dim); width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; transition:.15s ease; flex:none; }
  .nav-btn:hover{ background:var(--surface-hi); color:var(--text); }
  .nav-btn svg{ width:19px; height:19px; }
  .nav-btn.primary{ width:auto; padding:0 22px; height:48px; border-radius:15px; gap:8px; background: var(--emerald); color:var(--emerald-ink); font-weight:800; font-family:'Manrope'; font-size:13.5px; box-shadow: 0 10px 22px -8px color-mix(in srgb, var(--emerald) 55%, transparent); }
  .nav-btn.primary:hover{ filter:brightness(1.06); }
  .nav-sep{ width:1px; height:26px; background:var(--surface-border); margin:0 2px; }

  /* ---------- Grid mode ---------- */
  .grid-view{ max-width:1180px; margin:0 auto; padding: 22px 16px 10px; width:100%; }
  .grid-cards{ display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
  .grid-section-header{ grid-column: 1 / -1; display:flex; align-items:baseline; gap:10px; margin: 6px 0 -2px; padding-bottom:8px; border-bottom:1px solid var(--surface-border); }
  .grid-section-header:first-child{ margin-top:0; }
  .grid-section-header h2{ font-family:'Manrope'; font-weight:800; font-size:14px; margin:0; color:var(--text); }

  .mini-card{ position:relative; min-height:210px; border-radius:16px; background: linear-gradient(160deg, var(--surface-hi), var(--surface)); border:1px solid var(--surface-border); padding:16px; cursor:pointer; display:flex; flex-direction:column; transition: transform .18s ease, border-color .18s ease; }
  .mini-card:hover{ transform: translateY(-2px); border-color:var(--surface-border-hi); }
  .mini-card .tag{ font-size:9px; padding:4px 8px; align-self:flex-start; }
  .mini-card .mini-idx{ position:absolute; top:14px; right:14px; font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-mute); }
  .mini-front{ font-family:'Manrope'; font-weight:800; font-size:14px; line-height:1.4; margin-top:10px; flex:1; }
  .mini-back{ font-size:12px; line-height:1.5; color:var(--text-dim); margin-top:10px; display:none; flex:1; overflow-y:auto; max-height:260px; }
  .mini-back .kw{ font-family:'IBM Plex Mono'; font-size:9.5px; font-weight:600; color:var(--emerald); background:var(--emerald-dim); border:1px solid color-mix(in srgb, var(--emerald) 35%, transparent); padding:2px 7px; border-radius:99px; display:inline-block; margin:2px 3px 2px 0; }
  .mini-card.flipped .mini-front{ display:none; }
  .mini-card.flipped .mini-back{ display:block; }
  .mini-flip-note{ font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--text-mute); margin-top:10px; }
  .mini-status{ position:absolute; top:14px; left:14px; width:8px; height:8px; border-radius:50%; }

  .empty-state{ text-align:center; padding: 60px 20px; color:var(--text-mute); font-family:'IBM Plex Mono'; font-size:13px; grid-column: 1/-1; }

  .face-body::-webkit-scrollbar, .mini-back::-webkit-scrollbar{ width:6px; }

  }

<script>
(function(){

  /* ===================== CARD DATA ===================== */
  var CARDS = [
    {cat:"Meaning & Marketing Philosophies", tag:"board", tagLabel:"Board Case Clue", front:"What is Marketing?",
     back:"<div class=\"def\">A social process by which individuals/groups obtain what they need and want through creating, offering and exchanging products of value with others — a total system of business activities, not just selling/advertising.</div><div class=\"kw-row\"><span class=\"kw\">Marketing</span><span class=\"kw\">social process</span></div>"},
    {cat:"Meaning & Marketing Philosophies", tag:"pitfall", tagLabel:"Distinction", front:"Distinction: Marketing vs Selling",
     back:"<div class=\"callout\"><div class=\"callout-label\">Marketing vs Selling</div><ul class=\"pts\"><li><b>Selling</b> focuses on the NEEDS OF THE SELLER, i.e. converting the product into cash; starts and ends with the product.</li><li><b>Marketing</b> focuses on the NEEDS OF THE BUYER; starts with identifying customer needs and ends with satisfying them — selling is only ONE part of the broader marketing process.</li></ul></div>"},
    {cat:"Meaning & Marketing Philosophies", tag:"board", tagLabel:"Board Case Clue", front:"Marketing Philosophy: Production Concept",
     back:"<div class=\"def\">Holds that consumers favour products that are easily available and highly affordable, so management's task is to improve production and distribution efficiency — focus is on internal capabilities, not customer needs.</div><div class=\"kw-row\"><span class=\"kw\">Production Concept</span></div>"},
    {cat:"Meaning & Marketing Philosophies", tag:"board", tagLabel:"Board Case Clue", front:"Marketing Philosophy: Product Concept",
     back:"<div class=\"def\">Holds that consumers favour products offering the most quality, performance and features, so the organisation should devote its energy to making continuous product improvements — risk of 'marketing myopia' (ignoring what the customer actually wants).</div><div class=\"kw-row\"><span class=\"kw\">Product Concept</span><span class=\"kw\">marketing myopia</span></div>"},
    {cat:"Meaning & Marketing Philosophies", tag:"board", tagLabel:"Board Case Clue", front:"Marketing Philosophy: Selling Concept",
     back:"<div class=\"def\">Holds that consumers will not buy enough of an organisation's products unless it undertakes a large-scale selling/promotion effort — the focus is on aggressively selling whatever is produced, rather than making what the market wants.</div><div class=\"kw-row\"><span class=\"kw\">Selling Concept</span></div>"},
    {cat:"Meaning & Marketing Philosophies", tag:"board", tagLabel:"Board Case Clue", front:"Marketing Philosophy: Marketing Concept (and Societal Marketing)",
     back:"<div class=\"def\">Holds that achieving organisational goals depends on determining the needs/wants of the target market and satisfying them MORE effectively than competitors. Societal Marketing Concept adds a further dimension: also considering the long-term welfare of society/consumers, not just immediate satisfaction.</div><div class=\"kw-row\"><span class=\"kw\">Marketing Concept</span><span class=\"kw\">Societal Marketing Concept</span></div>"},
    {cat:"Marketing Mix — Overview", tag:"cuet", tagLabel:"CUET Fact", front:"What is Marketing Mix?",
     back:"<div class=\"def\">The set of marketing tools that a firm uses to pursue its marketing objectives in the target market — commonly referred to as the 4 Ps: <b>Product, Price, Place, Promotion</b>.</div><div class=\"kw-row\"><span class=\"kw\">Marketing Mix</span><span class=\"kw\">4 Ps</span></div>"},
    {cat:"Marketing Mix — Overview", tag:"cuet", tagLabel:"CUET Fact", front:"Marketing Mix — quick recall",
     back:"<div class=\"def\"><b>Product:</b> what is offered. <b>Price:</b> what is charged. <b>Place:</b> how it reaches the customer (distribution). <b>Promotion:</b> how the customer is informed/persuaded.</div><div class=\"kw-row\"><span class=\"kw\">4 Ps summary</span></div>"},
    {cat:"Marketing Mix — Overview", tag:"cuet", tagLabel:"CUET Fact", front:"Elements of the Marketing Mix — the 4 Ps as sub-mixes",
     back:"<div class=\"def\">Each 'P' is itself a mix of decisions: Product Mix (variety, quality, branding, packaging, labelling), Price Mix (list price, discounts), Place Mix (channels, physical distribution), Promotion Mix (advertising, personal selling, sales promotion, publicity).</div><div class=\"kw-row\"><span class=\"kw\">sub-mixes of the 4 Ps</span></div>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"board", tagLabel:"Board Case Clue", front:"What is a Product?",
     back:"<div class=\"def\">Anything that can be offered to a market for attention, acquisition, use, or consumption, that might satisfy a need or want — includes physical goods, services, ideas, and experiences.</div><div class=\"kw-row\"><span class=\"kw\">Product</span></div>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"board", tagLabel:"Board Case Clue", front:"What is Branding?",
     back:"<div class=\"def\">The process of giving a name/sign/symbol/design (or combination) to a product to identify the goods of one seller and differentiate them from those of the competitors — a BRAND is the name/symbol used for this purpose.</div><div class=\"kw-row\"><span class=\"kw\">Branding</span></div>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"board", tagLabel:"Board Case Clue", front:"Importance of Branding",
     back:"<ul class=\"pts\"><li>Helps the seller in the promotion of the product, since it is easier to advertise a branded product.</li><li>Helps in bringing repeat sales, i.e. it inspires confidence and creates customer loyalty.</li><li>Helps the buyer in the sense that they get an assurance of consistent quality when purchasing a well-known brand.</li></ul>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"board", tagLabel:"Board Case Clue", front:"Qualities of a Good Brand Name",
     back:"<ul class=\"pts\"><li>Should be short and simple, easy to pronounce, spell, recognise and remember.</li><li>Should suggest something about the product's qualities/characteristics/benefits.</li><li>Should be distinctive, capable of registration and legal protection.</li><li>Should be adaptable to packaging/labelling needs and to any advertising medium.</li></ul>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"board", tagLabel:"Board Case Clue", front:"What is Labelling?",
     back:"<div class=\"def\">The process of designing and putting together identifying information on the package/label of the product — a label may be a simple tag or an elaborately designed graphic that is part of the package.</div><div class=\"kw-row\"><span class=\"kw\">Labelling</span></div>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"board", tagLabel:"Board Case Clue", front:"Functions of Labelling",
     back:"<ul class=\"pts\"><li><b>Describes</b> the product and specifies its contents, and gives information about its use/care.</li><li><b>Identifies</b> the product/brand, and grades the product (e.g. XXX, Grade I).</li><li><b>Promotes</b> the product through attractive graphics, and helps consumers in their choice by providing information.</li></ul>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"board", tagLabel:"Board Case Clue", front:"What is Packaging?",
     back:"<div class=\"def\">The activities of designing and producing the container/wrapper for a product — includes 3 levels: primary package (immediate container of the product), secondary package (extra layer of protection), and shipping/transportation package.</div><div class=\"kw-row\"><span class=\"kw\">Packaging</span></div>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"board", tagLabel:"Board Case Clue", front:"Importance of Packaging (Part 1)",
     back:"<ul class=\"pts\"><li><b>Self-service:</b> in the era of self-service, an increasing number of products are sold on a self-service basis, so packaging plays a very significant role.</li><li><b>Affluence:</b> increasing affluence of consumers means they are willing to pay a little more for the convenience/appearance of better packages.</li></ul>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"board", tagLabel:"Board Case Clue", front:"Importance of Packaging (Part 2)",
     back:"<ul class=\"pts\"><li><b>Company and brand image:</b> well-designed packages help create instant brand recognition, adding to company/brand image.</li><li><b>Innovation opportunity:</b> innovative packaging can bring significant benefits to consumers and profits to producers.</li></ul>"},
    {cat:"Product (incl. Branding, Labelling, Packaging)", tag:"pitfall", tagLabel:"Distinction", front:"Distinction: Labelling vs Packaging",
     back:"<div class=\"callout\"><div class=\"callout-label\">Labelling vs Packaging</div><ul class=\"pts\"><li><b>Packaging</b> is the OUTER CONTAINER/WRAPPER that holds/protects the product.</li><li><b>Labelling</b> is the INFORMATION TAG/graphic on the package that describes/identifies the product.</li><li>Labelling is technically a PART of the overall packaging activity, not a separate physical layer.</li></ul></div>"},
    {cat:"Price", tag:"board", tagLabel:"Board Case Clue", front:"What is Price?",
     back:"<div class=\"def\">The amount of money that customers have to pay to obtain/use the product — the only element in the marketing mix that produces revenue; all other elements represent costs.</div><div class=\"kw-row\"><span class=\"kw\">Price</span><span class=\"kw\">only revenue-generating P</span></div>"},
    {cat:"Price", tag:"board", tagLabel:"Board Case Clue", front:"Factors Affecting Price of a Product (Part 1)",
     back:"<ul class=\"pts\"><li><b>Product cost:</b> sets the floor/minimum for the price — cost of raw material, labour, overheads.</li><li><b>The extent of competition:</b> higher competition in the market limits the flexibility to fix higher prices.</li><li><b>Purchasing power of customers:</b> the price must be within the reach of the target customers.</li></ul>"},
    {cat:"Price", tag:"board", tagLabel:"Board Case Clue", front:"Factors Affecting Price of a Product (Part 2)",
     back:"<ul class=\"pts\"><li><b>Government and legal regulations:</b> government may control prices of some products in the interest of the general public (e.g. essential medicines).</li><li><b>Pricing objective:</b> if objective is quick recovery of investment (survival) prices may be lower; if objective is to build a premium brand image, prices may be higher.</li><li><b>Image of the firm:</b> firms with a reputable brand image may charge a premium price.</li></ul>"},
    {cat:"Price", tag:"cuet", tagLabel:"CUET Fact", front:"Importance of Price in the Marketing Mix",
     back:"<div class=\"def\">Price is a determinant of the firm's REVENUE (since revenue = price × quantity sold) and competitive position in the market, and it also plays a role in the buyer's PERCEPTION of quality of the product (a very low price may signal low quality).</div><div class=\"kw-row\"><span class=\"kw\">determines revenue</span></div>"},
    {cat:"Price", tag:"worked", tagLabel:"Example", front:"Worked Example: Applying a pricing factor",
     back:"<div class=\"def\">Case line: 'The company priced its new life-saving drug according to a government-mandated cap, despite higher production costs.'</div><div class=\"def\">Answer: This illustrates the factor <b>Government and Legal Regulations</b> affecting price — the government controls prices of essential goods like life-saving medicines in the public interest.</div>"},
    {cat:"Price", tag:"worked", tagLabel:"Example", front:"Worked Example: Pricing objective",
     back:"<div class=\"def\">Case line: 'A struggling new entrant priced its product very low, mainly to recover costs and stay afloat during its first year.'</div><div class=\"def\">Answer: This illustrates the pricing objective of <b>Survival</b> — the primary goal here is quick recovery of investment/staying in business, rather than profit maximisation or building a premium image.</div>"},
    {cat:"Place — Channels of Distribution", tag:"board", tagLabel:"Board Case Clue", front:"What are Channels of Distribution?",
     back:"<div class=\"def\">The set of firms/individuals that take on the title, or assist in transferring the title, of a particular good/service as it moves from the producer to the consumer — the 'Place' element of the marketing mix.</div><div class=\"kw-row\"><span class=\"kw\">Channels of Distribution</span></div>"},
    {cat:"Place — Channels of Distribution", tag:"board", tagLabel:"Board Case Clue", front:"Types of Channels: Zero-Level (Direct Channel)",
     back:"<div class=\"def\">The producer sells directly to the final consumer, with no intermediary involved — e.g. direct selling via a company-owned outlet or online store.</div><div class=\"kw-row\"><span class=\"kw\">Zero-Level Channel</span><span class=\"kw\">Direct</span></div>"},
    {cat:"Place — Channels of Distribution", tag:"board", tagLabel:"Board Case Clue", front:"Types of Channels: One-Level, Two-Level, Three-Level",
     back:"<ul class=\"pts\"><li><b>One-Level:</b> Producer → Retailer → Consumer.</li><li><b>Two-Level:</b> Producer → Wholesaler → Retailer → Consumer.</li><li><b>Three-Level:</b> Producer → Agent → Wholesaler → Retailer → Consumer (used when many small producers/consumers are spread over a large market).</li></ul>"},
    {cat:"Place — Channels of Distribution", tag:"cuet", tagLabel:"CUET Fact", front:"Functions of Distribution Channels",
     back:"<ul class=\"pts\"><li>Sorting: purchasing from many producers and breaking bulk for sale to many retailers/consumers.</li><li>Facilitates the physical distribution of the product to the final consumer.</li><li>Helps in promotion of the product; establishes contact and negotiates with prospective buyers.</li><li>Provides financing, and helps in risk-bearing (e.g. spoilage, obsolescence).</li></ul>"},
    {cat:"Place — Channels of Distribution", tag:"board", tagLabel:"Board Case Clue", front:"Factors Affecting Choice of Channel (Part 1)",
     back:"<ul class=\"pts\"><li><b>Product-related factors:</b> perishable products need shorter channels; complex/technical products need specialised sellers.</li><li><b>Company characteristics:</b> a financially strong company may prefer a shorter channel to have more control.</li></ul>"},
    {cat:"Place — Channels of Distribution", tag:"board", tagLabel:"Board Case Clue", front:"Factors Affecting Choice of Channel (Part 2)",
     back:"<ul class=\"pts\"><li><b>Competitive factors:</b> distribution strategy adopted by competitors also affects choice of channel.</li><li><b>Market factors:</b> a large market spread over a wide geographical area may need longer channels; the number of potential customers matters too.</li><li><b>Environmental factors:</b> during a depression, cheaper/shorter channels are preferred.</li></ul>"},
    {cat:"Place — Channels of Distribution", tag:"board", tagLabel:"Board Case Clue", front:"Physical Distribution: Order Processing",
     back:"<div class=\"def\">The first step in physical distribution — the cycle of activities beginning with the receipt of an order and ending with delivery of goods to the customer; efficient order processing reduces the overall order cycle time.</div><div class=\"kw-row\"><span class=\"kw\">Order Processing</span></div>"},
    {cat:"Place — Channels of Distribution", tag:"board", tagLabel:"Board Case Clue", front:"Physical Distribution: Transportation",
     back:"<div class=\"def\">Involves the physical movement of goods from one place to another — adds 'place utility' by making the product available where it is needed. Modes include railways, roadways, waterways, airways and pipelines.</div><div class=\"kw-row\"><span class=\"kw\">Transportation</span><span class=\"kw\">place utility</span></div>"},
    {cat:"Place — Channels of Distribution", tag:"board", tagLabel:"Board Case Clue", front:"Physical Distribution: Warehousing and Inventory Control",
     back:"<div class=\"def\">Warehousing refers to the storage of goods from the time of production till their sale, adding 'time utility'. Inventory control ensures adequate stock is maintained — neither too much (blocking funds) nor too little (leading to stock-outs).</div><div class=\"kw-row\"><span class=\"kw\">Warehousing</span><span class=\"kw\">time utility</span><span class=\"kw\">Inventory Control</span></div>"},
    {cat:"Promotion", tag:"board", tagLabel:"Board Case Clue", front:"What is Promotion?",
     back:"<div class=\"def\">The process of informing, persuading and influencing a choice — the 4 tools of promotion are Advertising, Personal Selling, Sales Promotion, and Publicity, together called the 'Promotion Mix'.</div><div class=\"kw-row\"><span class=\"kw\">Promotion Mix</span><span class=\"kw\">advertising, personal selling, sales promotion, publicity</span></div>"},
    {cat:"Promotion", tag:"board", tagLabel:"Board Case Clue", front:"What is Advertising?",
     back:"<div class=\"def\">Any paid form of non-personal presentation and promotion of ideas, goods or services by an identified sponsor — it is impersonal (not directed at one person) and has a wide reach.</div><div class=\"kw-row\"><span class=\"kw\">Advertising</span><span class=\"kw\">paid, non-personal</span></div>"},
    {cat:"Promotion", tag:"board", tagLabel:"Board Case Clue", front:"Merits of Advertising",
     back:"<ul class=\"pts\"><li>Being non-personal in nature, advertising can reach a large number of people at a fairly quick pace.</li><li>Since the cost is spread over a large audience, cost per head reached is often quite low.</li><li>It introduces new products and educates people about their utility.</li><li>It results in economies of large-scale production, and helps a firm face competition better.</li></ul>"},
    {cat:"Promotion", tag:"board", tagLabel:"Board Case Clue", front:"Limitations / Objections to Advertising",
     back:"<ul class=\"pts\"><li><b>Adds to the cost</b> of the product, which is ultimately borne by the consumer.</li><li><b>Undermines social values</b> by encouraging materialism and showing an artificial/unreal picture of life.</li><li><b>May encourage the sale of inferior products</b> through exaggerated claims.</li><li><b>Confuses rather than assists in buying decisions</b> due to conflicting claims made by advertisers of competing products.</li></ul>"},
    {cat:"Promotion", tag:"board", tagLabel:"Board Case Clue", front:"What is Personal Selling?",
     back:"<div class=\"def\">A process of informing customers and persuading them to purchase products through personal (face-to-face) communication in an exchange situation — involves oral, face-to-face conversation between a salesperson and prospective customer.</div><div class=\"kw-row\"><span class=\"kw\">Personal Selling</span><span class=\"kw\">face-to-face</span></div>"},
    {cat:"Promotion", tag:"board", tagLabel:"Board Case Clue", front:"Features of Personal Selling",
     back:"<ul class=\"pts\"><li>It is a personal/face-to-face communication, allowing for more flexible/adaptable interaction.</li><li>It develops relationships, as it involves a personal, two-way interaction over time.</li><li>It leads to actual sales of goods/services, since it also involves a certain degree of persuasion.</li></ul>"},
    {cat:"Promotion", tag:"board", tagLabel:"Board Case Clue", front:"What is Sales Promotion?",
     back:"<div class=\"def\">Short-term, usually consumer-oriented, incentives to encourage the purchase of a product — designed to boost sales quickly, e.g. rebates, discounts, contests, free samples, instalment schemes.</div><div class=\"kw-row\"><span class=\"kw\">Sales Promotion</span><span class=\"kw\">short-term incentives</span></div>"},
    {cat:"Promotion", tag:"board", tagLabel:"Board Case Clue", front:"Techniques of Sales Promotion",
     back:"<ul class=\"pts\"><li><b>Rebate:</b> price offered lower than what was originally advertised/marked, generally for clearing excess stock.</li><li><b>Discount:</b> a certain percentage/proportion given off the listed price to consumers.</li><li><b>Refund:</b> offering to refund a part of the price paid by consumers on purchase of a specific quantity.</li><li><b>Quantity gift/free samples:</b> giving an extra item free of cost, or letting customers try a small quantity for free.</li></ul>"},
    {cat:"Promotion", tag:"board", tagLabel:"Board Case Clue", front:"What is Publicity?",
     back:"<div class=\"def\">A non-personal form of promotion, which is NOT PAID for by the organisation (unlike advertising) — generally in the form of a news item/story regarding an organisation/its products, e.g. an article in a newspaper about a company's CSR activity.</div><div class=\"kw-row\"><span class=\"kw\">Publicity</span><span class=\"kw\">not paid for</span></div>"},
    {cat:"Promotion", tag:"pitfall", tagLabel:"Distinction", front:"Distinction: Advertising vs Publicity",
     back:"<div class=\"callout\"><div class=\"callout-label\">Advertising vs Publicity</div><ul class=\"pts\"><li><b>Advertising</b> is PAID and the sponsor is clearly IDENTIFIED and has full control over the content.</li><li><b>Publicity</b> is NOT PAID for by the company, and the company has LITTLE/NO control over what is published or how — usually media-driven.</li></ul></div>"},
    {cat:"Case Study Toolkit", tag:"cuet", tagLabel:"CUET Fact", front:"Exam Technique: Identifying which 'P' of the marketing mix is described",
     back:"<div class=\"def\">Ask: is this about the good/service itself (Product), what is charged (Price), how it reaches the customer (Place), or how the customer is informed/persuaded (Promotion)?</div><div class=\"kw-row\"><span class=\"kw\">4 Ps identification test</span></div>"},
    {cat:"Case Study Toolkit", tag:"cuet", tagLabel:"CUET Fact", front:"Keyword-to-Concept Quick Map (Part 1)",
     back:"<div class=\"callout\"><div class=\"callout-label\">Case clue → Concept</div><ul class=\"pts\"><li>'Company designs an eye-catching, informative wrapper for its snack product' → Packaging + Labelling (Product)</li><li>'Firm reduces price temporarily to clear excess festive-season stock' → Rebate (Sales Promotion)</li><li>'Salesperson visits homes to demonstrate and sell a vacuum cleaner directly' → Personal Selling</li><li>'A newspaper runs a story praising the company's disaster-relief work, unpaid' → Publicity</li><li>'Company sells directly to consumers through its own website, no middlemen' → Zero-Level (Direct) Channel</li></ul></div>"},
    {cat:"Case Study Toolkit", tag:"cuet", tagLabel:"CUET Fact", front:"Keyword-to-Concept Quick Map (Part 2)",
     back:"<div class=\"callout\"><div class=\"callout-label\">Case clue → Concept</div><ul class=\"pts\"><li>'Firm only focuses on making a technically superior product but ignores what customers actually want' → Product Concept (risk of marketing myopia)</li><li>'Firm pushes aggressive sales tactics to offload existing inventory' → Selling Concept</li><li>'Firm studies customer needs first, then designs and sells accordingly' → Marketing Concept</li><li>'Perishable vegetables are sold through the shortest possible channel' → Product-related factor in Channel choice</li></ul></div>"},
    {cat:"Case Study Toolkit", tag:"pitfall", tagLabel:"Distinction", front:"Common Pitfall: Sales Promotion vs Advertising",
     back:"<div class=\"callout\"><div class=\"callout-label\">Don't mix these up</div><ul class=\"pts\"><li><b>Advertising</b> builds long-term BRAND IMAGE and awareness over time.</li><li><b>Sales Promotion</b> is a SHORT-TERM tactic aimed at an immediate boost in sales (discounts, contests, free samples).</li><li>A case describing a TV brand campaign = Advertising; a case describing a 'buy-one-get-one' offer this week only = Sales Promotion.</li></ul></div>"},
    {cat:"Case Study Toolkit", tag:"worked", tagLabel:"Example", front:"Worked Example: Applying the 4 Ps to a case",
     back:"<div class=\"def\">Case line: 'The FMCG company launched a premium shampoo (differentiated formula), priced it higher than rivals to signal quality, distributed it through select department stores, and ran a celebrity-endorsed TV campaign.'</div><div class=\"def\">Answer: <b>Product</b> = differentiated formula/premium positioning; <b>Price</b> = higher price signalling quality; <b>Place</b> = select department stores (channel choice); <b>Promotion</b> = celebrity-endorsed TV advertising.</div>"},
    {cat:"Case Study Toolkit", tag:"worked", tagLabel:"Example", front:"Worked Example: Applying Marketing vs Selling",
     back:"<div class=\"def\">Case line: 'Before launching, the company conducted extensive research on what fragrance and packaging customers in that region preferred, and designed the product accordingly.'</div><div class=\"def\">Answer: This illustrates the <b>Marketing Concept</b> (and the broader Marketing philosophy vs Selling) — the company started with identifying CUSTOMER NEEDS first, rather than making a product and then pushing it onto customers.</div>"},
    {cat:"Case Study Toolkit", tag:"cuet", tagLabel:"CUET Fact", front:"Answer-Writing Format for Marketing Management Case Questions",
     back:"<ol class=\"steps\"><li>Identify and NAME the exact 'P' / concept / technique being described.</li><li>QUOTE or paraphrase the specific line/clue from the case that supports your identification.</li><li>EXPLAIN briefly, in 1-2 lines, what the concept means and why the clue matches it.</li></ol><div class=\"kw-row\"><span class=\"kw\">Name → Quote → Explain</span></div>"},
  ];

  CARDS.forEach(function(c, i){ c.id = i; });

  /* ===================== STATE ===================== */
  var status = {};
  var order = CARDS.map(function(c){ return c.id; });
  var isShuffled = false;
  var curPos = 0;
  var mode = 'study';
  var filter = 'all';
  var typeFilter = 'all';
  var topicFilter = 'all';
  var flipped = false;

  var CATEGORIES = (function(){
    var seen = [], set = {};
    CARDS.forEach(function(c){ if(!set[c.cat]){ set[c.cat] = true; seen.push(c.cat); } });
    return seen;
  })();

  var CHAPTER_ID = 'marketing-management';
  var STORAGE_KEY = 'bst-flashcards-' + CHAPTER_ID + '-status';
  var STREAK_KEY = 'bst-flashcards-' + CHAPTER_ID + '-streak';
  function loadStatus(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) status = JSON.parse(raw) || {};
    }catch(e){ status = {}; }
  }
  function saveStatus(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(status)); }catch(e){}
  }
  loadStatus();

  var streak = 0;
  try{ streak = parseInt(localStorage.getItem(STREAK_KEY), 10) || 0; }catch(e){ streak = 0; }
  function saveStreak(){ try{ localStorage.setItem(STREAK_KEY, String(streak)); }catch(e){} }
  var shownMilestones = {};

  /* ===================== Theme (Light / Dark / Auto) ===================== */
  var THEME_KEY = 'bst-flashcards-' + CHAPTER_ID + '-theme';
  var THEME_ORDER = ['system', 'light', 'dark'];
  var THEME_TITLE = { system:'Theme: Auto (follows device)', light:'Theme: Light', dark:'Theme: Dark' };
  var themeToggle = document.getElementById('themeToggle');

  function applyTheme(t){
    if(t === 'dark' || t === 'light'){
      document.documentElement.setAttribute('data-theme', t);
    } else {
      document.documentElement.removeAttribute('data-theme');
      t = 'system';
    }
    if(themeToggle){
      themeToggle.setAttribute('data-theme-state', t);
      themeToggle.setAttribute('title', THEME_TITLE[t]);
    }
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  }
  (function initTheme(){
    var saved = 'system';
    try{ saved = localStorage.getItem(THEME_KEY) || 'system'; }catch(e){}
    applyTheme(saved);
  })();
  if(themeToggle){
    themeToggle.addEventListener('click', function(){
      var current = themeToggle.getAttribute('data-theme-state') || 'system';
      var next = THEME_ORDER[(THEME_ORDER.indexOf(current) + 1) % THEME_ORDER.length];
      applyTheme(next);
    });
  }

  /* ===================== DOM refs ===================== */
  var el = {
    card: document.getElementById('card'),
    frontTag: document.getElementById('frontTag'),
    frontCat: document.getElementById('frontCat'),
    frontPrompt: document.getElementById('frontPrompt'),
    backTag: document.getElementById('backTag'),
    backContent: document.getElementById('backContent'),
    backStatusDot: document.getElementById('backStatusDot'),
    progressFill: document.getElementById('progressFill'),
    progressLabel: document.getElementById('progressLabel'),
    studyView: document.getElementById('studyView'),
    gridView: document.getElementById('gridView'),
    gridCards: document.getElementById('gridCards'),
    gridEmpty: document.getElementById('gridEmpty'),
    btnPrev: document.getElementById('btnPrev'),
    btnNext: document.getElementById('btnNext'),
    btnFlip: document.getElementById('btnFlip'),
    btnShuffle: document.getElementById('btnShuffle'),
    shuffleChip: document.getElementById('shuffleChip'),
    resetOrderChip: document.getElementById('resetOrderChip'),
    btnReview: document.getElementById('btnReview'),
    btnMastered: document.getElementById('btnMastered'),
    studyNav: document.getElementById('studyNav'),
    cntAll: document.getElementById('cnt-all'),
    cntReview: document.getElementById('cnt-review'),
    cntMastered: document.getElementById('cnt-mastered'),
    topicSelect: document.getElementById('topicSelect'),
    streakChip: document.getElementById('streakChip'),
    streakCount: document.getElementById('streakCount'),
    masteryFill: document.getElementById('masteryFill'),
    masteryLabel: document.getElementById('masteryLabel'),
    levelBadge: document.getElementById('levelBadge'),
    toastStack: document.getElementById('toastStack'),
    burstLayer: document.getElementById('burstLayer'),
    filtersToggle: document.getElementById('filtersToggle'),
    filtersPanel: document.getElementById('filtersPanel'),
    activeFilterCount: document.getElementById('activeFilterCount')
  };

  var tagClass = { board:'board', cuet:'cuet', process:'process', pitfall:'pitfall', worked:'worked' };

  function passesFilters(id){
    var c = CARDS[id];
    if(filter === 'mastered' && status[id] !== 'mastered') return false;
    if(filter === 'review' && status[id] !== 'review') return false;
    if(typeFilter !== 'all' && c.tag !== typeFilter) return false;
    if(topicFilter !== 'all' && c.cat !== topicFilter) return false;
    return true;
  }
  function visibleIds(){ return order.filter(passesFilters); }

  function renderCounts(){
    var mastered = 0, review = 0;
    var typeCounts = { board:0, cuet:0, process:0, pitfall:0, worked:0 };
    CARDS.forEach(function(c){
      if(status[c.id] === 'mastered') mastered++;
      else if(status[c.id] === 'review') review++;
      typeCounts[c.tag]++;
    });
    el.cntAll.textContent = CARDS.length;
    el.cntReview.textContent = review;
    el.cntMastered.textContent = mastered;
    Object.keys(typeCounts).forEach(function(t){
      var node = document.getElementById('cnt-type-' + t);
      if(node) node.textContent = typeCounts[t];
    });
    updateMasteryUI(mastered);
    updateActiveFilterCount();
  }

  function updateActiveFilterCount(){
    var n = 0;
    if(filter !== 'all') n++;
    if(typeFilter !== 'all') n++;
    if(topicFilter !== 'all') n++;
    if(n > 0){
      el.activeFilterCount.style.display = 'inline';
      el.activeFilterCount.textContent = n + ' active';
    } else {
      el.activeFilterCount.style.display = 'none';
    }
  }

  function initTopicSelect(){
    CATEGORIES.forEach(function(cat){
      var count = CARDS.filter(function(c){ return c.cat === cat; }).length;
      var opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat + ' (' + count + ')';
      el.topicSelect.appendChild(opt);
    });
  }
  initTopicSelect();

  /* ===================== Gamification ===================== */
  var LEVELS = [
    { min: 0,   cls:'lv-rookie', label:'Rookie' },
    { min: 25,  cls:'lv-solid',  label:'Warming Up' },
    { min: 50,  cls:'lv-sharp',  label:'Sharp' },
    { min: 75,  cls:'lv-ace',    label:'Ace' },
    { min: 100, cls:'lv-ace',    label:'Mastered ⭐' }
  ];
  var lastPct = -1;

  function updateMasteryUI(mastered){
    var total = CARDS.length || 1;
    var pct = Math.round((mastered / total) * 100);
    if(el.masteryFill) el.masteryFill.style.width = pct + '%';
    if(el.masteryLabel) el.masteryLabel.textContent = mastered + ' / ' + CARDS.length + ' mastered';
    if(el.levelBadge){
      var lvl = LEVELS[0];
      LEVELS.forEach(function(l){ if(pct >= l.min) lvl = l; });
      el.levelBadge.textContent = lvl.label;
      el.levelBadge.className = 'level-badge ' + lvl.cls;
    }
    checkMilestones(pct, mastered, total);
    lastPct = pct;
  }

  function checkMilestones(pct, mastered, total){
    if(lastPct < 0) return;
    [25, 50, 75].forEach(function(m){
      if(pct >= m && lastPct < m && !shownMilestones['pct'+m]){
        shownMilestones['pct'+m] = true;
        showToast('💪 ' + m + '% of the chapter mastered — keep going!');
      }
    });
    if(mastered === total && total > 0 && lastPct < 100 && !shownMilestones.complete){
      shownMilestones.complete = true;
      showToast('🏆 Deck cleared! Every card in this chapter is mastered.');
      spawnBurst();
    }
  }

  function updateStreakUI(){
    if(!el.streakChip) return;
    el.streakCount.textContent = streak;
    el.streakChip.classList.toggle('hot', streak >= 3);
    if(streak > 0 && streak % 5 === 0 && !shownMilestones['streak'+streak]){
      shownMilestones['streak'+streak] = true;
      showToast('🔥 ' + streak + ' in a row! You are on fire.');
    }
  }

  function showToast(text){
    if(!el.toastStack) return;
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    el.toastStack.appendChild(t);
    setTimeout(function(){
      t.classList.add('leaving');
      setTimeout(function(){ t.remove(); }, 320);
    }, 2600);
  }

  function spawnBurst(){
    if(!el.burstLayer) return;
    var colors = ['var(--emerald)', 'var(--amber)', 'var(--cyan)', 'var(--violet)'];
    for(var i = 0; i < 26; i++){
      var p = document.createElement('div');
      p.className = 'burst-piece';
      var angle = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 160;
      p.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist - 40) + 'px');
      p.style.setProperty('--rot', (Math.random()*520 - 260) + 'deg');
      p.style.background = colors[i % colors.length];
      p.style.borderRadius = (i % 3 === 0) ? '50%' : '2px';
      p.style.left = (45 + Math.random()*10) + '%';
      p.style.top = '38%';
      el.burstLayer.appendChild(p);
      (function(node){ setTimeout(function(){ node.remove(); }, 950); })(p);
    }
  }

  function typeset(){ /* no-op: no math rendering needed for this subject */ }

  function clampPos(){
    var ids = visibleIds();
    if(ids.length === 0){ curPos = 0; return; }
    if(curPos >= ids.length) curPos = ids.length - 1;
    if(curPos < 0) curPos = 0;
  }

  function renderStudy(){
    var ids = visibleIds();
    clampPos();
    if(ids.length === 0){
      el.frontPrompt.textContent = 'No cards in this filter yet.';
      el.frontTag.textContent = '—';
      el.frontCat.textContent = '';
      el.backContent.textContent = 'Switch filters above to keep studying.';
      el.progressLabel.textContent = '0 of 0';
      el.progressFill.style.width = '0%';
      return;
    }
    var id = ids[curPos];
    var c = CARDS[id];
    flipped = false;
    el.card.classList.remove('flipped');

    el.frontTag.textContent = c.tagLabel;
    el.frontTag.className = 'tag ' + tagClass[c.tag];
    el.frontCat.textContent = c.cat;
    el.frontPrompt.innerHTML = c.front;

    el.backTag.textContent = c.tagLabel;
    el.backTag.className = 'tag ' + tagClass[c.tag];
    el.backContent.innerHTML = c.back;

    var st = status[c.id];
    el.backStatusDot.className = 'status-dot' + (st ? ' ' + st : '');
    el.btnReview.classList.toggle('active', st === 'review');
    el.btnMastered.classList.toggle('active', st === 'mastered');

    el.progressLabel.textContent = 'Card ' + (curPos+1) + ' of ' + ids.length;
    el.progressFill.style.width = (((curPos+1)/ids.length)*100) + '%';
    typeset();
  }

  function renderGrid(){
    var visible = {};
    visibleIds().forEach(function(id){ visible[id] = true; });
    el.gridCards.innerHTML = '';
    var shown = 0;
    CATEGORIES.forEach(function(cat){
      var catIds = CARDS.filter(function(c){ return c.cat === cat && visible[c.id]; }).map(function(c){ return c.id; });
      if(catIds.length === 0) return;
      var header = document.createElement('div');
      header.className = 'grid-section-header';
      header.innerHTML = '<h2>' + cat + '</h2><span class="n">' + catIds.length + ' card' + (catIds.length === 1 ? '' : 's') + '</span>';
      el.gridCards.appendChild(header);
      catIds.forEach(function(id){
        shown++;
        var c = CARDS[id];
        var st = status[c.id];
        var wrap = document.createElement('div');
        wrap.className = 'mini-card';
        wrap.innerHTML =
          '<div class="mini-status ' + (st||'') + '"></div>' +
          '<div class="mini-idx">#' + (id+1) + '</div>' +
          '<span class="tag ' + tagClass[c.tag] + '">' + c.tagLabel + '</span>' +
          '<div class="mini-front">' + c.front + '</div>' +
          '<div class="mini-back">' + c.back + '</div>' +
          '<div class="mini-flip-note">TAP TO FLIP</div>';
        wrap.addEventListener('click', function(){
          wrap.classList.toggle('flipped');
          typeset();
        });
        el.gridCards.appendChild(wrap);
      });
    });
    el.gridEmpty.style.display = shown ? 'none' : 'block';
    typeset();
  }

  function render(){
    renderCounts();
    if(mode === 'study') renderStudy();
    else renderGrid();
  }

  /* ===================== Interactions ===================== */
  el.card.addEventListener('click', function(){
    flipped = !flipped;
    el.card.classList.toggle('flipped', flipped);
  });
  el.btnFlip.addEventListener('click', function(e){
    e.stopPropagation();
    flipped = !flipped;
    el.card.classList.toggle('flipped', flipped);
  });

  function go(delta){
    var ids = visibleIds();
    if(ids.length === 0) return;
    curPos = (curPos + delta + ids.length) % ids.length;
    renderStudy();
  }
  el.btnPrev.addEventListener('click', function(){ go(-1); });
  el.btnNext.addEventListener('click', function(){ go(1); });

  function shuffle(){
    var arr = order.slice();
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    order = arr;
    isShuffled = true;
    curPos = 0;
    el.resetOrderChip.style.display = 'inline-flex';
    render();
  }
  el.btnShuffle.addEventListener('click', shuffle);
  el.shuffleChip.addEventListener('click', shuffle);
  el.resetOrderChip.addEventListener('click', function(){
    order = CARDS.map(function(c){ return c.id; });
    isShuffled = false;
    curPos = 0;
    el.resetOrderChip.style.display = 'none';
    render();
  });

  function setStatusFor(id, value){
    var prev = status[id];
    if(prev === value){
      delete status[id];
      if(value === 'mastered'){ streak = Math.max(0, streak - 1); }
    } else {
      status[id] = value;
      if(value === 'mastered'){ streak++; }
      else { streak = 0; }
    }
    saveStatus();
    saveStreak();
    updateStreakUI();
    render();
  }
  el.btnReview.addEventListener('click', function(e){
    e.stopPropagation();
    var ids = visibleIds();
    if(!ids.length) return;
    setStatusFor(ids[curPos], 'review');
  });
  el.btnMastered.addEventListener('click', function(e){
    e.stopPropagation();
    var ids = visibleIds();
    if(!ids.length) return;
    setStatusFor(ids[curPos], 'mastered');
  });

  document.querySelectorAll('.mode-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.mode-tab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.getAttribute('data-mode');
      el.studyView.style.display = mode === 'study' ? 'flex' : 'none';
      el.gridView.style.display = mode === 'grid' ? 'block' : 'none';
      el.studyNav.style.display = mode === 'study' ? 'flex' : 'none';
      render();
    });
  });

  document.querySelectorAll('.chip[data-filter]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.chip[data-filter]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      filter = btn.getAttribute('data-filter');
      curPos = 0;
      render();
    });
  });

  document.querySelectorAll('.type-chip').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.type-chip').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      typeFilter = btn.getAttribute('data-type');
      curPos = 0;
      render();
    });
  });

  el.topicSelect.addEventListener('change', function(){
    topicFilter = el.topicSelect.value;
    curPos = 0;
    render();
  });

  /* Collapsible filters widget */
  el.filtersToggle.addEventListener('click', function(){
    var isOpen = el.filtersPanel.classList.toggle('open');
    el.filtersToggle.classList.toggle('open', isOpen);
    el.filtersToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  document.addEventListener('keydown', function(e){
    if(mode !== 'study') return;
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      flipped = !flipped;
      el.card.classList.toggle('flipped', flipped);
    } else if(e.code === 'ArrowLeft'){
      e.preventDefault(); go(-1);
    } else if(e.code === 'ArrowRight'){
      e.preventDefault(); go(1);
    } else if(e.key === 'r' || e.key === 'R'){
      e.preventDefault(); shuffle();
    }
  });

  updateStreakUI();
  render();
})();
</script>
</body>
</html>
